<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>ざざっ、ピン！しろい砂鉄のトゲみち</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:rgba(0,0,0,0)}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none;background:#000;outline:none}
#sa{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
(function(){
'use strict';
/* ============================================================
   ざざっ、ピン！しろい砂鉄のトゲみち
   format: canvas_draw / style: geo_mono / subject: no_animal_princess
   一本指でなぞる → 砂鉄が吸いついてトゲの道 → 球が走る → 描き足す
   ============================================================ */
var cv=document.getElementById('c');
var ctx=cv.getContext('2d',{alpha:false});
var TAU=Math.PI*2;
function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function sst(t){t=clamp(t,0,1);return t*t*(3-2*t)}
var hyp=Math.hypot||function(x,y){return Math.sqrt(x*x+y*y)};

/* ---------- 乱数（?seed= で再現可能） ---------- */
var qs;try{qs=new URLSearchParams(location.search)}catch(e){qs={get:function(){return null},has:function(){return false}}}
var seed=qs.has('seed')?((parseInt(qs.get('seed'),10)||1)|0):((Math.random()*2147483647)|0);
var seed0=seed;
function rnd(){seed=(seed+0x6D2B79F5)|0;var t=seed;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}

/* ---------- レイアウト ---------- */
var W=0,H=0,DPR=1,S=1,SA={t:0,r:0,b:0,l:0};
var SP,R_OVER,R_SNAP,R_CLOSE,R_ATT,GC=32;
var MAXN=1800,MAXG=1700,MAXFX=260,HMAX=2.0;
function setScale(){SP=10*S;R_OVER=15*S;R_SNAP=28*S;R_CLOSE=64*S;R_ATT=100*S;GC=32*S}
function readSafe(){
  try{var cs=getComputedStyle(document.getElementById('sa'));
    SA={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};
  }catch(e){SA={t:0,r:0,b:0,l:0}}
}

/* ---------- 状態 ---------- */
var gameTime=0,frame=0;
var nodes=[],edges=[],crossings=[],edgeCross=new Map(),grid=new Map();
var grains=[],G0=600,spawnAcc=0;
var balls=[],fx=[],bridges=[],ripples=[];
var ptr=null,tuft=null,bundle=0,strokeCount=0,lastInput=0,lastUp=-10;
var phase='draw',phaseT=0,K=0,magX=-1e4,towerHold=7,spreadP=0,ghostP=0;
var hint=null,hintT=0,scanT=0,spreadT=0,demo=null,demoShown=false,hintPulseT=0;
var cycles=0,pileAcc=null,pileFactor=1,storageOK=true;
var stats={taps:0,strokes:0,nodesMade:0,over:0,joins:0,bridges:0,loops:0,cross:0,hops:0,junction:0,switches:0,meets:0,towers:0,collapses:0,deadEnds:0,lastHop:null,lastChoice:null};

/* ---------- 空間グリッド（ノード） ---------- */
function gkey(gx,gy){return (gx+16)*8192+(gy+16)}
function gridAdd(id){var n=nodes[id];var k=gkey(Math.floor(n.x/GC),Math.floor(n.y/GC));var a=grid.get(k);if(!a){a=[];grid.set(k,a)}a.push(id)}
function rebuildGrid(){grid=new Map();for(var i=0;i<nodes.length;i++)gridAdd(i)}
function forNear(x,y,r,fn){
  var x0=Math.floor((x-r)/GC),x1=Math.floor((x+r)/GC),y0=Math.floor((y-r)/GC),y1=Math.floor((y+r)/GC);
  for(var gx=x0;gx<=x1;gx++)for(var gy=y0;gy<=y1;gy++){var a=grid.get(gkey(gx,gy));if(a)for(var i=0;i<a.length;i++)fn(a[i])}
}
function nearest(x,y,r,skip){
  var best=-1,bd=r*r;
  forNear(x,y,r,function(id){if(skip&&skip(id))return;var n=nodes[id];var dx=n.x-x,dy=n.y-y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=id}});
  return best;
}
function nearestGlobal(x,y){var best=-1,bd=1e18;for(var i=0;i<nodes.length;i++){var n=nodes[i];if(n.g<0.6||n.fall>=0)continue;var dx=n.x-x,dy=n.y-y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=i}}return best}

/* ---------- グラフ ---------- */
function ek(a,b){return a<b?a*65536+b:b*65536+a}
function addNode(x,y,h,sid){
  var n={x:x,y:y,h:h,g:0,sp:0,spv:5,sq:1,sid:sid,nb:[],boost:0,born:gameTime,rise:0,sw:0,swv:0,fall:-1,fdx:1,fdy:0,lean:0,leanT:0,lx:0,ly:0,busy:false};
  nodes.push(n);var id=nodes.length-1;gridAdd(id);stats.nodesMade++;return id;
}
function linked(a,b){return nodes[a].nb.indexOf(b)>=0}
function link(a,b){
  if(a===b||a<0||b<0||linked(a,b))return false;
  nodes[a].nb.push(b);nodes[b].nb.push(a);edges.push([a,b]);detectCross(a,b);return true;
}
function graphNear(a,b,k){
  if(a<0||b<0)return false;if(a===b)return true;
  var fr=[a],seen=[a];
  for(var d=0;d<k;d++){var nf=[];for(var i=0;i<fr.length;i++){var nb=nodes[fr[i]].nb;for(var j=0;j<nb.length;j++){var v=nb[j];if(v===b)return true;if(seen.indexOf(v)<0){seen.push(v);nf.push(v)}}}fr=nf;if(!fr.length)break}
  return false;
}
function pathBetween(a,b){
  if(a===b)return [a];
  var par=new Int32Array(nodes.length).fill(-2);par[a]=-1;var q=[a],qi=0;
  while(qi<q.length){var u=q[qi++];var nb=nodes[u].nb;for(var j=0;j<nb.length;j++){var v=nb[j];if(par[v]!==-2)continue;par[v]=u;if(v===b){var p=[],c=b;while(c!==-1){p.push(c);c=par[c]}return p}q.push(v)}}
  return null;
}
function tangent(id){
  var n=nodes[id],nb=n.nb,tx=1,ty=0;
  if(nb.length>=2){tx=nodes[nb[1]].x-nodes[nb[0]].x;ty=nodes[nb[1]].y-nodes[nb[0]].y}
  else if(nb.length===1){tx=n.x-nodes[nb[0]].x;ty=n.y-nodes[nb[0]].y}
  var l=hyp(tx,ty)||1;return [tx/l,ty/l];
}
function isParallel(id,ux,uy){if(!nodes[id].nb.length)return false;var t=tangent(id);return Math.abs(t[0]*ux+t[1]*uy)>0.85}
function segX(p,q,r,s){
  var d1x=q.x-p.x,d1y=q.y-p.y,d2x=s.x-r.x,d2y=s.y-r.y;var den=d1x*d2y-d1y*d2x;if(Math.abs(den)<1e-6)return null;
  var t=((r.x-p.x)*d2y-(r.y-p.y)*d2x)/den,u=((r.x-p.x)*d1y-(r.y-p.y)*d1x)/den;
  if(t<0||t>1||u<0||u>1)return null;return [t,u];
}
function detectCross(a,b){
  var A=nodes[a],B=nodes[b];var mx=(A.x+B.x)/2,my=(A.y+B.y)/2;var r=hyp(A.x-B.x,A.y-B.y)/2+R_SNAP+4*S;
  var checked=new Set();var na=A.nb,nbb=B.nb;
  forNear(mx,my,r,function(c){
    var C=nodes[c];
    for(var j=0;j<C.nb.length;j++){var d=C.nb[j];var key=ek(c,d);if(checked.has(key))continue;checked.add(key);
      if(c===a||c===b||d===a||d===b)continue;
      if(na.indexOf(c)>=0||na.indexOf(d)>=0||nbb.indexOf(c)>=0||nbb.indexOf(d)>=0)continue;
      var X=segX(A,B,C,nodes[d]);if(!X)continue;
      var x=lerp(A.x,B.x,X[0]),y=lerp(A.y,B.y,X[0]);
      var dup=false;for(var k=0;k<crossings.length;k++){var q=crossings[k];if(Math.abs(q.x-x)<12*S&&Math.abs(q.y-y)<12*S){dup=true;break}}
      if(dup)continue;
      var D=nodes[d];var ux=B.x-A.x,uy=B.y-A.y,ul=hyp(ux,uy)||1;ux/=ul;uy/=ul;var vx=D.x-C.x,vy=D.y-C.y,vl=hyp(vx,vy)||1;vx/=vl;vy/=vl;
      var ang=Math.acos(clamp(Math.abs(ux*vx+uy*vy),0,1));
      var cr={x:x,y:y,ang:ang,dA:[ux,uy],dB:[vx,vy],pulse:1,born:gameTime};
      crossings.push(cr);
      addCross(ek(a,b),{cr:cr,t:a<b?X[0]:1-X[0],other:1});
      addCross(ek(c,d),{cr:cr,t:c<d?X[1]:1-X[1],other:0});
      stats.cross++;sfxCross(ang);
      for(var s=0;s<6;s++){var an=-Math.PI/2+(rnd()-0.5)*2.2;addFx({type:'spark',x:x,y:y,vx:Math.cos(an)*S*90,vy:Math.sin(an)*S*90,t:0,dur:0.3})}
    }
  });
}
function addCross(key,o){var a=edgeCross.get(key);if(!a){a=[];edgeCross.set(key,a)}a.push(o)}
function joinNodes(a,b){
  if(a<0||b<0||a===b||linked(a,b))return;
  if(graphNear(a,b,3))return;
  var path=pathBetween(a,b);
  link(a,b);stats.joins++;
  if(path&&path.length>=10)loopSuccess(path);
  else if(!path)sfxJoin();
}

/* ---------- 効果 ---------- */
function addFx(o){if(fx.length>=MAXFX)fx.shift();fx.push(o)}
function loopSuccess(path){
  stats.loops++;ripples.push({ids:path.slice(),i:0,acc:0});sfxLoop();
  var cx=0,cy=0;for(var i=0;i<path.length;i++){cx+=nodes[path[i]].x;cy+=nodes[path[i]].y}cx/=path.length;cy/=path.length;
  addFx({type:'ring',x:cx,y:cy,r0:S*10,r1:S*70,t:0,dur:0.7});
}

/* ---------- 音（Web Audio 合成） ---------- */
var AC=null,master=null,noiseBuf=null,sandG=null,sandF=null,humG=null,humO=null,audioOK=false,sfxLast={};
function initAudio(){
  if(!AC){try{var ua=navigator.userActivation;if(ua&&!ua.isActive)return}catch(e){}}
  if(AC){if(AC.state==='suspended'){try{AC.resume()['catch'](function(){})}catch(e){}}return}
  try{
    var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    AC=new C();master=AC.createGain();master.gain.value=0.6;
    var comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination);
    var len=Math.floor(AC.sampleRate*2);noiseBuf=AC.createBuffer(1,len,AC.sampleRate);var dch=noiseBuf.getChannelData(0);for(var i=0;i<len;i++)dch[i]=Math.random()*2-1;
    var src=AC.createBufferSource();src.buffer=noiseBuf;src.loop=true;sandF=AC.createBiquadFilter();sandF.type='bandpass';sandF.frequency.value=1500;sandF.Q.value=0.9;
    sandG=AC.createGain();sandG.gain.value=0;src.connect(sandF);sandF.connect(sandG);sandG.connect(master);src.start();
    humO=AC.createOscillator();humO.type='sine';humO.frequency.value=55;humG=AC.createGain();humG.gain.value=0;humO.connect(humG);humG.connect(master);humO.start();
    audioOK=true;
    if(AC.state==='suspended'){AC.resume()['catch'](function(){})}
  }catch(e){audioOK=false}
}
function okRate(name,gap){var t=gameTime;if(sfxLast[name]!==undefined&&t-sfxLast[name]<gap)return false;sfxLast[name]=t;return true}
function tone(f,dur,type,vol,when,slide){
  if(!audioOK||AC.state!=='running')return;
  try{var t=AC.currentTime+(when||0);var o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.03);}catch(e){}
}
function noise(dur,f,q,vol,when,type){
  if(!audioOK||AC.state!=='running')return;
  try{var t=AC.currentTime+(when||0);var s=AC.createBufferSource();s.buffer=noiseBuf;var fl=AC.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.value=f;fl.Q.value=q;
    var g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(fl);fl.connect(g);g.connect(master);s.start(t,Math.random()*1.5);s.stop(t+dur+0.05);}catch(e){}
}
function sfxTuft(){noise(0.14,2600,1.1,0.22);tone(2200,0.04,'triangle',0.04)}
function sfxTick(f,v){if(!okRate('tick',0.022))return;tone(f,0.045,'triangle',v);noise(0.025,f*2.5,5,v*0.6)}
function sfxBall(h){if(!okRate('ball',0.03))return;var f=1250-420*clamp(h,0.3,2);tone(f,0.05,'sine',0.09);noise(0.02,f*3,6,0.05)}
function sfxGrow(h){if(!okRate('grow',0.05))return;tone(2500-700*clamp(h,0.3,2),0.03,'triangle',0.025)}
function sfxOver(){if(!okRate('over',0.07))return;noise(0.09,900,1.4,0.16);tone(380,0.06,'triangle',0.04)}
function sfxJoin(){tone(1568,0.35,'sine',0.13);tone(1568*2.76,0.18,'sine',0.04)}
function sfxPing(){tone(1760,0.8,'sine',0.24);tone(1760*2.76,0.4,'sine',0.07);tone(2637,0.6,'triangle',0.06,0.04);noise(0.05,6000,2,0.08)}
function sfxLoop(){var fs=[1047,1319,1568,2093,2637];for(var i=0;i<fs.length;i++){tone(fs[i],0.6,'sine',0.14,i*0.08);tone(fs[i]*2.76,0.2,'sine',0.03,i*0.08)}}
function sfxCross(ang){if(!okRate('cross',0.08))return;tone(420+300*Math.sin(ang),0.12,'triangle',0.12);noise(0.08,1500,2,0.1)}
function sfxHop(H){tone(320+H/S*14,0.1,'sine',0.16,0,520+H/S*20)}
function sfxLand(){if(!okRate('land',0.05))return;tone(170,0.12,'sine',0.2);noise(0.04,2200,3,0.08)}
function sfxChoose(h){tone(1500-450*clamp(h,0.3,2),0.12,'sine',0.1);tone((1500-450*clamp(h,0.3,2))*1.5,0.1,'sine',0.05,0.05)}
function sfxMeet(){tone(2093,0.5,'sine',0.18);tone(2637,0.5,'sine',0.14,0.06);tone(3136,0.6,'sine',0.1,0.12)}
function sfxDead(){if(!okRate('dead',0.2))return;tone(300,0.08,'sine',0.1);tone(260,0.08,'sine',0.08,0.12)}
function sfxBridgeGo(){noise(0.35,3600,0.8,0.14)}
function sfxTowerUp(){var fs=[523,659,784,1047,1319,1568];for(var i=0;i<fs.length;i++){tone(fs[i],1.4,'sine',0.11,i*0.07);tone(fs[i]*2,0.8,'triangle',0.03,i*0.07)}}
function sfxChime(h){if(!okRate('chime',0.06))return;var f=500+900/(h+0.4);tone(f,0.5,'sine',0.12);tone(f*2.76,0.25,'sine',0.03)}
function sfxCollapse(){noise(1.6,700,0.5,0.28);noise(0.9,2400,0.8,0.12,0.2)}
function sfxCrumble(){if(!okRate('crum',0.035))return;noise(0.06,1200+Math.random()*1800,2,0.09)}
function setSand(v,f){if(!audioOK)return;try{var t=AC.currentTime;sandG.gain.setTargetAtTime(v,t,0.04);sandF.frequency.setTargetAtTime(f,t,0.05)}catch(e){}}
function setHum(v,f){if(!audioOK)return;try{var t=AC.currentTime;humG.gain.setTargetAtTime(v,t,0.2);humO.frequency.setTargetAtTime(f,t,0.3)}catch(e){}}

/* ---------- 砂鉄の粒 ---------- */
function mkGrain(x,y,pile){return {x:x,y:y,vx:0,vy:0,a:rnd()*TAU,s:S*(pile?1.6:1.15)+rnd()*S*1.5,w:pile?2:1,tri:rnd()<0.62,gr:0,pile:!!pile}}
function pushGrain(g){if(grains.length>=MAXG)return false;grains.push(g);return true}
function inX(m){return SA.l+m+rnd()*Math.max(1,W-SA.l-SA.r-2*m)}
function inY(m){return SA.t+m+rnd()*Math.max(1,H-SA.t-SA.b-2*m)}
function seedBoard(restored){
  grains.length=0;G0=clamp(Math.round(W*H/330),420,1000);
  var b=balls[0];var dx=W/2-b.x,dy=H/2-b.y,dl=hyp(dx,dy)||1;dx/=dl;dy/=dl;
  var i;
  for(i=0;i<60;i++){var r=S*(24+rnd()*115),off=(rnd()-0.5)*S*70;pushGrain(mkGrain(b.x+dx*r-dy*off,b.y+dy*r+dx*off))}
  var nc=2+((rnd()*2)|0);
  for(var c=0;c<nc;c++){var ccx=inX(50*S),ccy=inY(60*S),rad=S*(40+rnd()*60),cnt=60+((rnd()*70)|0);
    for(i=0;i<cnt;i++){var an=rnd()*TAU,rr=rad*Math.sqrt(rnd());pushGrain(mkGrain(ccx+Math.cos(an)*rr,ccy+Math.sin(an)*rr))}}
  if(restored){for(i=0;i<restored.length;i++){var q=restored[i];for(var k=0;k<q[2];k++)pushGrain(mkGrain(q[0]*W+(rnd()-0.5)*8*S,q[1]*H+(rnd()-0.5)*8*S,true))}}
  while(grains.length<G0)pushGrain(mkGrain(rnd()*W,rnd()*H));
  for(i=0;i<grains.length;i++)grains[i].gr=1;
}
function spawnEdgeGrain(){
  var side=(rnd()*4)|0,x,y,vx=0,vy=0;
  if(side===0){x=rnd()*W;y=-4;vy=S*30}else if(side===1){x=W+4;y=rnd()*H;vx=-S*30}else if(side===2){x=rnd()*W;y=H+4;vy=-S*30}else{x=-4;y=rnd()*H;vx=S*30}
  var g=mkGrain(x,y,false);g.vx=vx;g.vy=vy;pushGrain(g);
}
function updateGrains(dt){
  var P=(ptr&&ptr.kind==='draw'&&phase==='draw')?ptr:null;
  var damp=Math.exp(-dt*7),fx0=P?P.x:0,fy0=P?P.y:0,R2=R_ATT*R_ATT,AB2=(14*S)*(14*S);
  var f4=frame&3,hasN=nodes.length>0&&phase==='draw';
  for(var i=grains.length-1;i>=0;i--){
    var g=grains[i];
    if(g.gr<1)g.gr=Math.min(1,g.gr+dt*2);
    if(P){var dx=fx0-g.x,dy=fy0-g.y,d2=dx*dx+dy*dy;
      if(d2<R2){
        if(d2<AB2&&bundle<80){bundle+=g.w;P.got+=g.w;grains[i]=grains[grains.length-1];grains.pop();continue}
        var d=Math.sqrt(d2)||1,f=1-d/R_ATT,acc=S*(2600*f*f+500*f);g.vx+=dx/d*acc*dt;g.vy+=dy/d*acc*dt;g.a=Math.atan2(dy,dx);
      }
    }
    if(hasN&&(i&3)===f4){var k=nearest(g.x,g.y,24*S,null);if(k>=0){var n=nodes[k];var ex=n.x-g.x,ey=n.y-g.y,el=hyp(ex,ey)||1;if(el>7*S){g.vx+=ex/el*S*480*dt;g.vy+=ey/el*S*480*dt}g.a=Math.atan2(ey,ex)}}
    g.vx*=damp;g.vy*=damp;g.x+=g.vx*dt;g.y+=g.vy*dt;
    if(g.x<-6)g.x=-6;else if(g.x>W+6)g.x=W+6;if(g.y<-6)g.y=-6;else if(g.y>H+6)g.y=H+6;
  }
  if(phase==='draw'&&grains.length<G0*0.45){spawnAcc+=dt*5;while(spawnAcc>1){spawnAcc--;spawnEdgeGrain()}}
}

/* ---------- 描く（ストローク） ---------- */
function speedH(v){var u=v/S;var t=clamp((Math.log(Math.max(u,1))-Math.log(150))/(Math.log(1150)-Math.log(150)),0,1);return 1.45-1.05*t}
function makeNode(x,y,hs){
  var c=0.6+0.9*hs,m;
  if(bundle>=c){m=1+Math.min(0.3,(bundle-c)/45);bundle-=c}else{m=0.7+0.3*bundle/c;bundle=0}
  var id=addNode(x,y,clamp(hs*m,0.3,HMAX),ptr?ptr.sid:0);
  if((stats.nodesMade%3)===0)sfxGrow(nodes[id].h);
  return id;
}
function bump(id,inc){var n=nodes[id];n.h=Math.min(HMAX,n.h+inc);n.boost=gameTime;n.spv+=3}
function overdraw(k,hs){

      for(var j=0;j<n.nb.length;j++){var v=n.nb[j];if(comp[v]<0){comp[v]=i;q.push(v)}}}

  var lc=stats.lastChoice;

  map.forEach(function(e){if(e[2]>bc){var x=e[0]/e[2],y=e[1]/e[2];if(x<SA.l+20||x>W-SA.r-20||y<SA.t+20||y>H-SA.b-20)return;bc=e[2];bx=x;by=y}});

  for(i=0;i<arr.length;i++){var e=arr[i];if(e[5]%3!==0)continue;var mx=lerp(e[0],e[2],0.42),my=lerp(e[1],e[3],0.42),side=(e[5]%2?1:-1);var ex=lerp(e[0],e[2],0.62)+side*e[4]*3,ey=lerp(e[1],e[3],0.62);ctx.moveTo(mx,my);ctx.lineTo(ex,ey)}
  ctx.stroke();
}
function drawBall(b){
  var x=b.x+b.ox,y=b.y+b.oy,bx=PX(x,y),by=PY(y),r=S*7.5;var yy=by-b.z-(K>0?r*0.9*K:0);
  if(b.z>0.8*S){ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1,S);ctx.beginPath();ctx.ellipse(bx,by,r*0.9,r*0.35,0,0,TAU);ctx.stroke()}
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,yy,r*b.vis,0,TAU);ctx.fill();
  ctx.strokeStyle='#000';ctx.lineWidth=S*1.4;ctx.beginPath();var c=Math.cos(b.roll),s=Math.sin(b.roll);ctx.moveTo(bx-c*r*0.62,yy-s*r*0.62);ctx.lineTo(bx+c*r*0.62,yy+s*r*0.62);ctx.stroke();
}
function drawTuft(){
  var T=tuft;if(!T)return;var gr;
  if(T.rel<0)gr=Math.min(1,0.75+T.age*5);else{var r=T.rel/0.34;gr=Math.max(0,(1-r)*(1+Math.sin(T.rel*22)*0.4))}
  var x=ptr&&T.rel<0?ptr.x:T.x,y=ptr&&T.rel<0?ptr.y:T.y;if(T.rel<0){T.x=x;T.y=y}
  var nsp=10+Math.min(10,(bundle/3)|0),L=S*(17+Math.min(bundle,50)*0.42)*gr,r0=S*4;
  ctx.fillStyle="#fff";triStart(true);
  for(var i=0;i<nsp;i++){var a=i/nsp*TAU+T.spin+Math.sin(gameTime*9+i)*0.05;var l=L*(0.7+0.3*((i*7)%3)/2);var c=Math.cos(a),s=Math.sin(a);var bw=S*2;
    tri(x+c*r0-s*bw,y+s*r0+c*bw,x+c*r0+s*bw,y+s*r0-c*bw,x+c*l,y+s*l)}
  ctx.fill();
}
function drawFx(){
  ctx.fillStyle='#fff';ctx.strokeStyle='#fff';
  triStart(true);
  for(var i=0;i<fx.length;i++){var f=fx[i];if(f.type!=='fly'||f.t<0)continue;var u=sst(f.t/f.dur);var x=lerp(f.x0,f.x1,u),y=lerp(f.y0,f.y1,u)-Math.sin(u*Math.PI)*f.arc;x=PX(x,y);var s=S*2.2;tri(x,y-s*1.4,x-s,y+s,x+s,y+s)}
  ctx.fill();
  ctx.lineWidth=Math.max(1,S*1.2);ctx.beginPath();
  for(i=0;i<fx.length;i++){f=fx[i];if(f.type!=='spark')continue;var k=1-f.t/f.dur;ctx.moveTo(f.x,f.y);ctx.lineTo(f.x-f.vx*0.05*k,f.y-f.vy*0.05*k)}
  ctx.stroke();
  for(i=0;i<fx.length;i++){f=fx[i];if(f.type!=='ring')continue;var q=f.t/f.dur;ctx.globalAlpha=1-q;ctx.lineWidth=Math.max(1,S*2*(1-q));ctx.beginPath();ctx.arc(f.x,f.y,lerp(f.r0,f.r1,sst(q)),0,TAU);ctx.stroke()}
  ctx.globalAlpha=1;
}
function drawHint(){
  if(!hint||ptr||phase!=='draw')return;var idle=gameTime-lastInput;if(hint.type==='ball'&&idle<0.6)return;
  var a=clamp(0.25+idle*0.3,0.25,0.85);var r=S*(20+5*Math.sin(gameTime*5));
  ctx.save();ctx.globalAlpha=a;ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1,S*1.5);ctx.beginPath();ctx.arc(hint.x,hint.y,r,0,TAU);ctx.stroke();
  ctx.globalAlpha=a*0.5;ctx.beginPath();ctx.arc(hint.x,hint.y,r*1.45,0,TAU);ctx.stroke();ctx.restore();
}
function drawHand(x,y,sc){
  ctx.save();ctx.translate(x,y);ctx.rotate(-0.4);ctx.scale(sc,sc);
  ctx.beginPath();ctx.moveTo(-5,6);ctx.arc(0,6,5,Math.PI,0);ctx.lineTo(5,30);ctx.lineTo(12,28);ctx.lineTo(19,31);ctx.lineTo(24,35);ctx.lineTo(25,52);ctx.lineTo(18,66);ctx.lineTo(-8,66);ctx.lineTo(-16,50);ctx.lineTo(-20,38);ctx.lineTo(-14,34);ctx.lineTo(-5,42);ctx.closePath();
  ctx.fillStyle='#000';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2.2/sc*S;ctx.stroke();
  ctx.beginPath();ctx.moveTo(12,28);ctx.lineTo(12,40);ctx.moveTo(19,31);ctx.lineTo(19,42);ctx.stroke();
  ctx.restore();
}
function demoPos(u){var p=demo.path;if(p.length===1)return p[0];var segs=p.length-1,f=clamp(u,0,1)*segs,i=Math.min(segs-1,Math.floor(f)),t=f-i;return [lerp(p[i][0],p[i+1][0],t),lerp(p[i][1],p[i+1][1],t)]}
function drawDemo(){
  if(!demo)return;var u=sst((demo.t-0.25)/demo.dur);var fade=demo.t>demo.dur?Math.max(0,1-(demo.t-demo.dur)/0.6):Math.min(1,demo.t/0.25);
  ctx.save();ctx.globalAlpha=fade*0.7;ctx.fillStyle='#fff';ctx.beginPath();
  for(var k=0;k<=24;k++){var v=k/24;if(v>u)break;var p=demoPos(v);ctx.moveTo(p[0]+S*2.2,p[1]);ctx.arc(p[0],p[1],S*2.2,0,TAU)}ctx.fill();
  ctx.globalAlpha=fade;var q=demoPos(u);var press=demo.t>0.25&&demo.t<demo.dur?1:0;
  ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1,S*1.4);ctx.beginPath();ctx.arc(q[0],q[1],S*(7+3*press),0,TAU);ctx.stroke();
  drawHand(q[0],q[1],S*(1.05-0.08*press));ctx.restore();
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  drawMagnet();drawGrains();
  if(phase==='draw'&&K<=0)drawRoadsTop();else drawTowers();
  drawFx();drawTuft();
  for(var i=0;i<balls.length;i++)drawBall(balls[i]);
  drawHint();drawDemo();
}

/* ---------- 入力（Pointer Events・一本指） ---------- */
function cxy(e){return [clamp(e.clientX,0,W),clamp(e.clientY,0,H)]}
function onDown(e){
  if(e.cancelable)e.preventDefault();
  if(e.pointerType==='mouse'&&e.button!==0)return;
  initAudio();lastInput=gameTime;demo=null;demoShown=false;
  var p=cxy(e);
  if(ptr){
    if(phase==='draw'){for(var i=0;i<grains.length;i++){var g=grains[i];var dx=g.x-p[0],dy=g.y-p[1],d=hyp(dx,dy);if(d<50*S&&d>0.1){g.vx+=dx/d*S*120;g.vy+=dy/d*S*120}}}
    else swayAt(p[0],p[1],0.6);
    return;
  }
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  ptr={id:e.pointerId,x:p[0],y:p[1],dx:p[0],dy:p[1],lt:e.timeStamp||performance.now(),speed:420*S,moved:false,mode:'new',lastNode:-1,chain:[],startSnap:-1,first:true,sx:p[0],sy:p[1],got:0,kind:phase==='draw'?'draw':'sway',sid:++strokeCount};
  if(ptr.kind==='draw'){
    bundle=3;ptr.startSnap=nearest(p[0],p[1],R_SNAP,null);
    tuft={x:p[0],y:p[1],age:0,rel:-1,spin:rnd()*TAU};sfxTuft();
    for(var j=0;j<grains.length;j++){var q=grains[j];var ex=p[0]-q.x,ey=p[1]-q.y,el=hyp(ex,ey);if(el<R_ATT*1.3&&el>0.1){var f=(1-el/(R_ATT*1.3));q.vx+=ex/el*S*260*f;q.vy+=ey/el*S*260*f;q.a=Math.atan2(ey,ex)}}
  }else swayAt(p[0],p[1],1);
}
function onMove(e){
  if(!ptr||e.pointerId!==ptr.id)return;
  if(e.cancelable)e.preventDefault();
  lastInput=gameTime;
  var evs=null;try{evs=e.getCoalescedEvents?e.getCoalescedEvents():null}catch(_){evs=null}
  if(!evs||!evs.length)evs=[e];
  for(var i=0;i<evs.length;i++){var p=cxy(evs[i]);if(!ptr)break;handlePoint(p[0],p[1],evs[i].timeStamp||performance.now())}
}
function onUp(e){initAudio();if(!ptr||e.pointerId!==ptr.id)return;if(e.cancelable)e.preventDefault();lastInput=gameTime;var p=cxy(e);handlePoint(p[0],p[1],e.timeStamp||performance.now());try{cv.releasePointerCapture(e.pointerId)}catch(_){}endStroke()}
function onCancel(e){if(!ptr||e.pointerId!==ptr.id)return;lastInput=gameTime;endStroke()}
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
cv.addEventListener('pointerup',onUp,{passive:false});
cv.addEventListener('pointercancel',onCancel,{passive:false});
cv.addEventListener('lostpointercapture',onCancel);
window.addEventListener('blur',function(){if(ptr)endStroke()});
['touchstart','touchmove','touchend','gesturestart','gesturechange','gestureend','dblclick','contextmenu','selectstart'].forEach(function(t){document.addEventListener(t,function(e){if(e.cancelable)e.preventDefault()},{passive:false})});
window.addEventListener('wheel',function(e){if(e.cancelable)e.preventDefault()},{passive:false});

/* ---------- サイズ・回転 ---------- */
function rescaleWorld(fx0,fy0){
  var i;for(i=0;i<nodes.length;i++){nodes[i].x*=fx0;nodes[i].y*=fy0}
  for(i=0;i<grains.length;i++){grains[i].x*=fx0;grains[i].y*=fy0}
  for(i=0;i<crossings.length;i++){var c=crossings[i];c.x*=fx0;c.y*=fy0}
  for(i=0;i<balls.length;i++){balls[i].x*=fx0;balls[i].y*=fy0}
  for(i=0;i<fx.length;i++){var f=fx[i];if(f.x!==undefined){f.x*=fx0;f.y*=fy0}if(f.x0!==undefined){f.x0*=fx0;f.y0*=fy0;f.x1*=fx0;f.y1*=fy0}}
  if(tuft){tuft.x*=fx0;tuft.y*=fy0}
  if(ptr)endStroke();demo=null;
}
function resize(){
  var nw=Math.max(1,window.innerWidth|0),nh=Math.max(1,window.innerHeight|0);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(nw*DPR);cv.height=Math.round(nh*DPR);cv.style.width=nw+'px';cv.style.height=nh+'px';
  readSafe();
  var old=W>0;var fx0=old?nw/W:1,fy0=old?nh/H:1;
  W=nw;H=nh;S=clamp(Math.min(W,H)/420,0.8,2.0);setScale();
  if(old&&(fx0!==1||fy0!==1)){rescaleWorld(fx0,fy0)}
  rebuildGrid();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120)});

/* ---------- ループ・非表示停止 ---------- */
var running=true,raf=0,lastTs=0,perfU=0,perfR=0;
function loop(ts){
  if(!running){raf=0;return}
  var dt=lastTs?(ts-lastTs)/1000:1/60;lastTs=ts;dt=clamp(dt,0,0.05);
  try{var q0=performance.now();update(dt);var q1=performance.now();render();var q2=performance.now();perfU+=(q1-q0-perfU)*0.1;perfR+=(q2-q1-perfR)*0.1}catch(err){if(window.console)console.warn(err)}
  raf=requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){running=false;if(raf)cancelAnimationFrame(raf);raf=0;if(ptr)endStroke();setSand(0,800);if(AC&&AC.state==='running'){try{AC.suspend()['catch'](function(){})}catch(e){}}}
  else{if(!running){running=true;lastTs=0;raf=requestAnimationFrame(loop)}if(AC&&AC.state==='suspended'){try{AC.resume()['catch'](function(){})}catch(e){}}}
});

/* ---------- 開始 ---------- */
resize();
setupBalls(true);
var restored=loadPiles();
seedBoard(restored);
lastInput=0;
raf=requestAnimationFrame(loop);

/* テスト用の読み取り口（画面には出さない） */
window.__gf={
  seed:seed0,
  get phase(){return phase},get K(){return K},get spread(){return spreadP},
  get nodes(){return nodes.length},get edges(){return edges.length},get crossings(){return crossings.length},get grains(){return grains.length},
  get bundle(){return bundle},get hint(){return hint?hint.type:null},get demo(){return !!demo},get storageOK(){return storageOK},get cycles(){return cycles},
  get running(){return running},get perf(){return [perfU,perfR]},get audio(){return AC?AC.state:'none'},get fx(){return fx.length},
  stats:stats,
  balls:function(){return balls.map(function(b){return {x:b.x,y:b.y,z:b.z,on:b.on,a:b.a,b:b.b,wait:b.wait,hop:!!b.hop,h:(b.on&&b.a>=0&&b.b>=0)?lerp(nodes[b.a].h,nodes[b.b].h,b.t):null}})},
  nodeInfo:function(i){var n=nodes[i];return n?{x:n.x,y:n.y,h:n.h,deg:n.nb.length,nb:n.nb.slice(),rise:n.rise,fall:n.fall}:null},
  hs:function(){return nodes.map(function(n){return n.h})},
  ends:function(){var o=[];for(var i=0;i<nodes.length;i++)if(nodes[i].nb.length===1)o.push(i);return o},
  junctions:function(){var o=[];for(var i=0;i<nodes.length;i++)if(nodes[i].nb.length>=3)o.push(i);return o},
  maxTowerZ:function(){var m=0;for(var i=0;i<nodes.length;i++)m=Math.max(m,towerZ(nodes[i]));return m}
};
})();
