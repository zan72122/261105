(function(){
'use strict';
/* =========================================================
   じゅわーっ！雲をつくる消防隊と、川の向こうの小さな島
   単一ファイル / 外部通信なし / Canvas2D ブロック描画 / WebAudio 合成
   ========================================================= */
const cv=document.getElementById('c');
const mainCtx=cv.getContext('2d',{alpha:false});
let ctx=mainCtx;
const saEl=document.getElementById('sa');
let W=0,H=0,DPR=1;const SA={t:0,r:0,b:0,l:0};
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;

let T=0;
const evlog=[];function EV(n,d){evlog.push([+T.toFixed(1),n,d===undefined?'':d]);if(evlog.length>600)evlog.shift();}

/* ---------------- palette ---------------- */
const COL={
 sea:[34,58,170],seaL:[70,104,214],foam:[232,242,255],
 grassA:[98,188,82],grassB:[86,176,72],side:[176,124,72],sand:[246,214,122],
 soil:[160,108,62],soilWet:[96,62,36],groove:[120,84,50],
 white:[248,246,238],red:[230,50,42],cool:[54,126,238],yellow:[252,206,46],green:[52,168,78],blue:[46,98,216],
 skin:[250,208,170],hair:[84,52,32],dark:[34,30,44],wood:[214,150,74],
 water:[72,152,246],waterL:[160,212,255],cloud:[255,255,255],cloudH:[200,214,238],
 pink:[248,146,156],navy:[38,54,124],mouth:[176,46,52],silver:[214,222,232],leaf:[64,190,84],veg:[236,66,52]
};
function rgb(c,f,a){const r=clamp(c[0]*f,0,255)|0,g=clamp(c[1]*f,0,255)|0,b=clamp(c[2]*f,0,255)|0;
 return (a===undefined||a>=1)?'rgb('+r+','+g+','+b+')':'rgba('+r+','+g+','+b+','+a.toFixed(3)+')';}
function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
const S_DARK=rgb(COL.dark,1),S_PINK=rgb(COL.pink,1),S_MOUTH=rgb(COL.mouth,1),S_WHITE=rgb(COL.white,1);

/* ---------------- camera / projection ---------------- */
const cam={kx:.3,ky:.7,S:40,ox:0,oy:0,zoom:0,zoomT:0};
const FR0={x0:-0.5,x1:9.0,y0:-0.3,y1:16.5,z0:-0.5,z1:1.2};
const FR1={x0:-1.5,x1:9.0,y0:-0.3,y1:19.0,z0:-0.5,z1:1.7};
function fitCam(){
 const asp=W/Math.max(1,H);const t=sm((asp-0.62)/(1.3-0.62));
 cam.kx=lerp(.12,.5,t);cam.ky=lerp(1.0,.56,t);
 const e=sm(cam.zoom);const f={};for(const k in FR0)f[k]=lerp(FR0[k],FR1[k],e);
 let a=1e9,b=-1e9,c=1e9,d=-1e9;
 for(let i=0;i<8;i++){const x=i&1?f.x1:f.x0,y=i&2?f.y1:f.y0,z=i&4?f.z1:f.z0;
  const sx=x+cam.kx*y,sy=-(z+cam.ky*y);if(sx<a)a=sx;if(sx>b)b=sx;if(sy<c)c=sy;if(sy>d)d=sy;}
 const pl=SA.l+6,pr=SA.r+6,pt=SA.t+6,pb=SA.b+6;const aw=W-pl-pr,ah=H-pt-pb;
 cam.S=Math.min(aw/(b-a),ah/(d-c));
 cam.ox=pl+(aw-(b-a)*cam.S)/2-a*cam.S;cam.oy=pt+(ah-(d-c)*cam.S)/2-c*cam.S;
}
let PX=0,PY=0;
function pj(x,y,z){PX=cam.ox+(x+cam.kx*y)*cam.S;PY=cam.oy-(z+cam.ky*y)*cam.S;}
function unproj(sx,sy,z){const y=((cam.oy-sy)/cam.S-z)/cam.ky;return {x:(sx-cam.ox)/cam.S-cam.kx*y,y:y};}
function quad(ax,ay,az,bx,by,bz,cx,cy,cz,dx,dy,dz){ctx.beginPath();pj(ax,ay,az);ctx.moveTo(PX,PY);pj(bx,by,bz);ctx.lineTo(PX,PY);
 pj(cx,cy,cz);ctx.lineTo(PX,PY);pj(dx,dy,dz);ctx.lineTo(PX,PY);ctx.closePath();ctx.fill();}
function topQ(x,y,w,d,z){quad(x,y,z,x+w,y,z,x+w,y+d,z,x,y+d,z);}
function frontQ(x,y,w,z,h){quad(x,y,z,x+w,y,z,x+w,y,z+h,x,y,z+h);}
function rightQ(x,y,d,z,h){quad(x,y,z,x,y+d,z,x,y+d,z+h,x,y,z+h);}
function sbox(x,y,z,w,d,h){ // screen bbox
 let a=1e9,b=-1e9,c=1e9,e=-1e9;
 for(let i=0;i<8;i++){pj(i&1?x+w:x,i&2?y+d:y,i&4?z+h:z);if(PX<a)a=PX;if(PX>b)b=PX;if(PY<c)c=PY;if(PY>e)e=PY;}
 return {x0:a,x1:b,y0:c,y1:e};}
function bdist(sx,sy,bb){const dx=Math.max(bb.x0-sx,0,sx-bb.x1),dy=Math.max(bb.y0-sy,0,sy-bb.y1);return Math.hypot(dx,dy);}

/* ---------------- draw list ---------------- */
const items=[];let nI=0;const order=[];
function B(x,y,z,w,d,h,c,a,df,da){let it=items[nI];if(!it){it={};items[nI]=it;}nI++;
 it.x=x;it.y=y;it.z=z;it.w=w;it.d=d;it.h=h;it.c=c;it.a=(a===undefined?1:a);it.df=df||null;it.da=da;it.ct=null;it.g=0;
 it.k=cam.kx*(x+w*.5)-(y+d*.5)+cam.ky*(z+h*.5);return it;}
const shd=[];let nS=0;
function SH(x,y,w,d,h,gz){let s=shd[nS];if(!s){s={};shd[nS]=s;}nS++;s.x=x;s.y=y;s.w=w;s.d=d;s.h=h;s.gz=gz||0;}
const SDX=.34,SDY=.44;
function drawShadows(){if(!nS)return;ctx.beginPath();
 for(let i=0;i<nS;i++){const s=shd[i],ox=s.h*SDX,oy=s.h*SDY,z=s.gz;
  pj(s.x,s.y,z);ctx.moveTo(PX,PY);pj(s.x+s.w,s.y,z);ctx.lineTo(PX,PY);pj(s.x+s.w+ox,s.y+oy,z);ctx.lineTo(PX,PY);
  pj(s.x+s.w+ox,s.y+s.d+oy,z);ctx.lineTo(PX,PY);pj(s.x+ox,s.y+s.d+oy,z);ctx.lineTo(PX,PY);pj(s.x,s.y+s.d,z);ctx.lineTo(PX,PY);ctx.closePath();}
 ctx.fillStyle='rgba(18,26,74,0.26)';ctx.fill();}
function drawBox(it){const x=it.x,y=it.y,z=it.z,w=it.w,d=it.d,h=it.h,c=it.c,a=it.a;
 if(h>0.001){ctx.fillStyle=rgb(c,.8,a);frontQ(x,y,w,z,h);
  if(cam.kx>.03){ctx.fillStyle=rgb(c,.62,a);rightQ(x+w,y,d,z,h);}}
 ctx.fillStyle=rgb(it.ct||c,1,a);topQ(x,y,w,d,z+h);
 if(it.g>0.01){ctx.fillStyle='rgba(255,255,226,'+(it.g*.55).toFixed(3)+')';topQ(x,y,w,d,z+h);
  if(h>0.001){ctx.fillStyle='rgba(255,255,226,'+(it.g*.3).toFixed(3)+')';frontQ(x,y,w,z,h);}}
 if(it.df)it.df(it,it.da);}
function drawItems(){order.length=nI;for(let i=0;i<nI;i++)order[i]=items[i];order.sort((a,b)=>a.k-b.k);for(let i=0;i<nI;i++)drawBox(order[i]);}
// quad on front face (u across x, v up z)
function fq(it,u0,v0,u1,v1,st){const x0=it.x+it.w*u0,x1=it.x+it.w*u1,z0=it.z+it.h*v0,z1=it.z+it.h*v1;ctx.fillStyle=st;
 quad(x0,it.y,z0,x1,it.y,z0,x1,it.y,z1,x0,it.y,z1);}
function rq(it,u0,v0,u1,v1,st){const x=it.x+it.w,y0=it.y+it.d*u0,y1=it.y+it.d*u1,z0=it.z+it.h*v0,z1=it.z+it.h*v1;ctx.fillStyle=st;
 quad(x,y0,z0,x,y1,z0,x,y1,z1,x,y0,z1);}

/* ---------------- layout (少しずつ毎回ちがう) ---------------- */
const JF=rnd(0,.4),JP=rnd(-.3,.3);
const ISL={x0:0,x1:8.6,y0:0,y1:13.6};
const FAR={x0:.4,x1:8.4,y0:15.6,y1:18.8};
const field={x:3.0+JF*.75,y:4.6,w:3.2,d:1.6,growth:0,wet:0,harvester:null,stage:0,pop:0,harvests:0};
const pond={x:2.2+JP*.5,y:9.4,w:3.2,d:1.8,level:0,depth:.55,spill:0,rip:0};
const puddle={x:2.8,y:pond.y+pond.d-.03,w:1.4,d:0,fill:0};puddle.d=12.6-puddle.y;
const river={x0:0,x1:2.8,y0:11.9,y1:12.6,fill:0,open:false,flow:0,ph:0,births:0};
const pileP={x:.75,y:11.45};
let pile=0;
function mkHouse(x,y,w,d,hh,door,trim){const h={x,y,w,d,hh,bh:.42,blocks:[],rescued:false,form:null,heating:0,wisp:0,door,trim,chan:null,chanWet:0,len:0,cool:0,jump:0};
 for(let j=0;j<2;j++)for(let i=0;i<3;i++)h.blocks.push({x:x+i*w/3,y:y+j*d/2,w:w/3,d:d/2,heat:1,H0:1,wet:0,ph:Math.random()*6,tg:0});
 return h;}
const houses=[mkHouse(5.4,1.8,2.4,1.6,1.1,COL.blue,COL.yellow),mkHouse(.4,4.4,2.2,1.5,1.05,COL.green,COL.blue),mkHouse(5.8,7.0,2.4,1.6,1.1,COL.yellow,COL.green)];
(function(){const A=houses[0],Bh=houses[1],C=houses[2];const pr=pond.x+pond.w-.3;
 A.chan=[[A.x+A.w+.04,A.y-.08,A.hh],[A.x+A.w+.04,A.y-.08,.03],[8.35,A.y-.08,.03],[8.35,9.05,.03],[pr,9.05,.03],[pr,9.65,.03]];
 Bh.chan=[[Bh.x+Bh.w+.04,Bh.y-.08,Bh.hh],[Bh.x+Bh.w+.04,Bh.y-.08,.03],[2.8,Bh.y-.08,.03],[2.8,9.65,.03]];
 C.chan=[[C.x+C.w+.04,C.y-.08,C.hh],[C.x+C.w+.04,C.y-.08,.03],[8.35,C.y-.08,.03],[8.35,9.05,.03],[pr,9.05,.03],[pr,9.65,.03]];
 for(const h of houses){let L=0;for(let i=1;i<h.chan.length;i++){const a=h.chan[i-1],b=h.chan[i];L+=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]);}h.len=L;}
})();
const LOTS=[
 {field:{x:.9,y:16.35,w:2.0,d:1.3},hut:{x:3.05,y:16.5,w:1.3,d:1.1},pier:{x:2.0,y:14.75,w:.7,d:.9}},
 {field:{x:4.75,y:16.35,w:2.0,d:1.3},hut:{x:6.9,y:16.5,w:1.3,d:1.1},pier:{x:5.75,y:14.75,w:.7,d:.9}}];
function mkSet(){return {field:{s:'none',p:0,g:0,go:false},pier:{s:'none',p:0,go:false},hut:{s:'none',p:0,go:false},crates:0,sink:0,doneT:-99,order:[]};}
const sets=[mkSet(),mkSet()];
let cycle=0,curSet=0,cycleDone=false,doneT=-99,dryT=0;
const wind={x:0};
let everSprayed=false,rescuedThisCycle=0,lastInput=0;

/* ---------------- characters ---------------- */
const ff={x:1.45,y:1.35,s:1.7,waveT:0,cheerT:0,blinkT:2,blink:false,hop:0};
const grip={x:2.45,y:.25,w:1.35,d:.7,h:.62,sq:0,v:0};
const hydrant={x:4.15,y:.25,w:.36,d:.36,h:.55};
const residents=[
 {id:0,home:0,shirt:COL.green,pants:COL.blue,hair:COL.hair,hat:null},
 {id:1,home:1,shirt:COL.yellow,pants:COL.red,hair:[40,30,26],hat:null},
 {id:2,home:2,shirt:COL.blue,pants:COL.yellow,hair:[120,70,40],hat:COL.white}];
for(const r of residents){const h=houses[r.home];r.x=h.x+.45;r.y=h.y+.35;r.z=h.hh+h.bh;r.onRoof=true;r.plan=null;r.si=0;r.boat=null;
 r.pose='wave';r.walking=false;r.wph=0;r.hop=0;r.carry=false;r.thinkT=.5;r.wantHome=false;r.look=-1;r.mouth=0;r.tap=0;r.free=false;}
function farDock(s){return [3.65+s*1.3,15.15];}
function landStop(s){return [.85+s*1.05,12.25];}
function mkBoat(s){const d=farDock(s);return {slot:s,x:d[0],y:d[1],z:-.42,state:'moored',path:null,seg:0,dest:null,cargo:0,passenger:null,needPass:false,
 loader:null,wait:0,homeAfter:false,note:s*3,active:false,delay:0,lot:null,lotKind:null,tried:false,fin:0,tap:0,speed:0};}
const boats=[mkBoat(0),mkBoat(1)];

/* ---------------- particles ---------------- */
const water=[],steam=[],rain=[],splash=[],spark=[],packets=[],rings=[],pokes=[];
const CAP={water:90,steam:100,rain:220,splash:70,spark:90,packets:90,rings:30};
const clouds=[];const HEAVY=1.25;
const rainSt={rate:0,heavy:0};

/* ---------------- spray state ---------------- */
const spray={on:false,pid:null,src:null,aim:null,pow:0,acc:0,hold:0,dragged:false,ret:0,lastAim:null,sizT:0};
let invite={kind:'grip',ref:null},inviteT=0;
const demo={on:false,t:0,shown:false};

/* ---------------- setup heat ---------------- */
function heatHouses(gradual){wind.x=rnd(-.32,.32);
 for(const h of houses){const H0=rnd(.8,1.25);h.rescued=false;h.cool=0;
  for(const b of h.blocks){b.H0=H0*rnd(.88,1.12);if(gradual){b.tg=b.H0;}else{b.heat=b.H0;}}
  h.heating=gradual?2.4:0;}}
heatHouses(false);
function heatSum(h){let s=0;for(const b of h.blocks)s+=b.heat;return s;}
function hottest(h){let bi=0,m=-1;for(let i=0;i<h.blocks.length;i++){if(h.blocks[i].heat>m){m=h.blocks[i].heat;bi=i;}}return bi;}
function roofTop(h){return h.hh+h.bh;}

/* ---------------- receivers (雲の行き先) ---------------- */
const REC={
 field:{name:'field',get cx(){return field.x+field.w/2;},get cy(){return field.y+field.d/2;},hw:1.6,thirsty:()=>field.growth<1,z:()=>.12},
 pond:{name:'pond',get cx(){return pond.x+pond.w/2;},get cy(){return pond.y+pond.d/2;},hw:1.6,thirsty:()=>true,z:()=>pondZ()},
 sink:{name:'sink',get cx(){return 1.4;},get cy(){return 12.25;},hw:1.4,thirsty:()=>true,z:()=>riverZ()}};
function predictDest(x,y){let best=null,bd=1e9;
 for(const k of ['field','pond','sink']){const r=REC[k];if(!r.thirsty())continue;const dy=r.cy-y;if(dy<-.6)continue;
  const px=x+wind.x*(Math.max(0,dy)+2.5);if(Math.abs(px-r.cx)>r.hw+1.8)continue;if(dy<bd){bd=dy;best=r;}}
 return best||REC.pond;}
function pondZ(){return -pond.depth+pond.depth*clamp(pond.level,0,1)+.01;}
function riverZ(){return river.open?(-.16+.06*Math.min(river.flow,2)):-.3;}

/* =========================================================
   AUDIO
   ========================================================= */
const AU={c:null,ok:false,next:0,step:0,cnt:{rain:0,xylo:0,bass:0,island:0,sizzle:0,success:0}};
const STEP=60/96/4;
const PEN=[261.63,293.66,329.63,392,440];
function note(i){const o=Math.floor(i/5),k=((i%5)+5)%5;return PEN[k]*Math.pow(2,o);}
const PHR=[5,7,9,7,8,10,9,7,5,6,7,5];
function audioInit(){
 try{
  if(AU.c){if(AU.c.state!=='running'){const p=AU.c.resume();if(p&&p.catch)p.catch(()=>{});}return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const c=new AC();AU.c=c;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.connect(c.destination);
  const m=c.createGain();m.gain.value=.75;m.connect(comp);AU.m=m;
  const len=(c.sampleRate*2)|0,nb=c.createBuffer(1,len,c.sampleRate),ch=nb.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;AU.nb=nb;
  AU.spray=loopNoise('bandpass',1200,.9);AU.heavy=loopNoise('lowpass',1700,.5);AU.waves=loopNoise('lowpass',380,.6);
  const rg=c.createGain();rg.gain.value=0;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=260;lp.connect(rg);rg.connect(m);
  const o1=c.createOscillator();o1.type='sine';o1.frequency.value=55;const o2=c.createOscillator();o2.type='triangle';o2.frequency.value=82.4;
  const g2=c.createGain();g2.gain.value=.35;o1.connect(lp);o2.connect(g2);g2.connect(lp);o1.start();o2.start();AU.river=rg;
  const lfo=c.createOscillator();lfo.frequency.value=.23;const lg=c.createGain();lg.gain.value=4;lfo.connect(lg);lg.connect(o1.frequency);lfo.start();
  const sb=c.createBufferSource();sb.buffer=c.createBuffer(1,1,22050);sb.connect(c.destination);sb.start(0);
  if(c.state!=='running'){const p=c.resume();if(p&&p.catch)p.catch(()=>{});}
  AU.ok=true;AU.next=0;
 }catch(e){AU.ok=false;}
}
function loopNoise(type,f,q){const c=AU.c,s=c.createBufferSource();s.buffer=AU.nb;s.loop=true;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;
 const g=c.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(AU.m);s.start();return {s,f:fl,g};}
function setG(p,v,tc){try{p.setTargetAtTime(v,AU.c.currentTime,tc||.05);}catch(e){}}
function tone(f,t,dur,type,vol,f2){const c=AU.c,o=c.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
 if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);const g=c.createGain();g.gain.setValueAtTime(.0001,t);
 g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AU.m);o.start(t);o.stop(t+dur+.03);}
function nz(t,dur,type,f,q,vol){const c=AU.c,s=c.createBufferSource();s.buffer=AU.nb;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;
 const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 s.connect(fl);fl.connect(g);g.connect(AU.m);s.start(t,Math.random()*1.5);s.stop(t+dur+.05);}
function xylo(f,t,v){tone(f,t,.4,'sine',v);tone(f*3.98,t,.07,'sine',v*.4);nz(t,.03,'bandpass',f*2,3,v*.25);}
function bell(f,t,v){tone(f,t,1.3,'sine',v);tone(f*2.76,t,.6,'sine',v*.3);tone(f*5.4,t,.25,'sine',v*.12);}
function sfx(n,a){if(!AU.ok)return;try{const t=AU.c.currentTime+.01;
 switch(n){
  case 'press':tone(320,t,.09,'sine',.09,190);break;
