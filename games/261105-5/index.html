/* ================= basics ================= */
const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});
let W=390,H=844,DPR=1,SA={t:0,r:0,b:0,l:0};
let K=0.66,U=0.78;           // ground foreshortening, height to screen
const cam={x:0,z:0,y:0,S:20,zoom:1,zt:1};
let baseS=20, PPU=40;
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const hyp=Math.hypot;
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rng=mulberry((Math.random()*1e9)|0);
const rr=(a,b)=>a+(b-a)*rng();
const pick=a=>a[(rng()*a.length)|0];

function sx(x){return W*0.5+(x-cam.x)*cam.S;}
function sy(y,z){return H*0.5+(z-cam.z)*cam.S*K-(y-cam.y)*cam.S*U;}
function wxOf(px){return (px-W*0.5)/cam.S+cam.x;}
function wzOf(py,y){return (py-H*0.5+(y-cam.y)*cam.S*U)/(cam.S*K)+cam.z;}

function hexRgb(h){const n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];}
function shade(h,f){const c=hexRgb(h);let r,g,b;if(f>=1){const t=f-1;r=c[0]+(255-c[0])*t;g=c[1]+(255-c[1])*t;b=c[2]+(255-c[2])*t;}else{r=c[0]*f;g=c[1]*f;b=c[2]*f;}return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';}
function rgba(h,a){const c=hexRgb(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function ell(g,x,y,rx,ry){g.beginPath();g.ellipse(x,y,Math.max(rx,0.0001),Math.max(ry,0.0001),0,0,TAU);}
function LG(g,x0,y0,x1,y1,st){const gr=g.createLinearGradient(x0,y0,x1,y1);for(const s of st)gr.addColorStop(s[0],s[1]);return gr;}
function RG(g,x0,y0,r0,x1,y1,r1,st){const gr=g.createRadialGradient(x0,y0,Math.max(0,r0),x1,y1,Math.max(0.0001,r1));for(const s of st)gr.addColorStop(s[0],s[1]);return gr;}
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();}

/* ================= sprites ================= */
// a sprite is painted in world units: x right, y up = negative, anchor = ground contact point
function mkSpr(wu,hu,ax,ay,paint){
  const c=document.createElement('canvas');
  const p=PPU;
  c.width=Math.max(2,Math.ceil(wu*p));c.height=Math.max(2,Math.ceil(hu*p));
  const g=c.getContext('2d');
  g.scale(p,p);g.translate(ax,ay);
  try{paint(g);}catch(e){}
  return {c:c,wu:wu,hu:hu,ax:ax,ay:ay};
}
function drawSpr(s,x,y,z,sc,rot,alpha){
  if(!s)return;
  const S=cam.S*(sc||1);
  const X=sx(x),Y=sy(y,z);
  if(X<-s.wu*S||X>W+s.wu*S||Y<-s.hu*S||Y>H+s.hu*S)return;
  if(alpha!==undefined&&alpha<1)ctx.globalAlpha=alpha;
  if(rot){ctx.save();ctx.translate(X,Y);ctx.rotate(rot);ctx.drawImage(s.c,-s.ax*S,-s.ay*S,s.wu*S,s.hu*S);ctx.restore();}
  else ctx.drawImage(s.c,X-s.ax*S,Y-s.ay*S,s.wu*S,s.hu*S);
  if(alpha!==undefined&&alpha<1)ctx.globalAlpha=1;
}
let shadowSpr=null;
function buildShadow(){
  const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  g.fillStyle=RG(g,32,32,0,32,32,32,[[0,'rgba(20,10,4,0.55)'],[0.5,'rgba(20,10,4,0.32)'],[1,'rgba(20,10,4,0)']]);
  g.fillRect(0,0,64,64);shadowSpr=c;
}
function shadow(x,y,z,rx,a){ // soft contact shadow, light from upper-left
  const X=sx(x+rx*0.12),Y=sy(y,z+rx*0.1),S=cam.S;
  const w=rx*2.3*S,h=rx*2.3*S*K;
  if(X+w<0||X-w>W||Y+h<0||Y-h>H)return;
  ctx.globalAlpha=a===undefined?1:a;
  ctx.drawImage(shadowSpr,X-w/2,Y-h/2,w,h);
  ctx.globalAlpha=1;
}

/* ---------- paint helpers (unit space) ---------- */
function pSphere(g,r,col,gloss,cy){
  if(cy===undefined)cy=-r*U;
  g.fillStyle=RG(g,-r*0.38,cy-r*0.42,r*0.04,0,cy,r*1.02,[[0,shade(col,1.55)],[0.32,col],[0.85,shade(col,0.5)],[1,shade(col,0.38)]]);
  ell(g,0,cy,r,r);g.fill();
  g.fillStyle=RG(g,r*0.25,cy+r*0.72,0,r*0.25,cy+r*0.72,r*0.75,[[0,'rgba(255,196,120,0.30)'],[1,'rgba(255,196,120,0)']]);
  ell(g,0,cy,r,r);g.fill();
  g.fillStyle='rgba(255,255,255,'+gloss+')';ell(g,-r*0.36,cy-r*0.44,r*0.24,r*0.15);g.fill();
  g.fillStyle='rgba(255,255,255,'+(gloss*0.35)+')';ell(g,r*0.42,cy+r*0.3,r*0.12,r*0.08);g.fill();
}
function pCyl(g,rx,h,side,top,dark,y0){
  y0=y0||0;const ry=rx*K,hh=h*U;
  g.fillStyle=LG(g,-rx,0,rx,0,[[0,shade(side,0.55)],[0.25,shade(side,1.25)],[0.5,side],[1,shade(side,dark||0.4)]]);
  g.beginPath();g.ellipse(0,y0,rx,ry,0,0,Math.PI);g.lineTo(-rx,y0-hh);g.ellipse(0,y0-hh,rx,ry,0,Math.PI,0,true);g.closePath();g.fill();
  g.fillStyle=LG(g,-rx,y0-hh-ry,rx,y0-hh+ry,[[0,shade(top,1.25)],[1,shade(top,0.85)]]);
  ell(g,0,y0-hh,rx,ry);g.fill();
}
function pBox(g,w,d,h,col,opt){ // centered box: x[-w/2,w/2], z[-d/2,d/2], height h ; drawn front+top
  opt=opt||{};
  const hw=w/2,dk=d*K/2,hh=h*U;
  // front face
  g.fillStyle=LG(g,0,dk-hh,0,dk,[[0,shade(col,0.9)],[1,shade(col,0.62)]]);
  g.fillRect(-hw,dk-hh,w,hh);
  // top face
  g.fillStyle=LG(g,-hw,-dk-hh,hw,dk-hh,[[0,shade(col,1.35)],[1,shade(col,1.05)]]);
  g.fillRect(-hw,-dk-hh,w,dk*2);
  // worn edges
  g.strokeStyle=shade(col,1.6);g.lineWidth=0.05;g.globalAlpha=0.7;
  g.beginPath();g.moveTo(-hw,dk-hh);g.lineTo(hw,dk-hh);g.stroke();g.globalAlpha=1;
  g.strokeStyle='rgba(30,15,5,0.35)';g.lineWidth=0.03;g.strokeRect(-hw,-dk-hh,w,dk*2+hh);
}

/* ---------- item paints ---------- */
const PAL={bead:['#c8352e','#1f7a8c','#e0a922','#efe8d8','#2d4fa3','#6a3d8f'],block:['#b8382f','#d9a531','#3f7d4e','#2f5c9e','#c9a57a'],button:['#c8352e','#f0e6cf','#2d4fa3','#2a7a5e'],thread:['#c8352e','#2d4fa3','#e0a922','#3f7d4e']};
function paintItem(g,it){
  const s=it.size,t=it.t,c=it.col;
  if(t==='crumb'){
    const n=9,pts=[];const rs=mulberry(it.seed);
    for(let i=0;i<n;i++){const a=i/n*TAU;const rad=s*(0.75+rs()*0.4);pts.push([Math.cos(a)*rad,Math.sin(a)*rad*0.8-s*0.42]);}
    g.fillStyle=LG(g,-s,-s*1.2,s,s*0.2,[[0,'#f0c37a'],[0.5,'#c98a3e'],[1,'#7a4a1c']]);
    g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<=n;i++){const p=pts[i%n],q=pts[(i-1)%n];g.quadraticCurveTo(q[0],q[1],(p[0]+q[0])/2,(p[1]+q[1])/2);}g.closePath();g.fill();
    g.fillStyle='rgba(110,60,20,0.6)';for(let i=0;i<6;i++){ell(g,(rs()-0.5)*s*1.1,-s*0.42+(rs()-0.5)*s*0.8,s*0.07,s*0.05);g.fill();}
    g.fillStyle='rgba(255,236,190,0.55)';ell(g,-s*0.25,-s*0.65,s*0.25,s*0.12);g.fill();
  }else if(t==='bead'||t==='marble'){
    pSphere(g,s,c,t==='marble'?0.95:0.8);
    if(t==='bead'){g.fillStyle='rgba(20,10,5,0.55)';ell(g,0,-s*U-s*0.72,s*0.18,s*0.09);g.fill();}
  }else if(t==='spool'){
    const rx=s*0.95;
    pCyl(g,rx,0.18,'#b98a55','#d8b07c',0.4,0);
    pCyl(g,rx*0.78,1.1,c,c,0.35,-0.18*U);

let AC=null,master=null,noiseBuf=null,audioWanted=false;
const lastSnd={};
function startAudio(){
  audioWanted=true;
  if(AC){if(AC.state==='suspended'){try{AC.resume();}catch(e){}}return;}
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    AC=new C();
    master=AC.createGain();master.gain.value=0.75;
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
    master.connect(comp);comp.connect(AC.destination);
    const len=AC.sampleRate*1;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const b=AC.createBuffer(1,1,AC.sampleRate);const src=AC.createBufferSource();src.buffer=b;src.connect(AC.destination);src.start(0);
    if(AC.state==='suspended'){AC.resume();}
  }catch(e){AC=null;}
}
function canSnd(key,gap){const n=performance.now();if(lastSnd[key]&&n-lastSnd[key]<gap)return false;lastSnd[key]=n;return true;}
function tone(f,d,o){
  if(!AC||!master)return;o=o||{};
  try{
    const t=AC.currentTime+(o.delay||0);
    const osc=AC.createOscillator();osc.type=o.type||'sine';
    osc.frequency.setValueAtTime(f,t);if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t+d*(o.toT||1));
    const g=AC.createGain();const v=o.vol||0.15;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.att||0.004));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    osc.connect(g);g.connect(master);osc.start(t);osc.stop(t+d+0.03);
  }catch(e){}
}
function noise(d,o){
  if(!AC||!master||!noiseBuf)return;o=o||{};
  try{
    const t=AC.currentTime+(o.delay||0);
    const src=AC.createBufferSource();src.buffer=noiseBuf;
    const f=AC.createBiquadFilter();f.type=o.ft||'bandpass';f.frequency.setValueAtTime(o.f||1000,t);if(o.fto)f.frequency.exponentialRampToValueAtTime(o.fto,t+d);f.Q.value=o.q||1;
    const g=AC.createGain();const v=o.vol||0.1;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.att||0.004));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    src.connect(f);f.connect(g);g.connect(master);src.start(t,Math.random()*0.5);src.stop(t+d+0.03);
  }catch(e){}
}

/* ================= persistence ================= */
const SKEY='tinrobo-pocket-261105-v1';
let figs=[];
function validFig(f){
  if(!f||typeof f!=='object'||!Array.isArray(f.g))return false;
  if(f.g.length<1||f.g.length>24)return false;
  for(const e of f.g){if(!Array.isArray(e)||e.length<2)return false;if(typeof e[0]!=='string'||!/^#[0-9a-fA-F]{6}$/.test(e[0]))return false;if(typeof e[1]!=='number'||!isFinite(e[1])||e[1]<0.1||e[1]>3)return false;}
  if(typeof f.c!=='number'||!(f.c>=0&&f.c<=20))return false;
  if(f.s!=='L'&&f.s!=='R'&&f.s!=='N')return false;
  return true;
}
function loadFigs(){
  let raw=null;
  try{raw=window.localStorage?localStorage.getItem(SKEY):null;}catch(e){raw=null;}
  if(!raw||raw.length>20000)return [];
  let o=null;try{o=JSON.parse(raw);}catch(e){return [];}
  if(!o||typeof o!=='object'||o.v!==1||!Array.isArray(o.figs))return [];
  return o.figs.filter(validFig).slice(-5).map(f=>({g:f.g.map(e=>[e[0],e[1]]),c:f.c|0,s:f.s,f:f.f?1:0}));
}
function saveFigs(){
  try{
    let list=figs.slice(-5);let str=JSON.stringify({v:1,figs:list});
    while(str.length>6000&&list.length>1){list=list.slice(1);str=JSON.stringify({v:1,figs:list});}
    localStorage.setItem(SKEY,str);
    LOG('save-ok');
  }catch(e){LOG('save-failed');}
}

  let bb=0;for(const b of R.body)bb++;
  R.r=clamp(1.15+0.07*R.crumbs+0.02*bb,1.15,2.3);
}

/* ================= statics ================= */
// shape 'c' circle (x,z,r) or 'b' box (x0,x1,z0,z1); y0,h vertical extent
function mkStatic(o){o.wob=0;o.y0=o.y0||0;o.h=o.h||2;o.solid=o.solid!==false;statics.push(o);return o;}
function collideStatic(o,rad,st,oy){
  if(!st.solid)return null;
  if(oy!==undefined&&(oy>st.y0+st.h-0.2||oy+1.5<st.y0))return null;
  if(st.shape==='c'){
    const dx=o.x-st.x,dz=o.z-st.z,d=Math.hypot(dx,dz),m=rad+st.r;
    if(d<m){const nx=d>1e-5?dx/d:1,nz=d>1e-5?dz/d:0;o.x=st.x+nx*m;o.z=st.z+nz*m;return {nx:nx,nz:nz,pen:m-d,cx:st.x+nx*st.r,cz:st.z+nz*st.r};}
  }else{
    const cx=clamp(o.x,st.x0,st.x1),cz=clamp(o.z,st.z0,st.z1);
    let dx=o.x-cx,dz=o.z-cz,d2=dx*dx+dz*dz;
    if(d2<rad*rad){
      let nx,nz,d=Math.sqrt(d2);
      if(d>1e-5){nx=dx/d;nz=dz/d;}
      else{const l=o.x-st.x0,r=st.x1-o.x,t=o.z-st.z0,b=st.z1-o.z,m=Math.min(l,r,t,b);
        if(m===l){nx=-1;nz=0;o.x=st.x0;}else if(m===r){nx=1;nz=0;o.x=st.x1;}else if(m===t){nx=0;nz=-1;o.z=st.z0;}else{nx=0;nz=1;o.z=st.z1;}d=0;}
      const px=d>1e-5?cx:o.x,pz=d>1e-5?cz:o.z;
      o.x=px+nx*rad;o.z=pz+nz*rad;return {nx:nx,nz:nz,pen:rad-d,cx:cx,cz:cz};
    }
  }
  return null;
}

  table:{name:'table',zoom:1,b:tableBounds,heightAt(){return 0;}},
  room:{name:'room',zoom:0.74,b:{x0:-30,x1:30,z0:-20,z1:16},heightAt(x,z){
      let h=0;if(z<-14)h=9;
      if(book&&book.open){const hr=rampH(x,z);if(hr>h)h=hr;}
      return h;}},
  sky:{name:'sky',zoom:0.68,b:{x0:-26,x1:26,z0:-24,z1:24},heightAt(){return 0;}}
};
function rampH(x,z){
  const tx=book.tx,tz=-14,dx=book.dx,dz=book.dz,L=11;
  const rx=x-tx,rz=z-tz;const t=(rx*dx+rz*dz)/L;const s=Math.abs(rx*dz-rz*dx);
  if(t>=-0.05&&t<=1&&s<=3.1)return 9*(1-clamp(t,0,1));
  return -1;
}

function freeSpot(x,z,r){
  for(const st of statics){if(!st.solid)continue;
    if(st.shape==='c'){if(hyp(x-st.x,z-st.z)<st.r+r+0.3)return false;}
    else if(x>st.x0-r-0.3&&x<st.x1+r+0.3&&z>st.z0-r-0.3&&z<st.z1+r+0.3)return false;}
  for(const it of items){if(it.state==='loose'&&hyp(x-it.x,z-it.z)<it.size+r+0.4)return false;}
  if(hyp(x-R.x,z-R.z)<R.r+r+1.2)return false;
  return true;
}
function place(t,x0,x1,z0,z1,o){
  for(let k=0;k<60;k++){const x=rr(x0,x1),z=rr(z0,z1);const sz=TYPES[t].size[1];if(freeSpot(x,z,sz))return mkItem(t,x,z,o);}
  return null;
}

/* ================= camera ================= */
function camTarget(snap){
  const S=cam.S;
  const marX=Math.max(W*0.26,SA.l+60),marXR=Math.max(W*0.26,SA.r+60);
  const marT=Math.max(H*0.28,SA.t+80),marB=Math.max(H*0.26,SA.b+80);
  const px=sx(R.x),py=sy(R.y+R.rv*(1+R.bal*2.6)+R.jump+(zone.name==='room'&&R.y>4?6:0),R.z);
  let tx=cam.x,tz=cam.z;
  if(px<marX)tx=cam.x-(marX-px)/S;else if(px>W-marXR)tx=cam.x+(px-(W-marXR))/S;
  if(py<marT)tz=cam.z-(marT-py)/(S*K);else if(py>H-marB)tz=cam.z+(py-(H-marB))/(S*K);
  // keep view in zone
  const b=zone.b,vw=W*0.5/S,vh=H*0.5/(S*K);
  const extraTop=zone.name==='room'?26:zone.name==='sky'?18:4;
  const x0=b.x0-3+vw,x1=b.x1+3-vw;tx=x0>x1?(b.x0+b.x1)/2:clamp(tx,x0,x1);
  const z0=b.z0-extraTop+vh,z1=b.z1+4-vh;tz=z0>z1?(b.z0-extraTop+b.z1)/2:clamp(tz,z0,z1);
  return [tx,tz];
}

const inp={id:null,on:false,px:0,py:0,offX:0,offZ:0,t0:0};
let lastInput=-99,everTouched=false,demo={shown:false,t:-1};
let ctrlLock=false; // during transitions
function robotScreen(){if(R.bal>0.5){return [sx(R.x),sy(R.y+R.rv*3.2,R.z)];}return [sx(R.x),sy(R.y+R.rv*1.05,R.z)];}
function onDown(e){
  e.preventDefault();
  startAudio();
  if(inp.id!==null)return; // ignore extra fingers
  inp.id=e.pointerId;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const px=e.clientX,py=e.clientY;inp.px=px;inp.py=py;inp.t0=clock;
  lastInput=clock;everTouched=true;if(demo.t>=0)demo.t=-1;demo.shown=true;
  const rs=robotScreen();
  const hitR=Math.max(62,R.rv*cam.S*(R.bal>0.5?3.2:2.1));
  R.lookOX=wxOf(px);R.lookOZ=wzOf(py,R.y+R.rv);R.lookT=1.4;
  if(!ctrlLock&&!R.hidden&&hyp(px-rs[0],py-rs[1])<hitR){
    inp.on=true;
    R.pressT=1;R.pressV+=6;R.expr='eager';R.exprT=0.6;R.pressLook=0.9;R.pressLX=clamp((px-rs[0])/hitR*2,-1,1);
    const fy=R.y+R.rv;inp.offX=wxOf(px)-R.x;inp.offZ=wzOf(py,fy)-R.z;
    SFX.press();LOG('grab');
  }else{
    inp.on=false;
    irrelevantTouch(px,py);
  }
}
function onMove(e){if(e.pointerId!==inp.id)return;e.preventDefault();inp.px=e.clientX;inp.py=e.clientY;lastInput=clock;}
function onUp(e){if(e.pointerId!==inp.id)return;release();}
function release(){
  if(inp.on){R.pressT=0;R.pressV-=5;}
  inp.on=false;
  if(inp.id!==null){try{cv.releasePointerCapture(inp.id);}catch(_){}}
  inp.id=null;
}

function irrelevantTouch(px,py){
  // only a small wiggle of whatever is under the finger; the robot glances there
  let best=null,bd=70;
  for(const it of items){if(it.state!=='loose')continue;const d=hyp(px-sx(it.x),py-sy(it.y+it.size*0.6,it.z));if(d<bd){bd=d;best=it;}}
  for(const st of statics){if(st.invisible)continue;const x=st.shape==='c'?st.x:(st.x0+st.x1)/2,z=st.shape==='c'?st.z:st.z1;const d=hyp(px-sx(x),py-sy(st.y0+st.h*0.5,z));if(d<Math.max(bd,st.shape==='c'?st.r*cam.S:40)){bd=d;best=st;}}
  puff(wxOf(px),0,wzOf(py,0),2,'#efe2c8');
  if(best){best.wob=1;SFX.tick(best.mat||'soft');}
  else{puff(wxOf(px),zone.heightAt(wxOf(px),wzOf(py,0)),wzOf(py,0),3,'#e8dcc4');SFX.tick('soft');}
  R.expr='curious';R.exprT=0.8;
}

/* ================= particles ================= */
const PMAX=140;
function addPart(p){if(parts.length>=PMAX)parts.shift();parts.push(p);}
function puff(x,y,z,n,col){for(let i=0;i<n;i++)addPart({x:x,y:y+0.2,z:z,vx:rr(-1.5,1.5),vy:rr(0.5,2.5),vz:rr(-1.5,1.5),life:rr(0.4,0.8),t:0,s:rr(0.06,0.14),col:col||'#d9a25a',k:'dust'});}
function sparkle(x,y,z,n){for(let i=0;i<n;i++){const a=rng()*TAU,v=rr(2,5);addPart({x:x,y:y,z:z,vx:Math.cos(a)*v,vy:rr(2,6),vz:Math.sin(a)*v,life:rr(0.6,1.1),t:0,s:rr(0.1,0.22),col:pick(['#fff3c4','#ffd76a','#ffffff']),k:'star'});}}

/* ================= picking & spilling ================= */
function pickItem(it,byChain){
  if(it.state!=='loose')return;
  const first=!D.firstPick;D.firstPick=1;
  it.fx=it.x;it.fy=it.y;it.fz=it.z;it.ft=0;it.arr=0;
  SFX.pick(it);R.chestV+=3;R.happy=0.5;
  if(!first&&R.expr!=='strain'){R.expr='happy';R.exprT=0.35;}
  if(zone.name==='sky'){
    it.state='held';R.clouds.push(it);it.slotA=R.clouds.length*2.4;LOG('cloud',R.clouds.length);
    if(R.clouds.length===3&&!D.threeClouds){D.threeClouds=1;}
    return;
  }
  const T=TYPES[it.t];
  if(T.eat){it.state='toChest';flights.push(it);}
  else if(it.t==='ribbon'){it.state='body';it.slot=R.body.length;R.body.push(it);}
  else if(it.t==='spool'&&!R.hasSpool){R.hasSpool=true;it.state='chain';R.chain.unshift(it);it.lx=it.x;it.lz=it.z;LOG('spool');R.expr='wow';R.exprT=0.8;}
  else if(R.hasSpool&&R.chain.length<20){it.state='chain';R.chain.push(it);it.lx=it.x;it.lz=it.z;}
  else{it.state='body';it.slot=R.body.length;R.body.push(it);}
  if(it.t==='ribbon'){R.ribbon=it;LOG('ribbon');}
  if(it.t==='bead'&&it.pushed&&!D.bead){D.bead=1;success(it.x,it.y,it.z);LOG('D1-bead-attached-after-push',{r:R.r.toFixed(2)});}
  if(byChain&&!D.sweep){D.sweep=1;SFX.sweep();sparkle(it.x,it.y+0.5,it.z,8);LOG('D2-chain-swept',{len:R.chain.length});}
  else if(byChain){if(canSnd('swp',500))SFX.sweep();}
  if(it.t==='block')LOG('block',blocksCarried()+1);
  recalcR();
}
function spill(){
  // front-most small thing tumbles out toward the bowl
  let it=null;
  if(R.body.length){let bi=0;for(let i=1;i<R.body.length;i++)if(R.body[i].size>R.body[bi].size)bi=i;it=R.body.splice(bi,1)[0];const p=bodyPos(it);it.x=p[0];it.y=p[1];it.z=p[2];}
  else if(R.crumbs>0){R.crumbs--;it=mkItem('crumb',R.x+Math.cos(R.head)*R.r,R.z+Math.sin(R.head)*R.r,{});it.y=R.y+R.r;}
  if(!it)return false;
  recalcR();
  it.state='toBowl';it.fx=it.x;it.fy=it.y+0.4;it.fz=it.z;it.ft=0;flights.push(it);
  R.chestV-=2;R.tiltT=1;R.expr='puzzled';R.exprT=0.8;
  LOG('D3-spill',{kind:it.t,hw:halfW().toFixed(2)});
  return true;
}
function success(x,y,z){SFX.success();sparkle(x,y+0.6,z,16);R.jumpV=5;R.expr='joy';R.exprT=1.2;R.happy=1;}

/* ================= update ================= */
let phase='play',trans=null;
function bodyPos(it){
  const a=SLOTS[it.slot%SLOTS.length],layer=Math.floor(it.slot/SLOTS.length);
  const rad=R.rv*0.92+it.size*0.5+layer*0.35;
  return [R.x+Math.cos(a)*rad,R.y+R.jump+R.rv*(0.75+layer*0.45)+(it.slot%2)*0.25,R.z+Math.sin(a)*rad*0.9];
}
function stepHeight(x,z){return zone.heightAt(x,z);}

function moveRobot(dt){
  const ctrl=inp.on&&!ctrlLock&&phase==='play';
  const cm=carried();
  const maxSp=Math.max(3.6,(zone.name==='sky'?9.5:8.6)/(1+cm*0.09));
  let dvx=0,dvz=0;
  if(ctrl){
    const fy=R.y+R.rv;
    const tx=wxOf(inp.px)-inp.offX,tz=wzOf(inp.py,fy)-inp.offZ;
    let ex=tx-R.x,ez=tz-R.z;const d=hyp(ex,ez);
    if(d>0.12){const sp=Math.min(maxSp,d*5.5);dvx=ex/d*sp;dvz=ez/d*sp;}
    R.lookOX=tx+ex;R.lookOZ=tz+ez;
  }
  const acc=ctrl?7:8;
  R.vx+=(dvx-R.vx)*Math.min(1,dt*acc);R.vz+=(dvz-R.vz)*Math.min(1,dt*acc);
  const sp=hyp(R.vx,R.vz);
  if(sp>0.35){const th=Math.atan2(R.vz,R.vx);let dh=th-R.head;while(dh>Math.PI)dh-=TAU;while(dh<-Math.PI)dh+=TAU;R.head+=clamp(dh,-dt*7,dt*7);}
  // integrate with platform steps
  const hw=halfW();
  let nx=R.x+R.vx*dt,nz=R.z+R.vz*dt;
  const h0=stepHeight(R.x,R.z);
  const okAt=(x,z)=>{const lx=x+(sp>0.01?R.vx/sp:0)*hw*0.7,lz=z+(sp>0.01?R.vz/sp:0)*hw*0.7;return Math.abs(stepHeight(x,z)-h0)<1.4&&Math.abs(stepHeight(lx,lz)-h0)<1.8;};
  if(!okAt(nx,nz)){
    if(okAt(nx,R.z)){nz=R.z;R.vz*=-0.2;}else if(okAt(R.x,nz)){nx=R.x;R.vx*=-0.2;}else{nx=R.x;nz=R.z;R.vx*=-0.3;R.vz*=-0.3;}
    if(sp>2)SFX.bump();
  }
  R.x=nx;R.z=nz;
  const b=zone.b;R.x=clamp(R.x,b.x0+hw,b.x1-hw);R.z=clamp(R.z,b.z0+hw*0.6,b.z1-hw*0.6);
  // statics
  let tp=null,tn=null;
  for(const st of statics){
    const c=collideStatic(R,hw,st,R.y);
    if(c){
      if(st===teapot)tp=c;if(st===tin)tn=c;
      const vn=R.vx*c.nx+R.vz*c.nz;if(vn<0){R.vx-=vn*c.nx*1.2;R.vz-=vn*c.nz*1.2;}
      if(vn<-2.5){st.wob=Math.max(st.wob,0.35);SFX.bump();}
      if(st.kind==='book')bookHit(c,-vn,'robot',R.x,R.z);
    }
  }
  // the narrow gap: fat robot pressed between teapot and tin
  if(zone.name==='table'&&tp&&tn&&ctrl){
    R.squeeze+=dt;R.tiltT=1;
    if(R.squeeze>0.18){SFX.squeeze();R.expr='puzzled';R.exprT=0.4;}
    R.spillCd-=dt;
    if(R.squeeze>0.3&&R.spillCd<=0){if(spill())R.spillCd=0.42;if(!D.gapStuck){D.gapStuck=1;LOG('D3-gap-blocked',{hw:hw.toFixed(2)});}}
  }else{R.squeeze=Math.max(0,R.squeeze-dt*2);R.tiltT=R.squeeze>0?1:(R.tiltT>0.5&&R.exprT>0?R.tiltT:0);}
  if(zone.name==='table'&&!D.gapPassed&&R.z<-11.4&&R.x>2&&R.x<15){D.gapPassed=1;LOG('passed-gap',{hw:hw.toFixed(2)});}
  // ground height
  R.gy=stepHeight(R.x,R.z);
  R.y+=(R.gy-R.y)*Math.min(1,dt*12);
  // wheels clatter
  const moved=sp*dt;R.dist+=moved;R.wheel+=moved/(R.rv*0.32);
  if(R.dist>0.55&&zone.name!=='sky'){R.dist=0;SFX.wheel(sp);if(rng()<0.25&&zone.name==='table')puff(R.x-Math.cos(R.head)*R.r,R.y,R.z-Math.sin(R.head)*R.r,1,'#caa27a');}
  // strain when heavy
  R.strain+=((cm>3.2&&sp>1.5?1:0)-R.strain)*Math.min(1,dt*3);
  R.lean+=((clamp(-R.vx*0.02,-0.12,0.12))-R.lean)*Math.min(1,dt*6);
}

function updateItems(dt){
  const b=zone.b;
  const hw=halfW();
  const rob={x:R.x,z:R.z};
  for(const it of items){
    if(it.state!=='loose')continue;
    it.wob*=Math.exp(-dt*4);
    // motion
    const f=Math.exp(-dt*it.fr);
    it.vx*=f;it.vz*=f;
    if(Math.abs(it.vx)+Math.abs(it.vz)>0.002){
      let nx=it.x+it.vx*dt,nz=it.z+it.vz*dt;
      const h0=zone.heightAt(it.x,it.z);
      if(Math.abs(zone.heightAt(nx,nz)-h0)>1.2){it.vx*=-0.4;it.vz*=-0.4;nx=it.x;nz=it.z;}
      it.x=nx;it.z=nz;
    }
    const s=it.size;
    if(it.x<b.x0+s){it.x=b.x0+s;it.vx=Math.abs(it.vx)*0.5;}if(it.x>b.x1-s){it.x=b.x1-s;it.vx=-Math.abs(it.vx)*0.5;}
    if(it.z<b.z0+s){it.z=b.z0+s;it.vz=Math.abs(it.vz)*0.5;}if(it.z>b.z1-s){it.z=b.z1-s;it.vz=-Math.abs(it.vz)*0.5;}
    // the bowl catches small rolling things
    if(bowl&&zone.name==='table'&&it.size<0.75&&it.t!=='spool'&&hyp(it.x-bowl.x,it.z-bowl.z)<bowl.r+s*0.4&&hyp(it.vx,it.vz)>0.6){
      it.state='toBowl';it.fx=it.x;it.fy=it.y;it.fz=it.z;it.ft=0;flights.push(it);LOG('rolled-into-bowl',it.t);continue;
    }
    for(const st of statics){const c=collideStatic(it,s*0.9,st,it.y);if(c){const vn=it.vx*c.nx+it.vz*c.nz;if(vn<0){const bo=TYPES[it.t].bounce||0.3;it.vx-=vn*c.nx*(1+bo);it.vz-=vn*c.nz*(1+bo);if(vn<-1.2)SFX.push(it,-vn);}
      if(st.kind==='book'&&it.t==='furn')bookHit(c,-vn,'furn',it.x,it.z);}}
    it.y+=(zone.heightAt(it.x,it.z)-it.y)*Math.min(1,dt*10);
    // robot contact
    if(phase==='play'||phase==='lift'){
      const dx=it.x-R.x,dz=it.z-R.z,d=hyp(dx,dz),m=hw+s*0.85;
      if(d<m&&Math.abs(it.y-R.y)<2.5){
        if(canPick(it)&&phase==='play'){pickItem(it,false);continue;}
        const nx=d>1e-4?dx/d:1,nz=d>1e-4?dz/d:0;
        const rm=1+carried()*0.6,ratio=rm/(rm+it.mass);
        const pen=m-d;
        it.x+=nx*pen*ratio;it.z+=nz*pen*ratio;
        if(it.t==='furn'){R.x-=nx*pen*(1-ratio);R.z-=nz*pen*(1-ratio);if(!D.furn&&ratio>0.1&&hyp(R.vx,R.vz)>1){D.furn=1;LOG('D4-furniture-shift');}}
        const vn=(R.vx-it.vx)*nx+(R.vz-it.vz)*nz;
        if(vn>0){it.vx+=nx*vn*(1+(TYPES[it.t].bounce||0.2))*ratio;it.vz+=nz*vn*(1+(TYPES[it.t].bounce||0.2))*ratio;SFX.push(it,vn);
          if(it.t==='furn'&&vn>0.8)noise(0.12,{f:400,q:1,vol:0.05});}
        if(!it.pushed&&it.t==='bead'){it.pushed=true;LOG('D1-bead-pushed',{r:R.r.toFixed(2)});}
        it.pushed=true;
        if(it.t!=='furn')it.wob=Math.max(it.wob,0.4);
      }
    }
  }
  // item-item
  for(let i=0;i<items.length;i++){const a=items[i];if(a.state!=='loose')continue;
    for(let j=i+1;j<items.length;j++){const c=items[j];if(c.state!=='loose')continue;
      const dx=c.x-a.x,dz=c.z-a.z,m=(a.size+c.size)*0.85;if(Math.abs(dx)>m||Math.abs(dz)>m)continue;
      const d=hyp(dx,dz);if(d<m&&d>1e-4&&Math.abs(a.y-c.y)<2){const nx=dx/d,nz=dz/d,pen=m-d,ta=a.mass+c.mass;
        a.x-=nx*pen*c.mass/ta;a.z-=nz*pen*c.mass/ta;c.x+=nx*pen*a.mass/ta;c.z+=nz*pen*a.mass/ta;
        const vn=(a.vx-c.vx)*nx+(a.vz-c.vz)*nz;if(vn>0){const j2=vn*1.6/ta;a.vx-=nx*j2*c.mass;a.vz-=nz*j2*c.mass;c.vx+=nx*j2*a.mass;c.vz+=nz*j2*a.mass;if(vn>1.5&&(a.mat==='hard'||c.mat==='hard'))SFX.push(a.mat==='hard'?a:c,vn*0.6);}}}}
}

function updateChain(dt){
  // the thread follows the robot; the line lags and swings wide on turns
  let px=R.x-Math.cos(R.head)*R.rv*0.85,pz=R.z-Math.sin(R.head)*R.rv*0.85,ps=R.rv*0.2;let prevY=R.gy;
  const damp=Math.exp(-dt*1.25);
  for(const L of R.chain){
    const dd=(ps+L.size)*0.82+(L===R.chain[0]?1.6:0.55);
    // momentum: links keep sliding, so turns fling the line outward in an arc
    const ox=L.lx,oz=L.lz;
    if(L.arr>=1){L.lx+=L.cvx*dt;L.lz+=L.cvz*dt;}
    let dx=L.lx-px,dz=L.lz-pz,d=hyp(dx,dz);
    if(d>dd){const k=(d-dd)/d,corr=L.arr<1?Math.min(1,dt*9):1;L.lx-=dx*k*corr;L.lz-=dz*k*corr;}
    L.arr=Math.min(1,L.arr+dt*2.6);
    const o={x:L.lx,z:L.lz};
    for(const st of statics)collideStatic(o,L.size*0.75,st,L.y);
    const b=zone.b;o.x=clamp(o.x,b.x0+L.size,b.x1-L.size);o.z=clamp(o.z,b.z0+L.size,b.z1-L.size);
    // links respect steps (shelf edge, sides of the ramp)
    const h0=zone.heightAt(ox,oz);
    if(Math.abs(zone.heightAt(o.x,o.z)-h0)>1.3){
      if(Math.abs(zone.heightAt(o.x,oz)-h0)<=1.3)o.z=oz;else if(Math.abs(zone.heightAt(ox,o.z)-h0)<=1.3)o.x=ox;else{o.x=ox;o.z=oz;}
    }
    // left behind on another level: the thread yanks it up with a hop
    {const dp=hyp(o.x-px,o.z-pz);const ph=prevY;
      if(dp>dd*2.4||(dp>dd*1.4&&Math.abs(zone.heightAt(o.x,o.z)-ph)>1.5)){
        const ux=dp>1e-4?(o.x-px)/dp:1,uz=dp>1e-4?(o.z-pz)/dp:0;o.x=px+ux*dd*0.9;o.z=pz+uz*dd*0.9;
        if(Math.abs(zone.heightAt(o.x,o.z)-ph)>1.3){o.x=px;o.z=pz;}
        L.arr=0.35;L.y=ph;L.cvx=0;L.cvz=0;if(canSnd('yank',200))tone(900,0.06,{type:'triangle',vol:0.05,to:1300});}}
    const id=1/Math.max(dt,1e-3);
    L.cvx=(o.x-ox)*id*damp;L.cvz=(o.z-oz)*id*damp;
    const cs=hyp(L.cvx,L.cvz);if(cs>14){L.cvx*=14/cs;L.cvz*=14/cs;}
    L.lvx=L.cvx;L.lvz=L.cvz;
    L.lx=o.x;L.lz=o.z;L.x=o.x;L.z=o.z;
    L.y+=(zone.heightAt(L.x,L.z)-L.y)*Math.min(1,dt*8);
    px=L.lx;pz=L.lz;ps=L.size;prevY=L.y;
  }
  // chain links sweep up loose things or nudge the book
  if(phase!=='play')return;
  for(let li=0;li<R.chain.length;li++){const L=R.chain[li];if(L.arr<0.6)continue;
    for(const it of items){if(it.state!=='loose')continue;
      const dx=it.x-L.x,dz=it.z-L.z,m=L.size*0.95+it.size*0.9;if(Math.abs(dx)>m||Math.abs(dz)>m)continue;
      const d=hyp(dx,dz);if(d<m+0.35&&Math.abs(it.y-L.y)<2){
        if(canPick(it)){pickItem(it,true);continue;}if(d>=m)continue;
        else{const nx=d>1e-4?dx/d:1,nz=d>1e-4?dz/d:0;const ratio=L.mass/(L.mass+it.mass);it.x+=nx*(m-d)*ratio;it.z+=nz*(m-d)*ratio;it.vx+=nx*hyp(L.lvx,L.lvz)*0.3*ratio;it.vz+=nz*hyp(L.lvx,L.lvz)*0.3*ratio;it.pushed=true;}
      }}
    if(book&&!book.open&&zone.name==='room'&&L.t==='block'){
      const o={x:L.x,z:L.z};const c=collideStatic(o,L.size*0.8,book.st,L.y);
      if(c)bookHit(c,hyp(L.lvx,L.lvz),'chain',L.x,L.z);
    }
  }
}

function bookHit(c,speed,who,x,z){
  if(!book||book.open||book.cd>0)return;
  const cl=hyp(c.cx-(-14),c.cz-(-12.6)),crr=hyp(c.cx-(-8),c.cz-(-12.6));
  const near=Math.min(cl,crr)<2.0;
  if(speed<1.2)return;
  book.cd=0.7;
  if(near&&blocksCarried()>=3){openBook(cl<crr?'L':'R',who);return;}
  book.wob=near?Math.min(1,0.25+blocksCarried()*0.22):0.2;
  SFX.wobble();book.hits++;
  if(who==='robot'){R.vx+=c.nx*3;R.vz+=c.nz*3;R.expr='puzzled';R.exprT=0.6;}
  LOG('book-wobble',{blocks:blocksCarried(),corner:near});
}
function openBook(side,who){
  book.open=true;book.side=side;book.openT=0;
  if(side==='L'){book.tx=-12.5;const l=hyp(-0.62,0.78);book.dx=-0.62/l;book.dz=0.78/l;}
  else{book.tx=-9.5;const l=hyp(0.62,0.78);book.dx=0.62/l;book.dz=0.78/l;}
  book.st.solid=false;
  SFX.book();setTimeout(()=>{if(book&&book.open)success(R.x,R.y,R.z);},260);
  puff(book.tx+book.dx*5,0,-14+book.dz*5,10,'#d8cdb6');
  LOG('D4-book-opened',{side:side,by:who,blocks:blocksCarried()});
}

function updateRoomBits(dt){
  if(!book)return;
  book.cd=Math.max(0,book.cd-dt);book.wob*=Math.exp(-dt*3);
  if(book.open)book.openT=Math.min(1,book.openT+dt*2.2);
  if(!D.onShelf&&R.y>8.5&&R.z<-14){D.onShelf=1;LOG('D4-reached-shelf');}
  // ribbon pulls the curtain
  if(R.ribbon&&!curtain.winOpen){
    const rb=R.ribbon;const rx=(rb.state==='chain'||rb.state==='body')?(rb.state==='chain'?rb.x:bodyPos(rb)[0]):rb.x;
    const dx=rx-14;
    const pl=clamp((-dx-1)/7,0,1),pr=clamp((dx-1)/7,0,1);
    const before=curtain.open;
    curtain.pL=Math.max(curtain.pL,pl);curtain.pR=Math.max(curtain.pR,pr);
    curtain.open=Math.max(curtain.pL,curtain.pR);curtain.side=curtain.pL>=curtain.pR?'L':'R';
    if(curtain.open>before+0.02)SFX.curtain();
    if(curtain.open>=1){curtain.winOpen=true;SFX.window();setTimeout(()=>success(R.x,R.y,R.z),200);LOG('D5-window-opened',{side:curtain.side,pL:+curtain.pL.toFixed(2),pR:+curtain.pR.toFixed(2)});}
  }
  if(curtain.winOpen)curtain.winT=Math.min(1,curtain.winT+dt*0.8);
  if(curtain.winOpen&&curtain.winT>0.6&&phase==='play'){
    const wpx=14+(curtain.side==='L'?2.5:-2.5);
    if(hyp(R.x-wpx,R.z-(-18.4))<2.8&&R.y>8){startTrans('toSky');}
  }
}

function updateSky(dt){
  if(phase==='play'){
    const d=hyp(R.x,R.z);const a=Math.atan2(R.z,R.x);
    if(d>6.5){
      if(R.lastAng!==null){let da=a-R.lastAng;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;R.loopAcc+=da;}
      R.lastAng=a;
      const tl=R.trail;const last=tl[tl.length-1];
      if(!last||hyp(last[0]-R.x,last[1]-R.z)>0.6){tl.push([R.x,R.z]);if(tl.length>180)tl.shift();}
    }else R.lastAng=null;
    if(R.balT===0&&R.clouds.length>=3&&Math.abs(R.loopAcc)>=TAU*0.92){
      R.balT=1;D.balloon=1;SFX.balloon();setTimeout(()=>success(R.x,R.y,R.z),600);
      LOG('D6-balloon-formed',{clouds:R.clouds.length,ribs:R.frame.length,dir:R.loopAcc>0?'cw':'ccw'});
    }
    if(R.balT>0&&R.bal>0.95&&hyp(R.x,R.z)<4.6){phase='lift';liftT=0;release();LOG('D6-town-wrapped');SFX.lift();}
  }
  R.bal+=(R.balT-R.bal)*Math.min(1,dt*1.6);
  if(phase==='lift'){
    liftT+=dt;
    R.x+=(0-R.x)*Math.min(1,dt*2);R.z+=(0.5-R.z)*Math.min(1,dt*2);
    town.wrap=Math.min(1,liftT/1.2);
    if(liftT>1.2){town.lift=Math.min(1,(liftT-1.2)/2.2);}
    R.jump=6*ease(town.lift);R.jumpV=0;
    if(liftT>1.4&&rng()<0.3)sparkle(R.x,R.y+3,R.z,1);
    if(liftT>4.0&&!trans)startTrans('home');
  }
  // frame items hug the robot as ribs
  const n=R.frame.length;
  R.frame.forEach((f,i)=>{f.arr=Math.min(1,f.arr+dt*1.2);});
  R.clouds.forEach(c=>{c.arr=Math.min(1,c.arr+dt*2);});
}

function updateFlights(dt){
  for(let i=flights.length-1;i>=0;i--){
    const it=flights[i];it.ft+=dt/(it.state==='toBowl'?0.5:0.3);
    if(it.ft>=1){
      flights.splice(i,1);
      if(it.state==='toChest'){it.state='gone';R.crumbs++;recalcR();R.chestV+=5;SFX.grow(R.crumbs);if(R.crumbs%3===0)puff(R.x,R.y+R.r,R.z,3,'#e8c48a');LOG('ate',{crumbs:R.crumbs,r:R.r.toFixed(2)});}
      else if(it.state==='toBowl'){it.state='inBowl';bowl.n.push(it);SFX.spill(it.mat);puff(bowl.x,0.9,bowl.z,2,'#f3ead8');bowl.wob=0.5;
        if(bowl.n.length>=6&&!bowl.full){bowl.full=true;success(bowl.x,1,bowl.z);LOG('D3-bowl-filled',{n:bowl.n.length});}}
    }
  }
}

function updateRobotAnim(dt){
  // springs: press (sink), chest bulge, antenna, jump, tilt
  const k=320,c=18;
  R.pressV+=(-(R.press-(inp.on?0.55+0.45*R.pressT:0))*k-R.pressV*c)*dt;R.press+=R.pressV*dt;
  R.pressT=Math.max(0,R.pressT-dt*3);
  R.chestV+=(-R.chest*140-R.chestV*7)*dt;R.chest+=R.chestV*dt;
  R.antV+=(-R.ant*90-R.antV*4+(-R.vx*0.6))*dt;R.ant+=R.antV*dt;R.ant=clamp(R.ant,-1.2,1.2);
  R.jumpV-=30*dt;R.jump+=R.jumpV*dt;if(R.jump<0){R.jump=0;if(R.jumpV<-3){R.jumpV=-R.jumpV*0.3;}else R.jumpV=0;}
  R.tilt+=((R.tiltT?0.9:0)-R.tilt)*Math.min(1,dt*8);
  R.rv+=(R.r-R.rv)*Math.min(1,dt*5);
  R.exprT-=dt;if(R.exprT<=0){R.expr=R.strain>0.5?'strain':'calm';}
  R.blinkT-=dt;if(R.blinkT<0){R.blink=0.14;R.blinkT=rr(2,4.5);}R.blink=Math.max(0,R.blink-dt);
  R.happy=Math.max(0,R.happy-dt);
  R.lookT-=dt;
  // gaze: finger glance > invitation target
  let lx,lz;
  if(R.lookT>0){lx=R.lookOX;lz=R.lookOZ;}
  else if(invite){lx=invite.x;lz=invite.z;}
  else{lx=R.x+Math.cos(R.head)*3;lz=R.z+Math.sin(R.head)*3;}
  R.lookX+=(lx-R.lookX)*Math.min(1,dt*8);R.lookZ+=(lz-R.lookZ)*Math.min(1,dt*8);
  let dx=R.lookX-R.x,dz=R.lookZ-R.z;const d=Math.max(0.001,hyp(dx,dz));dx/=d;dz/=d;
  R.pressLook=Math.max(0,(R.pressLook||0)-dt);
  if(R.pressLook>0||inp.on&&hyp(R.vx,R.vz)<0.6){dx=R.pressLX||0;dz=-0.95;} // face turns up toward the finger
  R.fx+=(dx-R.fx)*Math.min(1,dt*25);R.fy+=(dz-R.fy)*Math.min(1,dt*25);
}

/* ---------- invitation (one target at a time) ---------- */
let invite=null,invT=0;
function nearestLoose(pred){let best=null,bd=1e9;for(const it of items){if(it.state!=='loose'||!pred(it))continue;const d=hyp(it.x-R.x,it.z-R.z)+Math.abs(it.y-R.y)*3;if(d<bd){bd=d;best=it;}}return best;}
function computeInvite(){
  if(phase!=='play'){invite=null;return;}
  let t=null;
  if(zone.name==='table'){
    if(!D.firstPick)t=items.find(it=>it.t==='crumb'&&it.state==='loose'&&!it.nook)||null;
    if(!t){const sp=items.find(it=>it.t==='spool'&&it.state==='loose');if(sp&&canPick(sp))t=sp;}
    if(!t)t=nearestLoose(it=>canPick(it)&&!it.nook&&it.t!=='furn');
    if(!t)t=nearestLoose(it=>!it.nook);
    if(t){invite={x:t.x,y:t.y,z:t.z,obj:t,r:t.size};return;}
    invite=null;return;
  }
  if(zone.name==='room'){
    if(!book.open){
      if(blocksCarried()<3){t=nearestLoose(it=>it.t==='block'&&canPick(it));if(!t)t=nearestLoose(it=>TYPES[it.t].eat);if(!t)t=nearestLoose(it=>canPick(it)&&it.t!=='ribbon');}
      if(t){invite={x:t.x,y:t.y,z:t.z,obj:t,r:t.size};return;}
      const cx=R.x<-11?-14:-8;invite={x:cx,y:0,z:-12.3,obj:book,r:1.4,corner:1};return;
    }
    if(!R.ribbon){const rb=items.find(it=>it.t==='ribbon');if(rb)invite={x:rb.x,y:rb.y,z:rb.z,obj:rb,r:0.8};
      if(R.y<8){invite={x:book.tx+book.dx*8,y:2,z:-14+book.dz*8,obj:null,r:1.4};}return;}
    if(!curtain.winOpen){const side=curtain.pR>curtain.pL?1:(curtain.pL>0?-1:(R.x<14?-1:1));invite={x:14+side*9,y:9,z:-16.5,obj:null,r:1.2};return;}
    invite={x:14+(curtain.side==='L'?2.5:-2.5),y:9,z:-18.4,obj:'window',r:1.5};return;
  }
  if(zone.name==='sky'){
    if(R.balT>0){invite={x:0,y:-2,z:0,obj:'town',r:3};return;}
    if(R.clouds.length<3){t=nearestLoose(it=>it.t==='cloud');if(t){invite={x:t.x,y:0,z:t.z,obj:t,r:t.size};return;}}
    const a=Math.atan2(R.z,R.x)+(R.loopAcc>=0?0.9:-0.9),d=clamp(hyp(R.x,R.z),9,14);
    invite={x:Math.cos(a)*d,y:0,z:Math.sin(a)*d,obj:'ring',r:1};
  }
}

function checkTableClean(){
  if(zone.name!=='table'||phase!=='play')return;
  let left=0,spoolLoose=false;
  for(const it of items){if(it.state==='loose'&&!it.nook){left++;if(it.t==='spool')spoolLoose=true;}}
  if(left<=3&&!spoolLoose&&flights.length===0&&D.firstPick){LOG('table-cleaned',{left:left});startTrans('toRoom');}
}

/* ================= transitions ================= */
let fade=0,fadeCol='#f3ead8';
function startTrans(kind){
  if(trans)return;
  trans={kind:kind,t:0,swapped:false};phase='trans';ctrlLock=true;release();
  if(kind==='toRoom'){success(R.x,R.y,R.z);SFX.slide();trans.dur=3.2;trans.sx=R.x;trans.sz=R.z;}
  if(kind==='toSky'){trans.dur=3.4;trans.sx=R.x;trans.sz=R.z;}
  if(kind==='home'){trans.dur=4.2;}
}

function updateTrans(dt){
  if(!trans)return;

  if(trans.kind==='toRoom'){
    if(!trans.swapped){
      // slide over to the navy cloth and down
      const tx=-16.2,tz=clamp(trans.sz,-1,9);
      const q=ease(Math.min(1,p/0.42));

      shiftChain(0,0);R.vx=(nx-R.x)/Math.max(dt,1e-3);R.vz=(nz-R.z)/Math.max(dt,1e-3);R.x=nx;R.z=nz;
      cam.zt=lerp(1,0.6,ease(p/0.5));

      if(p>=0.5){
        trans.swapped=true;
        const ox=R.x,oz=R.z;buildRoom();R.x=-22;R.z=3;R.y=0;R.vx=0;R.vz=0;shiftChain(R.x-ox,R.z-oz);
        for(const L of R.chain)L.y=0;
        cam.zoom=ZONES.room.zoom*1.25;cam.zt=ZONES.room.zoom;const ct=camTarget(true);cam.x=R.x+6;cam.z=R.z-4;
        LOG('entered-room');
      }
    }else{
      fade=clamp(1-(p-0.5)/0.25,0,1);
      if(p>0.6&&R.jump===0&&!trans.hop){trans.hop=1;R.jumpV=6;SFX.land();R.expr='wow';R.exprT=1;}
      if(p>=1){endTrans();}
    }
  }
  else if(trans.kind==='toSky'){
    if(!trans.swapped){
      const wpx=14+(curtain.side==='L'?2.5:-2.5);
      const q=ease(Math.min(1,p/0.3));R.x=lerp(trans.sx,wpx,q);R.z=lerp(trans.sz,-19.2,q);R.jump=Math.sin(Math.min(1,p/0.3)*Math.PI)*1.5;
      cam.zt=lerp(ZONES.room.zoom,0.32,ease(p/0.5));
      fadeCol='#dfe6ee';fade=clamp((p-0.3)/0.18,0,1);
      if(p>=0.5){
        trans.swapped=true;buildSky();
        // everything gathered turns into the balloon's frame
        R.frame=R.chain.concat(R.body);R.frame.forEach((f,i)=>{f.state='frame';f.arr=0;f.fx=(f.x-R.x);f.fz=(f.z-R.z);});
        R.chain=[];R.body=[];R.hasSpool=false;R.ribbon=null;
        R.x=0;R.z=14;R.y=0;R.vx=0;R.vz=0;R.clouds=[];R.loopAcc=0;R.lastAng=null;R.trail=[];R.bal=0;R.balT=0;
        cam.zoom=0.4;cam.zt=ZONES.sky.zoom;cam.x=0;cam.z=8;
        LOG('entered-sky',{frame:R.frame.length});
      }
    }else{
      fade=clamp(1-(p-0.5)/0.25,0,1);
      if(p>=1)endTrans();
    }
  }
  else if(trans.kind==='home'){
    if(!trans.swapped){
      cam.y+=dt*6;fadeCol='#f3ead8';fade=clamp((p-0.15)/0.3,0,1);
      if(p>=0.45){
        trans.swapped=true;
        // the balloon becomes a little figurine for the next table
        const fig={g:R.frame.slice(0,24).map(f=>[/^#[0-9a-fA-F]{6}$/.test(f.col)?f.col:'#c9a032',Math.round(f.size*100)/100]),c:Math.min(20,R.clouds.length),s:curtain.side==='L'||curtain.side==='R'?curtain.side:'N',f:0};
        if(fig.g.length===0)fig.g.push(['#c9a032',0.6]);
        const gotFlag=rng()<0.18||!!window.__forceFlag;fig.f=gotFlag?1:0;
        figs.push(fig);if(figs.length>5)figs=figs.slice(-5);saveFigs();
        cycle++;LOG('cycle-complete',{cycle:cycle,ribs:fig.g.length,clouds:fig.c});
        cam.y=0;town={y:-1.2,lift:0,wrap:0};
        rng=mulberry((Math.random()*1e9)|0);
        const keepFlag=gotFlag;
        resetRobot();buildTable();
        R.x=cup.x;R.z=cup.z;R.y=0;R.jump=9;R.jumpV=0;R.hidden=false;R.inCup=1;
        trans.flag=keepFlag;
        cam.zoom=1.5;cam.zt=1;cam.x=-3;cam.z=-1;

    }else{
      fade=clamp(1-(p-0.45)/0.2,0,1);

      if(!trans.landed&&R.jump<=3.4&&R.jumpV<0){trans.landed=1;R.jump=3.4;R.jumpV=0;SFX.land();R.expr='joy';R.exprT=1.2;
        if(trans.flag){flag={x:cup.x+0.5,z:cup.z,t:0};SFX.flag();LOG('rare-flag');}}

function tiles(img,x0,x1,z0,z1,T,y,alpha){
  // ground texture tiles (mirrored to hide seams), clipped to region
  if(!img)return false;
  const X0=sx(x0),X1=sx(x1),Y0=sy(y,z0),Y1=sy(y,z1);
  const cx0=Math.max(X0,0),cx1=Math.min(X1,W),cy0=Math.max(Y0,0),cy1=Math.min(Y1,H);
  if(cx1<=cx0||cy1<=cy0)return true;
  ctx.save();ctx.beginPath();ctx.rect(cx0,cy0,cx1-cx0,cy1-cy0);ctx.clip();
  if(alpha!==undefined)ctx.globalAlpha=alpha;
  const tw=T*cam.S,th=T*cam.S*K;
  const i0=Math.floor((wxOf(cx0)-x0)/T),i1=Math.floor((wxOf(cx1)-x0)/T);
  const j0=Math.floor((wzOf(cy0,y)-z0)/T),j1=Math.floor((wzOf(cy1,y)-z0)/T);
  for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){
    const X=sx(x0+i*T),Y=sy(y,z0+j*T);
    const fx=(i&1)?-1:1,fy=(j&1)?-1:1;
    if(fx===1&&fy===1)ctx.drawImage(img,X,Y,tw+0.6,th+0.6);
    else{ctx.save();ctx.translate(X+(fx<0?tw:0),Y+(fy<0?th:0));ctx.scale(fx,fy);ctx.drawImage(img,0,0,tw+0.6,th+0.6);ctx.restore();}
  }
  ctx.restore();
  return true;
}

function drawTown(){

}

    ctx.strokeStyle='#8a6a20';ctx.lineWidth=Math.max(1.5,cam.S*0.08);ctx.beginPath();ctx.moveTo(X,Y+cam.S*1.5);ctx.lineTo(X,Y);ctx.stroke();
    ctx.fillStyle='#c8352e';ctx.beginPath();ctx.moveTo(X,Y);ctx.quadraticCurveTo(X+cam.S*0.6,Y+cam.S*0.1+Math.sin(clock*6)*2,X+cam.S*1.1,Y+cam.S*0.25);ctx.lineTo(X,Y+cam.S*0.6);ctx.fill();}
}
function drawBowlContents(st){

/* ---------- robot drawing ---------- */
function drawRobot(){
  if(R.hidden)return;
  const u=cam.S,r=R.rv;
  const gx=sx(R.x),gy=sy(R.y,R.z);
  const lift=R.jump+(zone.name==='sky'?0.6+Math.sin(clock*2)*0.25:0);
  if(R.bal>0.02){drawBalloon(gx,gy,lift);if(R.bal>0.6)return;}
  ctx.save();
  if(R.bal>0.02)ctx.globalAlpha=1-R.bal/0.6;
  const sink=R.press;
  // wheels in world space (show heading)
  const pxp=-Math.sin(R.head),pzp=Math.cos(R.head);
  const wheels=[-1,1].map(sd=>({x:R.x+pxp*sd*r*0.78,z:R.z+pzp*sd*r*0.78*0.9}));
  wheels.sort((a,b)=>a.z-b.z);
  const drawWheel=w=>{const X=sx(w.x),Y=sy(R.y,w.z)-lift*u*U-r*0.3*u+sink*r*0.08*u;const wr=r*0.34*u;
    ctx.fillStyle='#2a2522';ell(ctx,X,Y,wr,wr*0.95);ctx.fill();
    ctx.fillStyle=RG(ctx,X-wr*0.3,Y-wr*0.3,0,X,Y,wr*0.7,[[0,'#f6dc8a'],[1,'#8a6a20']]);ell(ctx,X,Y,wr*0.62,wr*0.6);ctx.fill();
    ctx.strokeStyle='rgba(60,40,10,0.7)';ctx.lineWidth=Math.max(1,wr*0.1);
    for(let i=0;i<4;i++){const a=R.wheel+i*Math.PI/4;ctx.beginPath();ctx.moveTo(X+Math.cos(a)*wr*0.55,Y+Math.sin(a)*wr*0.55);ctx.lineTo(X-Math.cos(a)*wr*0.55,Y-Math.sin(a)*wr*0.55);ctx.stroke();}};
  drawWheel(wheels[0]);
  ctx.translate(gx,gy-lift*u*U);ctx.scale(u,u);ctx.rotate(R.lean+(R.strain>0.3?-0.08*R.strain*Math.sign(Math.cos(R.head)||1):0));
  const bulge=clamp(R.chest,-0.6,0.9);
  const brx=r*(0.98+bulge*0.07+R.crumbs*0.004),bry=r*0.8*(1-sink*0.16+bulge*0.05);
  const bcy=-(r*0.25+bry)+sink*r*0.12;
  // body: silver tin with brass band
  ctx.fillStyle=RG(ctx,-brx*0.4,bcy-bry*0.5,brx*0.05,0,bcy,brx*1.05,[[0,'#ffffff'],[0.25,'#d7dde0'],[0.75,'#8f989d'],[1,'#5f676c']]);
  ell(ctx,0,bcy,brx,bry);ctx.fill();
  ctx.fillStyle='rgba(255,190,120,0.18)';ell(ctx,brx*0.15,bcy+bry*0.55,brx*0.8,bry*0.35);ctx.fill();
  ctx.strokeStyle='#b08a2a';ctx.lineWidth=r*0.09;ctx.beginPath();ctx.ellipse(0,bcy+bry*0.3,brx*0.99,bry*0.32,0,0.05,Math.PI-0.05);ctx.stroke();
  ctx.strokeStyle='rgba(60,65,70,0.5)';ctx.lineWidth=r*0.025;ctx.beginPath();ctx.ellipse(0,bcy-bry*0.25,brx*0.97,bry*0.3,0,0.1,Math.PI-0.1);ctx.stroke();
  // scratches
  ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=r*0.015;ctx.beginPath();ctx.moveTo(-brx*0.5,bcy+bry*0.1);ctx.lineTo(-brx*0.3,bcy+bry*0.05);ctx.moveTo(brx*0.4,bcy-bry*0.2);ctx.lineTo(brx*0.55,bcy-bry*0.1);ctx.stroke();
  // chest plate (bulges as it eats)
  const fx=R.fx,fz=R.fy;
  const chr=r*(0.32+Math.min(0.16,R.crumbs*0.012))*(1+bulge*0.25);
  const chx=fx*r*0.22,chy=bcy+bry*0.05+fz*r*0.04;
  ctx.fillStyle=RG(ctx,chx-chr*0.4,chy-chr*0.4,0,chx,chy,chr,[[0,'#fbe7a0'],[0.6,'#c9a032'],[1,'#7a5a14']]);ell(ctx,chx,chy,chr,chr*0.92);ctx.fill();
  ctx.fillStyle='rgba(40,25,10,0.55)';ell(ctx,chx,chy,chr*0.62,chr*0.56);ctx.fill();
  // crumbs visible in the chest window
  const cn=Math.min(9,R.crumbs);for(let i=0;i<cn;i++){const a=i*2.4,d=chr*0.18*Math.sqrt(i+1)*0.9;ctx.fillStyle=i%2?'#d9a25a':'#b97a3a';ell(ctx,chx+Math.cos(a)*d,chy+chr*0.25-Math.abs(Math.sin(a))*d*0.6,chr*0.13,chr*0.1);ctx.fill();}
  ctx.fillStyle='rgba(255,255,255,0.35)';ell(ctx,chx-chr*0.25,chy-chr*0.25,chr*0.2,chr*0.12);ctx.fill();
  ctx.fillStyle='#7a5a14';for(let i=0;i<6;i++){const a=i/6*TAU;ell(ctx,chx+Math.cos(a)*chr*0.8,chy+Math.sin(a)*chr*0.75,r*0.025,r*0.025);ctx.fill();}
  // head
  const hy=bcy-bry-r*0.38+sink*r*0.08;
  ctx.save();ctx.translate(0,hy);ctx.rotate(R.tilt*0.32+Math.sin(clock*1.6)*0.02);
  const hr=r*0.6;
  // antenna
  const ax=R.ant*r*0.5;ctx.strokeStyle='#6b7378';ctx.lineWidth=r*0.05;ctx.beginPath();ctx.moveTo(0,-hr*0.9);ctx.quadraticCurveTo(ax*0.3,-hr*1.3,ax,-hr*1.65);ctx.stroke();
  pSphereAtCtx(ax,-hr*1.7,r*0.1,'#c8352e');
  ctx.fillStyle=RG(ctx,-hr*0.4,-hr*0.45,hr*0.05,0,0,hr*1.05,[[0,'#ffffff'],[0.3,'#d7dde0'],[0.8,'#8f989d'],[1,'#5f676c']]);ell(ctx,0,0,hr,hr*0.92);ctx.fill();
  // porthole face (always visible)
  const fpx=fx*hr*0.22,fpy=fz*hr*0.16+hr*0.05;
  const pr=hr*0.7;
  ctx.fillStyle=RG(ctx,fpx-pr*0.4,fpy-pr*0.4,0,fpx,fpy,pr,[[0,'#fbe7a0'],[0.7,'#c9a032'],[1,'#6a4a10']]);ell(ctx,fpx,fpy,pr,pr);ctx.fill();
  const gr=pr*0.8;
  ctx.fillStyle=RG(ctx,fpx,fpy-gr*0.3,0,fpx,fpy,gr,[[0,'#fff8e6'],[1,'#e9d9b4']]);ell(ctx,fpx,fpy,gr,gr);ctx.fill();
  // eyes
  const ex=fx*gr*0.18,ey=fz*gr*0.14;
  const e=R.expr;
  const open=R.blink>0?0.12:(e==='strain'?0.35:e==='joy'?0.25:1);
  const er=gr*(e==='eager'||e==='wow'?0.2:0.16);
  ctx.fillStyle='#24170e';
  for(const sd of [-1,1]){const X=fpx+sd*gr*0.36+ex,Y=fpy-gr*0.12+ey;
    if(e==='joy'){ctx.strokeStyle='#24170e';ctx.lineWidth=gr*0.08;ctx.beginPath();ctx.arc(X,Y+er*0.4,er,Math.PI*1.15,Math.PI*1.85);ctx.stroke();}
    else{ell(ctx,X,Y,er*0.85,er*open);ctx.fill();if(open>0.5){ctx.fillStyle='#ffffff';ell(ctx,X-er*0.3,Y-er*0.35,er*0.28,er*0.28);ctx.fill();ctx.fillStyle='#24170e';}}}
  // cheeks
  ctx.fillStyle='rgba(220,110,90,0.28)';ell(ctx,fpx-gr*0.6,fpy+gr*0.2,gr*0.16,gr*0.1);ctx.fill();ell(ctx,fpx+gr*0.6,fpy+gr*0.2,gr*0.16,gr*0.1);ctx.fill();
  // mouth
  ctx.strokeStyle='#24170e';ctx.lineWidth=gr*0.07;ctx.lineCap='round';ctx.fillStyle='#7a2a22';
  const my=fpy+gr*0.32+ey,mx=fpx+ex;
  if(e==='happy'||e==='joy'){ctx.beginPath();ctx.arc(mx,my-gr*0.05,gr*0.2,0.1,Math.PI-0.1);ctx.closePath();ctx.fill();}
  else if(e==='eager'||e==='wow'){ell(ctx,mx,my,gr*0.12,gr*(e==='wow'?0.15:0.1));ctx.fill();}
  else if(e==='puzzled'||e==='curious'){ctx.beginPath();ctx.moveTo(mx-gr*0.14,my);ctx.quadraticCurveTo(mx,my-gr*0.08,mx+gr*0.14,my+gr*0.04);ctx.stroke();}
  else if(e==='strain'){ctx.beginPath();ctx.moveTo(mx-gr*0.16,my);ctx.lineTo(mx+gr*0.16,my);ctx.stroke();}
  else{ctx.beginPath();ctx.arc(mx,my-gr*0.1,gr*0.15,0.35,Math.PI-0.35);ctx.stroke();}
  // glass glint
  ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=gr*0.06;ctx.beginPath();ctx.arc(fpx,fpy,gr*0.86,Math.PI*1.1,Math.PI*1.45);ctx.stroke();
  // rivets on the ring
  ctx.fillStyle='#6a4a10';for(let i=0;i<8;i++){const a=i/8*TAU;ell(ctx,fpx+Math.cos(a)*pr*0.9,fpy+Math.sin(a)*pr*0.9,r*0.02,r*0.02);ctx.fill();}
  ctx.restore();
  ctx.restore();
  drawWheel(wheels[1]);
  ctx.globalAlpha=1;
}
function pSphereAtCtx(x,y,r,c){ctx.fillStyle=RG(ctx,x-r*0.35,y-r*0.35,0,x,y,r,[[0,shade(c,1.6)],[0.4,c],[1,shade(c,0.45)]]);ell(ctx,x,y,r,r);ctx.fill();}

function balloonShape(){
  const ribs=R.frame.length?R.frame:[{col:'#c9a032',size:0.6}];
  const n=Math.max(6,ribs.length);const cl=R.clouds.length;
  const pts=[];
  for(let i=0;i<n;i++){const e=ribs[i%ribs.length];const a=-Math.PI/2+i/n*TAU;const rad=(0.7+e.size*0.5)*(1+Math.min(0.4,cl*0.04));pts.push([Math.cos(a)*rad,Math.sin(a)*rad*1.05,e.col]);}
  return pts;
}
function drawBalloon(gx,gy,lift){
  const u=cam.S,b=ease(R.bal),r=R.rv;
  const size=r*(1+b*1.5);
  const cyW=-(r*1.2+b*r*2.6);
  ctx.save();ctx.translate(gx,gy-lift*u*U);ctx.scale(u,u);
  ctx.globalAlpha=Math.min(1,R.bal/0.4);
  const pts=balloonShape();const n=pts.length;
  // gores coloured by gathered things, in the order they were gathered
  for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];ctx.fillStyle=p[2];ctx.beginPath();ctx.moveTo(0,cyW);ctx.lineTo(p[0]*size,cyW+p[1]*size);
    ctx.quadraticCurveTo((p[0]+q[0])*0.62*size,cyW+(p[1]+q[1])*0.62*size,q[0]*size,cyW+q[1]*size);ctx.closePath();ctx.fill();}
  ctx.fillStyle=RG(ctx,-size*0.4,cyW-size*0.5,0,0,cyW,size*1.3,[[0,'rgba(255,255,255,0.55)'],[0.55,'rgba(255,255,255,0)'],[1,'rgba(0,0,0,0.35)']]);ell(ctx,0,cyW,size*1.2,size*1.25);ctx.fill();
  // seams = the thread, joints = the things gathered (in gathering order)
  ctx.strokeStyle='rgba(70,40,15,0.55)';ctx.lineWidth=0.05;
  for(let i=0;i<n;i++){const p=pts[i];ctx.beginPath();ctx.moveTo(0,cyW-size*0.05);ctx.lineTo(p[0]*size,cyW+p[1]*size);ctx.stroke();}
  ctx.beginPath();for(let i=0;i<=n;i++){const p=pts[i%n],q=pts[(i+n-1)%n];if(i===0)ctx.moveTo(p[0]*size,cyW+p[1]*size);else ctx.quadraticCurveTo((p[0]+q[0])*0.62*size,cyW+(p[1]+q[1])*0.62*size,p[0]*size,cyW+p[1]*size);}ctx.stroke();
  ctx.restore();
  for(let i=0;i<R.frame.length&&i<n;i++){const f=R.frame[i],p=pts[i];const spr=itemSpr(f);const S2=u*0.55;
    const X=gx+p[0]*size*u,Y=gy-lift*u*U+(cyW+p[1]*size)*u;ctx.globalAlpha=Math.min(1,R.bal/0.5);
    ctx.drawImage(spr.c,X-spr.ax*S2,Y-spr.ay*S2*0.7,spr.wu*S2,spr.hu*S2);}
  ctx.globalAlpha=Math.min(1,R.bal/0.4);
  ctx.save();ctx.translate(gx,gy-lift*u*U);ctx.scale(u,u);
  // cloud puffs along the lower rim
  R.clouds.forEach((c,i)=>{const a=Math.PI*0.15+i/Math.max(1,R.clouds.length)*Math.PI*0.7;const X=Math.cos(a)*size*1.05,Y=cyW+Math.sin(a)*size*1.0;ctx.fillStyle='rgba(255,255,255,0.92)';ell(ctx,X,Y,size*0.28,size*0.2);ctx.fill();});
  // ropes + basket
  ctx.strokeStyle='rgba(70,45,15,0.7)';ctx.lineWidth=0.06;ctx.beginPath();ctx.moveTo(-size*0.5,cyW+size*0.95);ctx.lineTo(-r*0.4,-r*0.6);ctx.moveTo(size*0.5,cyW+size*0.95);ctx.lineTo(r*0.4,-r*0.6);ctx.stroke();
  ctx.fillStyle=LG(ctx,-r*0.5,0,r*0.5,0,[[0,'#5a3a1a'],[0.4,'#b98a55'],[1,'#5a3a1a']]);rrect(ctx,-r*0.5,-r*0.65,r,r*0.55,r*0.1);ctx.fill();
  ctx.strokeStyle='rgba(40,25,10,0.5)';ctx.lineWidth=0.03;for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(-r*0.5+i*r*0.25,-r*0.65);ctx.lineTo(-r*0.5+i*r*0.25,-r*0.1);ctx.stroke();}
  // face porthole stays on the balloon
  const pr=r*0.55*(1+b*0.3),fx=R.fx*pr*0.15,fy=cyW+size*0.1;
  ctx.fillStyle=RG(ctx,fx-pr*0.4,fy-pr*0.4,0,fx,fy,pr,[[0,'#fbe7a0'],[0.7,'#c9a032'],[1,'#6a4a10']]);ell(ctx,fx,fy,pr,pr);ctx.fill();
  ctx.fillStyle='#fff6e0';ell(ctx,fx,fy,pr*0.8,pr*0.8);ctx.fill();
  ctx.fillStyle='#24170e';const e=R.expr;
  for(const sd of [-1,1]){if(e==='joy'||R.happy>0.3){ctx.strokeStyle='#24170e';ctx.lineWidth=pr*0.08;ctx.beginPath();ctx.arc(fx+sd*pr*0.3,fy-pr*0.05,pr*0.13,Math.PI*1.15,Math.PI*1.85);ctx.stroke();}else{ell(ctx,fx+sd*pr*0.3,fy-pr*0.1,pr*0.11,R.blink>0?pr*0.02:pr*0.14);ctx.fill();}}
  ctx.strokeStyle='#24170e';ctx.lineWidth=pr*0.07;ctx.beginPath();ctx.arc(fx,fy+pr*0.15,pr*0.18,0.3,Math.PI-0.3);ctx.stroke();
  ctx.restore();
  // net around the town while lifting
  if(town.wrap>0&&town.sx!==undefined){
    ctx.strokeStyle='rgba(200,160,80,'+(0.8*town.wrap)+')';ctx.lineWidth=Math.max(1,u*0.08);
    const bx=gx,by=gy-lift*u*U+(cyW+size)*u;
    for(let i=0;i<7;i++){const q=i/6;const tx=town.sx-town.w*0.42+q*town.w*0.84;ctx.beginPath();ctx.moveTo(bx+(q-0.5)*size*u*0.8,by);ctx.lineTo(lerp(bx,tx,town.wrap),lerp(by,town.sy-town.h*0.1,town.wrap));ctx.stroke();}
  }
}

function drawFrameItems(){
  // in the sky: gathered things become the ribs of a frame around the robot
  const n=R.frame.length;if(!n)return;
  const rad=R.rv*1.9;
  const lift=R.jump+0.6+Math.sin(clock*2)*0.25;
  R.frame.forEach((f,i)=>{
    const a=i/n*TAU+clock*0.15*(R.bal>0.5?0:1);
    const tx=R.x+Math.cos(a)*rad,tz=R.z+Math.sin(a)*rad*0.8,ty=R.y+lift+R.rv*0.8+Math.sin(a*2+clock)*0.15;
    const q=ease(f.arr);
    f.x=lerp(R.x+f.fx,tx,q);f.z=lerp(R.z+f.fz,tz,q);f.y=lerp(0,ty,q);
  });
}

/* ---------- main draw ---------- */
let invitePulse=0;
function drawScene(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(zone.name==='table')drawTableGround();
  else if(zone.name==='room')drawRoomBack();
  else drawSkyBack();
  // invitation glow on the ground (one target only)
  if(invite&&phase==='play'&&invite.obj!=='town'){
    const pr=0.5+0.5*Math.sin(clock*4.2);const X=sx(invite.x),Y=sy(invite.y,invite.z),rr2=(invite.r+0.9+pr*0.35)*cam.S;
    ctx.fillStyle=RG(ctx,X,Y,0,X,Y,rr2,[[0,'rgba(255,236,170,'+(0.42+0.2*pr)+')'],[0.6,'rgba(255,220,140,0.16)'],[1,'rgba(255,220,140,0)']]);
    ell(ctx,X,Y,rr2,rr2*K);ctx.fill();
  }
  // shadows
  if(zone.name!=='sky'){
    for(const st of statics){if(st.invisible||(st.kind==='book'&&book&&book.open))continue;if(st.kind==='leg')continue;
      if(st.shape==='c')shadow(st.x,st.y0,st.z,st.r*1.05,0.9);else{const w=(st.x1-st.x0)/2;shadow((st.x0+st.x1)/2,st.y0,(st.z0+st.z1)/2,w*1.0,0.7);}}
    for(const it of items){if(it.state==='loose'||it.state==='chain')shadow(it.x,it.y,it.z,it.size*(it.t==='furn'?1.0:0.9),0.85);}
    if(!R.hidden){const sh=1/(1+R.jump*0.15);shadow(R.x,R.y,R.z,R.rv*1.05*sh,0.95*sh);}
  }else if(!R.hidden){shadow(R.x,R.y-1.2,R.z,R.rv*(1+R.bal),0.25);}
  // thread line
  if(R.chain.length){
    ctx.strokeStyle=R.chain[0].col;ctx.lineWidth=Math.max(1.2,cam.S*0.07);ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();const bx=R.x-Math.cos(R.head)*R.rv*0.8,bz=R.z-Math.sin(R.head)*R.rv*0.8;ctx.moveTo(sx(bx),sy(R.y+R.jump+R.rv*0.5,bz));
    for(const L of R.chain){const hop=Math.sin(Math.PI*L.arr)*(L.arr<1?1.2:0);ctx.lineTo(sx(L.x),sy(L.y+L.size*0.7+hop,L.z));}ctx.stroke();
  }
  // depth-sorted objects
  const list=[];
  for(const st of statics)list.push({z:staticDepth(st),y:st.y0,f:()=>drawStatic(st)});
  for(const it of items){
    if(it.state==='loose'){list.push({z:it.z,y:it.y,f:()=>{
        const inv=invite&&invite.obj===it;const bob=inv?Math.abs(Math.sin(clock*4.2))*0.35:0;
        const rot=it.wob>0.02?Math.sin(clock*30)*it.wob*0.12:0;
        drawSpr(itemSpr(it),it.x,it.y+bob,it.z,1,rot);}});}
    else if(it.state==='chain'){list.push({z:it.z,y:it.y,f:()=>{const hop=Math.sin(Math.PI*it.arr)*(it.arr<1?1.2:0);drawSpr(itemSpr(it),it.x,it.y+hop,it.z,1);}});}
    else if(it.state==='body'){const p=bodyPos(it);const q=ease(it.arr);it.arr=Math.min(1,it.arr+0.05);
      const x=lerp(it.fx,p[0],q),y=lerp(it.fy,p[1],q)+Math.sin(Math.PI*q)*1.2,z=lerp(it.fz,p[2],q);
      list.push({z:z-0.01,y:y,f:()=>drawSpr(itemSpr(it),x,y-it.size*0.3,z,0.85)});}
    else if(it.state==='frame'){if(R.bal<0.6)list.push({z:it.z,y:it.y,f:()=>drawSpr(itemSpr(it),it.x,it.y,it.z,0.8,0,1-R.bal)});}
  }
  for(const it of flights){
    const q=ease(it.ft);let tx,ty,tz;
    if(it.state==='toChest'){tx=R.x+R.fx*R.rv*0.3;ty=R.y+R.jump+R.rv*0.9;tz=R.z+0.4;}
    else{tx=bowl.x;ty=bowl.h*0.8;tz=bowl.z;}
    const x=lerp(it.fx,tx,q),y=lerp(it.fy,ty,q)+Math.sin(Math.PI*q)*(it.state==='toBowl'?3:1.5),z=lerp(it.fz,tz,q);
    const sc=it.state==='toChest'?1-q*0.6:1-q*0.25;
    list.push({z:z+0.5,y:y,f:()=>drawSpr(itemSpr(it),x,y,z,sc)});
  }
  if(zone.name==='sky'){
    for(const c of R.clouds){if(R.bal>0.6)continue;const n=R.clouds.length;const i=R.clouds.indexOf(c);const a=i/Math.max(1,n)*TAU+0.4;const lift=R.jump+0.6;
      const tx=R.x+Math.cos(a)*R.rv*1.3,tz=R.z+Math.sin(a)*R.rv*0.9,ty=R.y+lift+R.rv*1.6;const q=ease(c.arr);
      c.x=lerp(c.x,tx,q*0.3+0.05);c.z=lerp(c.z,tz,q*0.3+0.05);c.y=lerp(c.y,ty,q*0.3+0.05);
      list.push({z:c.z,y:c.y,f:()=>drawSpr(itemSpr(c),c.x,c.y,c.z,0.7,0,1-R.bal/0.6)});}
  }
  list.push({z:R.z,y:R.y,f:drawRobot});
  list.sort((a,b)=>a.z-b.z||a.y-b.y);
  for(const o of list)o.f();
  // particles
  for(const p of parts){const a=1-p.t/p.life;const X=sx(p.x),Y=sy(p.y,p.z),s=p.s*cam.S;
    ctx.globalAlpha=Math.max(0,a);ctx.fillStyle=p.col;
    if(p.k==='star'){ctx.beginPath();ctx.moveTo(X,Y-s*1.6);ctx.lineTo(X+s*0.4,Y-s*0.4);ctx.lineTo(X+s*1.6,Y);ctx.lineTo(X+s*0.4,Y+s*0.4);ctx.lineTo(X,Y+s*1.6);ctx.lineTo(X-s*0.4,Y+s*0.4);ctx.lineTo(X-s*1.6,Y);ctx.lineTo(X-s*0.4,Y-s*0.4);ctx.closePath();ctx.fill();}
    else{ell(ctx,X,Y,s,s);ctx.fill();}}
  ctx.globalAlpha=1;
}
function postFX(){
  ctx.setTransform(1,0,0,1,0,0);
  if(tsOn&&small1&&small2){
    // tilt-shift: soft focus on far and near bands (miniature close-up)
    const s1=small1.getContext('2d'),s2=small2.getContext('2d');
    s1.drawImage(cv,0,0,small1.width,small1.height);
    s2.drawImage(small1,0,0,small2.width,small2.height);
    const CH=cv.height,CW=cv.width;
    const bands=6,top=CH*0.17,bot=CH*0.15;
    for(let i=0;i<bands;i++){
      const a=(1-i/bands)*0.95;ctx.globalAlpha=a;
      const y0=top*i/bands,h=top/bands+1;
      ctx.drawImage(small2,0,y0/CH*small2.height,small2.width,h/CH*small2.height,0,y0,CW,h);
      const y1=CH-bot*(i+1)/bands;
      ctx.drawImage(small2,0,y1/CH*small2.height,small2.width,(bot/bands+1)/CH*small2.height,0,y1,CW,bot/bands+1);
    }
    ctx.globalAlpha=1;
  }
  if(vign)ctx.drawImage(vign,0,0,cv.width,cv.height);
  if(fade>0){ctx.globalAlpha=fade;ctx.fillStyle=fadeCol;ctx.fillRect(0,0,cv.width,cv.height);ctx.globalAlpha=1;}
  // finger demo (shown once)
  if(demo.t>=0){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const t=demo.t,tgt=items.find(it=>it.t==='crumb'&&it.state==='loose');
    const rs=robotScreen();const tx=tgt?sx(tgt.x):rs[0]+80,ty=tgt?sy(tgt.y+0.3,tgt.z):rs[1];
    const q=ease(clamp((t-0.5)/1.1,0,1));
    const x=lerp(rs[0],tx,q),y=lerp(rs[1],ty,q);
    const a=t<0.3?t/0.3:t>1.9?Math.max(0,(2.3-t)/0.4):1;
    const press=t>0.3&&t<1.7?1:0;
    drawHand(x,y,a,press);
  }
}
function drawHand(x,y,a,press){
  const s=Math.max(26,Math.min(W,H)*0.07);
  ctx.save();ctx.globalAlpha=a*0.85;ctx.translate(x+s*0.15,y+s*0.1);
  if(press){ctx.fillStyle='rgba(255,240,200,0.5)';ell(ctx,-s*0.15,-s*0.1,s*0.35,s*0.25);ctx.fill();}
  ctx.rotate(-0.35);const sc=press?0.92:1;ctx.scale(sc,sc);
  ctx.fillStyle='#f3d9bf';ctx.strokeStyle='rgba(90,50,30,0.6)';ctx.lineWidth=2;
  rrect(ctx,-s*0.16,-s*0.1,s*0.32,s*0.9,s*0.16);ctx.fill();ctx.stroke();
  rrect(ctx,-s*0.4,s*0.45,s*0.8,s*0.75,s*0.3);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.5)';ell(ctx,0,-s*0.02,s*0.08,s*0.05);ctx.fill();
  ctx.restore();ctx.globalAlpha=1;
}

/* ================= main loop ================= */
let lastT=0,running=true,rafId=0,frameAvg=16,slowFrames=0;
function update(dt){
  clock+=dt;
  if(phase==='play'||phase==='lift'){
    moveRobot(dt);updateItems(dt);updateChain(dt);updateFlights(dt);
    if(zone.name==='room')updateRoomBits(dt);
    if(zone.name==='sky'){drawFrameItemsUpdate();updateSky(dt);}
    checkTableClean();
  }else if(phase==='trans'){
    updateTrans(dt);
    if(zone.name!=='sky'){updateChain(dt);}else drawFrameItemsUpdate();
    updateFlights(dt);
    if(zone.name==='sky')updateSky(dt);
  }
  updateRobotAnim(dt);
  // particles
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>=p.life){parts.splice(i,1);continue;}p.vy-=9*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;if(p.y<0&&zone.name!=='sky'){p.y=0;p.vy*=-0.3;p.vx*=0.6;p.vz*=0.6;}}
  invT-=dt;if(invT<=0){computeInvite();invT=0.25;}
  if(invite&&invite.obj&&invite.obj.x!==undefined&&invite.obj.state==='loose'){invite.x=invite.obj.x;invite.z=invite.obj.z;invite.y=invite.obj.y;}
  // finger demo once after ~4s without touching
  if(!demo.shown&&!everTouched&&phase==='play'&&clock-Math.max(lastInput,0)>4){demo.shown=true;demo.t=0;LOG('hand-demo');}
  if(demo.t>=0){demo.t+=dt;if(demo.t>2.4)demo.t=-1;}
  // camera
  cam.zoom+=(cam.zt-cam.zoom)*Math.min(1,dt*(phase==='trans'?2.5:3));
  if(phase==='play')cam.zt=zone.zoom;
  cam.S=baseS*cam.zoom;
  if(phase!=='trans'||trans.swapped){const t=camTarget();const k=Math.min(1,dt*(phase==='trans'?2:4));cam.x+=(t[0]-cam.x)*k;cam.z+=(t[1]-cam.z)*k;}
  if(phase==='lift'){cam.y+=(ease(town.lift)*4-cam.y)*Math.min(1,dt*2);}
}
function drawFrameItemsUpdate(){drawFrameItems();}
function frame(ts){
  rafId=0;
  if(!running)return;
  const t=ts/1000;let dt=lastT?t-lastT:1/60;lastT=t;
  if(dt>0.1)dt=1/60; // after stalls never jump
  dt=Math.min(dt,1/30);
  const n=dt>1/50?2:1;for(let i=0;i<n;i++)update(dt/n);
  try{drawScene();postFX();}catch(e){ctx.setTransform(1,0,0,1,0,0);}
  // adaptive: drop the blur bands on slow devices
  frameAvg=frameAvg*0.95+dt*1000*0.05;if(frameAvg>24){slowFrames++;if(slowFrames>90&&tsOn){tsOn=false;LOG('tiltshift-off');}}else slowFrames=0;
  rafId=requestAnimationFrame(frame);
}
function resize(){
  W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  K=clamp(0.66+(H/W-1.2)*0.16,0.62,0.82);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  try{const s=getComputedStyle(document.getElementById('sa'));SA={t:parseFloat(s.paddingTop)||0,r:parseFloat(s.paddingRight)||0,b:parseFloat(s.paddingBottom)||0,l:parseFloat(s.paddingLeft)||0};}catch(e){}
  baseS=Math.min((W-SA.l-SA.r)/21,(H-SA.t-SA.b)/(26*K),Math.sqrt(W*H)/24);
  cam.S=baseS*cam.zoom;
  rebuildCaches();townCv=null;
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,120));
if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){running=false;release();if(rafId){cancelAnimationFrame(rafId);rafId=0;}if(AC&&AC.state==='running'){try{AC.suspend();}catch(e){}}}
  else{running=true;lastT=0;if(AC&&audioWanted){try{AC.resume();}catch(e){}}if(!rafId)rafId=requestAnimationFrame(frame);}
});
window.addEventListener('pagehide',()=>{running=false;});
window.addEventListener('pageshow',()=>{if(!running){running=true;lastT=0;if(!rafId)rafId=requestAnimationFrame(frame);}});

/* ================= boot ================= */
figs=loadFigs();
resize();
buildTable();
cam.zoom=cam.zt=1;cam.S=baseS;cam.x=-1;cam.z=-1.5;
{const t=camTarget();cam.x=t[0];cam.z=t[1];}
computeInvite();
rafId=requestAnimationFrame(frame);

// read-only hooks for automated checks
window.__tr={R:R,get items(){return items;},get statics(){return statics;},get zone(){return zone.name;},get phase(){return phase;},
  get invite(){return invite;},get D(){return D;},get curtain(){return curtain;},get book(){return book;},get bowl(){return bowl;},get figs(){return figs;},
  get cycle(){return cycle;},
  _jump(zn,nb){ // test-only shortcut to a later scene with a typical load
    if(zn==='room'||zn==='sky'){resetRobot();R.crumbs=10;R.hasSpool=true;
      const sp=mkItem('spool',0,0,{col:'#c8352e'});sp.state='chain';R.chain.push(sp);
      for(let i=0;i<(nb===undefined?4:nb);i++){const b=mkItem('block',0,0,{col:PAL.block[i],v:i});b.state='chain';R.chain.push(b);}
      const bd=mkItem('bead',0,0,{col:'#2d4fa3'});bd.state='body';bd.slot=0;R.body.push(bd);recalcR();
      const keep=R.chain.concat(R.body);buildRoom();R.x=-10;R.z=0;for(const L of R.chain){L.lx=L.x=-10;L.lz=L.z=2;}
      if(zn==='sky'){book.open=true;curtain.side='R';phase='play';startTrans('toSky');trans.t=trans.dur*0.5;}
    }
  },logs:LOGS,cam:cam,scr(x,y,z){return [sx(x),sy(y,z)];},robotScreen:robotScreen,halfW:halfW,blocks:blocksCarried,get demo(){return demo;},get inputOn(){return inp.on;},get inputId(){return inp.id;},get clock(){return clock;},get tsOn(){return tsOn;},get audio(){return AC?AC.state:'none';}};
})();
</script>
