<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<title>するるん！ミミズ兄弟とぽこぽこ土の音楽畑</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#3a2214;
  touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none;outline:none}
#sa{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);
  padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left)}
</style>

<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
'use strict';
(function(){
// ====================================================================
//  するるん！ミミズ兄弟とぽこぽこ土の音楽畑
//  単一ファイル・外部通信なし・Web Audio 合成
// ====================================================================
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
const hyp=Math.hypot;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(n){n=(n^61)^(n>>>16);n=Math.imul(n,9);n^=n>>>4;n=Math.imul(n,0x27d4eb2d);n^=n>>>15;return (n>>>0)/4294967296;}
let Q;try{Q=new URLSearchParams(location.search);}catch(e){Q={get:()=>null};}

const STEP=0.15;                // 内部の拍（16分・100BPM）
const SCALE=[0,2,4,7,9];
const T_AIR=0,T_DRY=1,T_WET=2,T_HARD=3,T_HOLE=4,T_LOW=5;
const TURN_PX=50;               // 一巻きほどくのに必要な引き量(px)
const MAXP=220;                 // パーティクル上限
const SKEY='srrn-worm-field-v1';
const BRO=[
  {len:13,  th:1.45, spd:4.0, dig:0.80, base:[146,58,44], lite:[192,102,80], dark:[86,30,22], voice:0},
  {len:10.5,th:1.30, spd:5.0, dig:1.00, base:[172,90,54], lite:[214,138,96], dark:[104,48,26], voice:1},
  {len:8,   th:1.15, spd:6.3, dig:1.30, base:[184,80,86], lite:[228,134,140],dark:[116,40,46], voice:2},
];

// ---------------- canvas
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const base=document.createElement('canvas'), bctx=base.getContext('2d');
const comp=document.createElement('canvas'), cctx=comp.getContext('2d');
let W=1,H=1,DPR=1;
const SA={t:0,r:0,b:0,l:0};
const L={cs:12,ox:0,oy:100};
const X=x=>L.ox+x*L.cs, Y=y=>L.oy+y*L.cs;
const WX=px=>(px-L.ox)/L.cs, WY=py=>(py-L.oy)/L.cs;

const G={time:0,last:0,raf:0,running:false,lastInput:0,handShown:false,hand:null,focus:null,
  ev:[],parts:[],fly:[],memOnly:false,saveAt:0,needLayout:true,firstTap:null,nb:0,
  flash:0,ring:null,wave:null,sway:null,log:[],taps:0,lowDim:null,smoothFill:0};
let S=null;
let dug=null, buckets=null, uf=null;
let P=null;

function logEv(k,extra){G.log.push({t:+G.time.toFixed(2),k,...(extra||{})});if(G.log.length>400)G.log.shift();}

// ====================================================================
//  音
// ====================================================================
const A={ctx:null,out:null,wet:null,noise:null,creak:null,ok:false};
function audioInit(){
  try{
    if(A.ctx){ if(A.ctx.state!=='running') A.ctx.resume().catch(()=>{}); return; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const c=new AC(); A.ctx=c;
    const comp=c.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4; comp.connect(c.destination);
    A.out=c.createGain(); A.out.gain.value=0.75; A.out.connect(comp);
    const dl=c.createDelay(1); dl.delayTime.value=0.23; const fb=c.createGain(); fb.gain.value=0.3;
    const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2400;
    A.wet=c.createGain(); A.wet.gain.value=0.5; A.wet.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(A.out);
    const len=Math.floor(c.sampleRate*1.2), buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    A.noise=buf;
    const s=c.createBufferSource(); s.buffer=c.createBuffer(1,1,c.sampleRate); s.connect(c.destination); s.start(0);
    c.resume().catch(()=>{});
    A.ok=true;
  }catch(e){A.ctx=null;A.ok=false;}
}
const live=()=>A.ctx&&A.ctx.state==='running';
function aT(at){return A.ctx.currentTime+Math.max(0,(at==null?G.time:at)-G.time)+0.004;}
function tone(type,f,t,dur,peak,o){
  o=o||{};const c=A.ctx;const os=c.createOscillator(),g=c.createGain();
  os.type=type;os.frequency.setValueAtTime(f,t);
  if(o.f2)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+(o.ft||dur));
  const a=o.a||0.004;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t+a+dur);
  os.connect(g);g.connect(o.dest||A.out);if(o.send){const s=c.createGain();s.gain.value=o.send;g.connect(s);s.connect(A.wet);}
  os.start(t);os.stop(t+a+dur+0.05);
}
function noise(t,dur,peak,ft,f,q,o){
  o=o||{};const c=A.ctx;const s=c.createBufferSource();s.buffer=A.noise;
  const fl=c.createBiquadFilter();fl.type=ft;fl.frequency.setValueAtTime(f,t);if(o.f2)fl.frequency.exponentialRampToValueAtTime(o.f2,t+dur);fl.Q.value=q;
  const g=c.createGain();const a=o.a||0.003;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dur);
  s.connect(fl);fl.connect(g);g.connect(A.out);if(o.send){const w=c.createGain();w.gain.value=o.send;g.connect(w);w.connect(A.wet);}
  s.start(t,Math.random()*0.8,dur+0.1);
}
const hz=semi=>261.63*Math.pow(2,semi/12);
function sfx(name,at,a,b){
  if(!live())return;
  try{const t=aT(at);SFX[name](t,a,b);}catch(e){}
}
const SFX={
  tick(t){tone('sine',1800,t,0.03,0.035);},
  squeeze(t,p){tone('sine',300*(p||1),t,0.12,0.12,{f2:420*(p||1)});noise(t,0.05,0.04,'bandpass',1200,3);},
  pop(t,i){const f=hz(12+[0,4,7,12][i%4]);tone('sine',f*0.6,t,0.13,0.28,{f2:f*1.3,ft:0.06});tone('triangle',f,t+0.02,0.12,0.08);},
  boing(t,p){p=p||1;tone('sine',160*p,t,0.35,0.18,{f2:330*p,ft:0.08});tone('sine',330*p,t+0.08,0.25,0.08,{f2:240*p});},
  crunch(t,p){p=p||1;for(let i=0;i<3;i++){noise(t+i*0.025+Math.random()*0.01,0.03,0.11,'bandpass',(1700+Math.random()*1600)*p,2.5);}},
  squish(t,p){p=p||1;tone('sine',150*p,t,0.2,0.22,{f2:70*p});noise(t,0.16,0.08,'lowpass',500*p,1,{f2:200});},
  clay(t,p){p=p||1;tone('sine',95*p,t,0.24,0.22,{f2:52*p});noise(t,0.14,0.06,'lowpass',280,1);},
  thud(t){tone('sine',78,t,0.12,0.25,{f2:50});noise(t,0.06,0.07,'lowpass',260,1);},
  dive(t){tone('sine',96,t,0.4,0.42,{f2:42});noise(t,0.25,0.12,'lowpass',420,1,{f2:120});},
  note(t,semi,v){
    const f=hz(semi);
    if(v===0){tone('sine',f,t,0.5,0.3,{send:0.25});tone('sine',f*4,t,0.06,0.06);}
    else if(v===1){tone('triangle',f,t,0.34,0.24,{send:0.3});tone('sine',f*2,t,0.12,0.07);}
    else {tone('sine',f,t,0.9,0.16,{send:0.45});tone('sine',f*2.76,t,0.35,0.06);tone('sine',f*5.4,t,0.16,0.03);}
  },
  hop(t,p){p=p||1;tone('sine',190*p,t,0.12,0.26,{f2:115*p});noise(t,0.02,0.05,'highpass',2000,1);},
  bigHop(t,p){p=p||1;tone('sine',150*p,t,0.2,0.3,{f2:85*p});tone('triangle',hz(12)*p,t+0.02,0.18,0.08,{send:0.3});},
  rustle(t){noise(t,0.18,0.06,'bandpass',3200,1.5,{f2:2200});},
  harvest(t){noise(t,0.22,0.12,'bandpass',500,2,{f2:3000});tone('sine',300,t+0.12,0.12,0.25,{f2:900});
    [14,18,21,26].forEach((s,i)=>tone('triangle',hz(s),t+0.2+i*0.07,0.4,0.12,{send:0.4}));},
  creakStart(){},
  drip(t,i){const f=1000+((i||0)%3)*260;tone('sine',f,t,0.08,0.16,{f2:f*1.8,ft:0.05,send:0.6});},
  knock(t){tone('sine',110,t,0.18,0.3,{f2:70});noise(t,0.05,0.05,'bandpass',600,2);},
  bass(t,s){tone('sine',hz(-24+(s||0)),t,0.4,0.18);},
  shake(t){noise(t,0.04,0.035,'highpass',5000,1);},
  sprout(t){tone('sine',hz(19),t,0.15,0.08,{f2:hz(24)});},
  stoneSet(t,semi){tone('sine',hz(semi),t,0.18,0.12,{send:0.2});noise(t,0.02,0.06,'bandpass',2500,4);},
  success(t,kind){
    const seqs={untie:[12,16,19,24],soil:[7,11,14,19],dbl:[16,19,23,28],cross:[12,16,19,23,28],deep:[-12,-5,0,7,12],
      water:[21,24,28,33],train:[0,4,7,12,16,19,24,28],grown:[19,24],deepf:[-12,0],smooth:[24,21,19,16,14,12,7]};
    const s=seqs[kind]||seqs.untie;const gap=kind==='train'?0.09:kind==='smooth'?0.16:0.075;
    s.forEach((x,i)=>{tone('sine',hz(x),t+i*gap,0.9,0.12,{send:0.55});tone('sine',hz(x)*2.01,t+i*gap,0.4,0.035);});
    if(kind==='untie'||kind==='train')SFX.boing(t,1.2);
    if(kind==='deep'||kind==='train')tone('sine',hz(-24),t,1.2,0.25);
  },
};
function creak(on,amt){
  if(!live())return;
  try{
    const c=A.ctx;
    if(on&&!A.creak){
      const o=c.createOscillator();o.type='sawtooth';o.frequency.value=120;
      const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=900;f.Q.value=6;
      const g=c.createGain();g.gain.value=0;o.connect(f);f.connect(g);g.connect(A.out);o.start();
      A.creak={o,f,g};
    }
    if(A.creak){
      if(!on){const cr=A.creak;A.creak=null;cr.g.gain.setTargetAtTime(0,c.currentTime,0.03);cr.o.stop(c.currentTime+0.2);return;}
      A.creak.o.frequency.setTargetAtTime(90+amt*2.2,c.currentTime,0.03);
      A.creak.f.frequency.setTargetAtTime(600+amt*9,c.currentTime,0.05);
    }
  }catch(e){}
}
function creakVol(v){if(A.creak&&live()){try{A.creak.g.gain.setTargetAtTime(clamp(v,0,0.07),A.ctx.currentTime,0.04);}catch(e){}}}
const qt=()=>Math.ceil((G.time+0.03)/STEP)*STEP;
function ev(t,f){G.ev.push({t,f});}

// ====================================================================
//  畑の生成
// ====================================================================
function computeHP(s){
  const r=mulberry32((s.seed^0x9e3779b9)>>>0);
  const a1=r()*TAU,a2=r()*TAU,a3=r()*TAU;const baseRow=s.R*0.47;
  s.hpT=[];s.hpB=[];
  for(let x=0;x<=s.C+1;x++){
    const t=baseRow+Math.sin(x*0.33+a1)*0.8+Math.sin(x*0.12+a2)*1.2;
    s.hpT.push(t);s.hpB.push(t+2.5+Math.sin(x*0.47+a3)*0.45);
  }
  s.hpMin=Math.min(...s.hpT);s.hpBMax=Math.max(...s.hpB);
}
function hpTop(x){const s=S;const i=clamp(Math.floor(x),0,s.C);const f=clamp(x-i,0,1);return lerp(s.hpT[i],s.hpT[i+1],f);}
function hpBot(x){const s=S;const i=clamp(Math.floor(x),0,s.C);const f=clamp(x-i,0,1);return lerp(s.hpB[i],s.hpB[i+1],f);}
function inWet(x,y){for(const w of S.wet){const dx=x-w.x,dy=y-w.y;if(dx*dx+dy*dy<w.r*w.r)return true;}return false;}
function inHole(x,y){for(const h of S.holes){if(Math.abs(x-h.x)<h.r+0.35&&y<h.bot+0.25)return true;}return false;}
function typeAt(x,y){
  if(y<0)return T_AIR;
  if(y<hpTop(x))return inWet(x,y)?T_WET:T_DRY;
  if(y<hpBot(x))return inHole(x,y)?T_HOLE:T_HARD;
  return T_LOW;
}
function vegBody(v){const g=clamp(v.g,0,1.3);return v.k===0?lerp(1.9,Math.min(5,S.hpMin-3.5),Math.min(g,1))*(v.wat?1.12:1):lerp(2.3,Math.min(8,S.hpMin*0.55),Math.min(g,1))*(v.wat?1.12:1);}
function vegTap(v){return hpBot(v.x)+1.3;}

function mkWorm(id,k,vx){
  const b=BRO[id];
  return {id,b,state:'knot',kx:k.x,ky:k.y,tmax:k.tmax,loosen:0,popped:0,
    tailDir:Math.atan2(-0.35,vx>k.x?1:-1),stx:0,sty:0,svx:0,svy:0,sq:0,sqv:0,wake:0,
    hx:k.x,hy:k.y,trail:[],trailMax:b.len+2,pa:null,pb:null,sl:-1,steer:false,tx:0,ty:0,
    dent:null,wig:0,by:0,bv:0,freedAt:0,ldx:-99,ldy:-99,lastBump:-9,lastDry:-9,lastWet:-9,lastDig:-9,
    mv:0,grab:false,maxExt:0,joyT:0,auto:null,from:null,wag:0};
}
function genField(seed,C,R,keep){
  const rnd=mulberry32(seed>>>0);
  const s={v:1,seed:seed>>>0,C,R,cycle:keep?keep.cycle+1:0,heap:keep?keep.heap:0,trainHarvest:0,
    wet:[],digs:[],nodes:[],edges:[],holes:[],stones:[],veg:[],worms:[],
    found:{untie:0,soil:0,dbl:0,cross:0,deep:0,train:0,water:0,harvest:0},
    water:null,train:null,heave:new Array(C).fill(0),lowRev:0,userDug:0};
  const prevS=S;S=s;computeHP(s);
  const kMax=Math.max(4,s.hpMin-4.5);
  const mainX=C/2+(rnd()-0.5)*C*0.12;
  const ks=[{x:mainX,y:2.7+rnd()*Math.min(1.6,kMax-2.7),tmax:2},
    {x:C*(0.15+rnd()*0.08),y:3+rnd()*(kMax-3),tmax:3},
    {x:C*(0.77+rnd()*0.08),y:3+rnd()*(kMax-3),tmax:3}];
  const order=[0,1,2];for(let i=2;i>0;i--){const j=Math.floor(rnd()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  const cols=[];
  const okCol=(c,d)=>c>=3.4&&c<=C-2.6&&cols.every(o=>Math.abs(o-c)>=(d||3.8));
  const carrots=[];
  for(const k of ks){
    const sgn=k.x<C/2?1:-1;let col=null;
    for(const off of [4,-4,3.5,-3.5,5,-5,3,-3,6,-6,2.6,-2.6]){const c=k.x+off*sgn;if(okCol(c)){col=c;break;}}
    if(col==null){for(let c=3.4;c<=C-2.6;c+=0.5){if(okCol(c,3)){col=c;break;}}}
    if(col==null)col=clamp(k.x+3*sgn,3.4,C-2.6);
    cols.push(col);carrots.push(col);s.veg.push({k:0,x:col,g:0.14+rnd()*0.06,h:0,wat:0});
  }
  for(let n=0;n<2;n++){
    const farK=c=>ks.every(k=>Math.abs(k.x-c)>=3.2);
    let col=null;for(let t=0;t<300&&col==null;t++){const c=3.4+rnd()*(C-6);if(okCol(c)&&farK(c))col=c;}
    if(col==null)for(let t=0;t<300&&col==null;t++){const c=3.4+rnd()*(C-6);if(okCol(c,2.8))col=c;}
    if(col==null)col=3.4+rnd()*(C-6);
    cols.push(col);s.veg.push({k:1,x:col,g:0.16+rnd()*0.05,h:0,wat:0});
  }
  // 湿った土
  const wy=clamp(s.hpMin*0.55,4,s.hpMin-3);
  s.wet.push({x:clamp(mainX+(rnd()<0.5?-1:1)*(3.5+rnd()*3.5),3,C-3),y:wy+rnd()*1.5,r:3.2+rnd()*2});
  const nW=1+(rnd()<0.55?1:0);
  for(let i=0;i<nW;i++){s.wet.push({x:2+rnd()*(C-4),y:3+rnd()*(s.hpMin-5),r:2.6+rnd()*2.4});}
  // 小石
  const occ=[];ks.forEach(k=>occ.push([k.x,k.y,3.4]));
  const freeSpot=(x,y,d)=>occ.every(o=>hyp(o[0]-x,o[1]-y)>=Math.max(d,o[2]))&&s.veg.every(v=>Math.abs(v.x-x)>=1.8||y>6.5);
  for(let i=0;i<5;i++){
    for(let t=0;t<200;t++){const x=2+rnd()*(C-4),y=1.8+rnd()*(s.hpMin-3.6);
      if(freeSpot(x,y,2.6)){s.stones.push({x,y,r:0.5+rnd()*0.28,p:Math.floor(rnd()*5),o:0,node:-1,big:0,hue:rnd()});occ.push([x,y,2.6]);break;}}
  }
  for(let i=0;i<2;i++){
    for(let t=0;t<200;t++){const x=3+rnd()*(C-6),y=s.hpBMax+1.6+rnd()*Math.max(1,R-s.hpBMax-3.5);
      if(freeSpot(x,y,3)){s.stones.push({x,y,r:0.8+rnd()*0.25,p:Math.floor(rnd()*5),o:-1,node:-1,big:0,hue:rnd()});occ.push([x,y,3]);break;}}
  }
  const wq=Q.get('water');const roll=rnd();
  const want=wq==='1'?true:wq==='0'?false:roll<0.15;
  if(want){
    for(let t=0;t<200;t++){const x=4+rnd()*(C-8),y=clamp(s.hpBMax+2.4+rnd()*3,s.hpBMax+2,R-4.2);
      if(freeSpot(x,y,3.5)||t>150){s.stones.push({x,y,r:1.9,p:0,o:-2,node:-1,big:1,hue:rnd()});s.water={x,y:y+2.1,found:0};break;}}
  }
  ks.forEach((k,i)=>{s.worms[order[i]]=mkWorm(order[i],k,carrots[i]);});
  ks.forEach(k=>s.digs.push({x:k.x,y:k.y,r:2.0,t:4}));
  S=prevS;
  return s;
}

// ====================================================================
//  グラフ（掘った道）
// ====================================================================
function bkey(x,y){return (Math.floor(y)+3)*(S.C+4)+Math.floor(x)+2;}
function rebuildIndex(){
  dug=new Uint8Array(S.C*S.R);buckets=new Map();uf={p:[],m:[]};
  for(const d of S.digs)markDug(d.x,d.y,d.r);
  S.nodes.forEach((n,i)=>{n.adj=[];n.rot=0;addBucket(i);uf.p[i]=i;uf.m[i]=n.o>=0?(1<<n.o):0;});
  const ed=S.edges;S.edges=[];
  for(const e of ed){const a=e[0],b=e[1];if(S.nodes[a]&&S.nodes[b]&&a!==b&&S.nodes[a].adj.indexOf(b)<0){S.nodes[a].adj.push(b);S.nodes[b].adj.push(a);S.edges.push([a,b]);union(a,b,true);}}
}
function markDug(x,y,r){
  let fresh=0;const r2=r*r;
  for(let cy=Math.floor(y-r);cy<=Math.floor(y+r);cy++)for(let cx=Math.floor(x-r);cx<=Math.floor(x+r);cx++){

    for(const h of hs){const ins=hyp(h.x-w.x,h.y-w.y)<1.7;
      if(ins&&!w.inn[h.k]){if(!w.found)onWater(h);const t=qt();for(let i=0;i<3;i++){sfx('drip',t+i*STEP*2,i);ev(t+i*STEP*2,()=>part({k:'d',x:w.x+(Math.random()-0.5),y:w.y-0.8,vx:0,vy:-3,life:0.8,s:0.2,c:[200,220,235]}));}}
      w.inn[h.k]=ins;}}
  if(!S.found.deep){for(const h of hs){if(h.y>hpBot(h.x)+0.35){onDeep(h);break;}}}
}
function hitStone(s,h){
  const t=qt();const semi=SCALE[s.p]+12*s.o+(h.v===0?-12:h.v===2?12:0);
  sfx('note',t,semi,h.v);if(s.big)sfx('knock',t);
  ev(t,()=>{s.pop=1;sparks(s.x,s.y,4,s.big?[200,220,255]:[255,236,200],2.5);});
  // 二連打の検出
  const lh=G.lastHit=G.lastHit||{};const prev=lh[h.k];
  if(prev&&prev.s!==s&&t-prev.t<=1.6&&t-prev.t>0&&hyp(prev.s.x-s.x,prev.s.y-s.y)<9&&!s.big&&!prev.s.big){
    const a=prev.s,b=s;
    ev(t,()=>{G.pair={a,b,t0:G.time};});
    if(!S.found.dbl){S.found.dbl=1;logEv('dbl',{gap:+(t-prev.t).toFixed(2)});sfx('success',t+STEP,'dbl');ev(t,()=>{sparks((a.x+b.x)/2,(a.y+b.y)/2,12,[255,236,190],4);bounceWorm(h.v);});}
    else logEv('dbl2',{gap:+(t-prev.t).toFixed(2)});
  }
  lh[h.k]={s,t};
}

function bodyHit(px,py){
  for(const w of S.worms){
    let pts=null;
    if(w.state==='free'||w.state==='auto'||w.state==='joy')pts=bodyPts(w);
    if(!pts)continue;
    for(const p of pts){if(hyp(X(p[0])-px,Y(p[1])-py)<Math.max(w.b.th*0.8*L.cs,22))return {w,p};}
  }
  if(S.train&&!S.train.attach){for(const sg of trainPts())for(const p of sg.pts){if(hyp(X(p[0])-px,Y(p[1])-py)<Math.max(sg.w.b.th*0.8*L.cs,22))return {w:sg.w,p};}}
  return null;
}
function hitTest(px,py){
  const cs=L.cs;let best=null,bd=1e9;
  // 頭
  for(const w of S.worms){
    const lead=w.state==='free'||(w.state==='train'&&S.train&&!S.train.attach&&S.train.order[0]===w.id);
    if(!lead)continue;let hx=w.hx,hy=w.hy;
    if(w.state==='free'&&w.rev){const b=bodyPts(w);const e=b[b.length-1];hx=e[0];hy=e[1];}
    const d=hyp(X(hx)-px,Y(hy)-py)-8;if(d<Math.max(1.9*cs,36)&&d<bd){bd=d;best={kind:'head',ref:w};}
  }
  for(const w of S.worms){if(w.state!=='knot')continue;const kg=knotGeom(w);
    const dt=hyp(X(kg.tip[0])-px,Y(kg.tip[1])-py),dc=hyp(X(w.kx)-px,Y(w.ky)-py);
    if(dt<Math.max(2.1*cs,38)||dc<Math.max((kg.r*1.5+kg.spread*0.5+0.4)*cs,42)){const d=Math.min(dt,dc);if(d<bd){bd=d;best={kind:'knot',ref:w};}}}
  for(const s of S.stones){const d=hyp(X(s.x)-px,Y(s.y)-py);if(d<Math.max((s.r+0.8)*cs,s.big?40:30)&&d<bd){bd=d;best={kind:s.big?'big':'stone',ref:s};}}
  if(best)return best;
  for(const v of S.veg){if(v.h)continue;const lh=leafLen(v);
    if(Math.abs(X(v.x)-px)<Math.max(1.7*cs,32)&&py>Y(-lh-0.4)&&py<Y(1.6)){best={kind:'veg',ref:v};break;}}
  if(best)return best;
  const bh=bodyHit(px,py);if(bh)return {kind:'body',ref:bh.w,p:bh.p};
  return {kind:'none'};
}
function pt(e){return [e.clientX,e.clientY];}
function onDown(e){
  e.preventDefault();audioInit();
  G.lastInput=G.time;G.hand=null;G.handShown=false;G.taps++;
  const [px,py]=pt(e);
  if(P&&P.id!==e.pointerId){wobble(px,py);return;}
  if(P)endPointer(false);
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(!S||S.smooth){wobble(px,py);P={id:e.pointerId,kind:'none',sx:px,sy:py,moved:0};return;}
  const h=hitTest(px,py);
  P={id:e.pointerId,kind:h.kind,ref:h.ref,sx:px,sy:py,x:px,y:py,moved:0,t0:G.time};
  const x=WX(px),y=WY(py);
  if(!G.firstTap)G.firstTap={t:performance.now(),kind:h.kind};
  if(h.kind==='knot'){const w=h.ref;w.grab=true;w.maxExt=0;w.sq=0.22;w.sqv=0;w.dent={x,y,a:1};P.dentW=w;w.bx0=w.stx;w.by0=w.sty;
    sfx('squeeze',null,1.2-w.id*0.1);creak(true,0);creakVol(0);grains(x,y,3,[200,150,100],0.8,true);logEv('knotDown',{w:w.id});}
  else if(h.kind==='head'){const w=h.ref;if(w.state==='free'&&w.rev)flipWorm(w);w.steer=true;w.tx=x;w.ty=y;w.sq=0.2;
    const n=nearestNode(w.hx,w.hy,1.6,-1);w.sl=n;if(n<0)strokeNode(w);sfx('squeeze',null,1.4-w.id*0.1);logEv('headDown',{w:w.id});}
  else if(h.kind==='stone'){const s=h.ref;s.drag=true;s.offx=s.x-x;s.offy=s.y-y;s.node=-1;s.lift=1;sfx('stoneSet',null,SCALE[s.p]+12*s.o);}
  else if(h.kind==='big'){const s=h.ref;s.pop=1;sfx('knock');grains(s.x,s.y-s.r,4,[180,160,140],1.5,true);}
  else if(h.kind==='veg'){const v=h.ref;v.grab=true;v.wig=1;sfx('rustle');}
  else if(h.kind==='body'){const w=h.ref;w.dent={x:h.p[0],y:h.p[1],a:1};P.dentW=w;w.sq=0.25;w.wig=1;sfx('squeeze',null,1.1);}
  else wobble(px,py);
}
function onMove(e){
  if(!P||e.pointerId!==P.id)return;e.preventDefault();
  const [px,py]=pt(e);P.x=px;P.y=py;P.moved=Math.max(P.moved,hyp(px-P.sx,py-P.sy));
  const x=WX(px),y=WY(py);G.lastInput=G.time;
  if(P.kind==='knot'){const w=P.ref;if(w.state!=='knot'){P.kind='none';return;}
    let dx=px-P.sx,dy=py-P.sy;const l=hyp(dx,dy);const mx=150;if(l>mx){dx*=mx/l;dy*=mx/l;}
    const ext=Math.min(l,mx);
    w.stx=w.bx0+dx/L.cs;w.sty=w.by0+dy/L.cs;
    creak(true,ext);creakVol(Math.min(0.06,ext/2500+0.015));
    if(ext>w.maxExt){w.loosen+=(ext-w.maxExt)/TURN_PX;w.maxExt=ext;checkTurns(w);if(Math.random()<0.25)grains(w.kx,w.ky,1,[200,150,100],2,false);}
  }else if(P.kind==='head'){const w=P.ref;w.tx=clamp(x,0.6,S.C-0.6);w.ty=clamp(y,-0.3,S.R-0.6);}
  else if(P.kind==='stone'){const s=P.ref;s.x=clamp(x+s.offx,0.6,S.C-0.6);s.y=clamp(y+s.offy,0.5,S.R-0.6);}
  else if(P.kind==='veg'){const v=P.ref;if(v.h){P.kind='none';return;}const pull=Math.max(0,P.sy-py);
    const grown=v.g>=1;v.pull=grown?pull/L.cs*0.5:Math.min(pull/L.cs*0.25,0.9);
    if(grown&&pull>Math.max(64,2.6*L.cs)){harvest(v);P.kind='none';}}
}
function checkTurns(w){
  const done=Math.floor(w.loosen+1e-6);
  while(w.popped<done&&w.popped<w.tmax){w.popped++;sfx('pop',null,w.popped-1);w.sqv=-6;w.wag=0;
    sparks(w.kx,w.ky,6,[255,220,170],3);grains(w.kx,w.ky,5,[205,155,105],2.2,true);logEv('turn',{w:w.id,n:w.popped});}
  if(w.loosen>=w.tmax&&w.state==='knot')untie(w);
}
function endPointer(cancel){
  if(!P)return;const p=P;P=null;
  if(p.kind==='knot'){const w=p.ref;w.grab=false;creak(false);
    if(w.state==='knot'){
      if(p.moved<12&&!cancel){w.loosen+=0.3;w.sqv=-5;checkTurns(w);sfx('knock');}
      else if(p.moved>30)sfx('boing',null,1.1-w.id*0.08);
      w.svx=0;w.svy=0;w.maxExt=0;}}
  else if(p.kind==='head'){const w=p.ref;w.steer=false;w.pa=null;w.pb=w.sl>=0?w.sl:null;}
  else if(p.kind==='stone'){const s=p.ref;s.drag=false;s.lift=0;snapStone(s);}
  else if(p.kind==='veg'){const v=p.ref;v.grab=false;if((v.pull||0)>0.15&&v.g<1){sfx('boing',null,0.7);v.wig=1;}}
  if(p.dentW&&p.dentW.dent){p.dentW.sqv=-4;}
}
function snapStone(s){
  let best=-1,bd=2.7*2.7;
  for(let i=0;i<S.nodes.length;i++){const n=S.nodes[i];const d=(n.x-s.x)**2+(n.y-s.y)**2;if(d>=bd)continue;
    if(S.stones.some(o=>o!==s&&(o.node===i||hyp(o.x-n.x,o.y-n.y)<1.1)))continue;bd=d;best=i;}
  if(best>=0){s.node=best;s.sx=s.x;s.sy=s.y;s.snapT=G.time;const n=S.nodes[best];s.x=n.x;s.y=n.y;s.inn={};
    sfx('stoneSet',null,SCALE[s.p]+12*s.o+12);sparks(n.x,n.y,5,[255,236,200],2);logEv('stoneSnap');}
  else{sfx('tick');grains(s.x,s.y+s.r,3,[190,140,90],0.8,true);}
  S.dirty=true;
}
function wobble(px,py){
  const x=WX(px),y=WY(py);
  if(y<0){G.sway={x,t0:G.time};sfx('rustle');return;}
  for(let i=0;i<5;i++)part({k:'j',x:x+(Math.random()-0.5)*1.2,y:y+(Math.random()-0.5)*1.2,vx:0,vy:0,life:0.45,s:0.16+Math.random()*0.1,c:[215,170,120],ph:Math.random()*6});
  ringFx(x,y,1.1,[230,200,160]);sfx('tick');
}

function leafLen(v){const g=clamp(v.g,0,1.3);return (v.k===0?2.0+2.2*g:2.4+2.8*g);}
function wormForFocus(){return S.worms.filter(w=>w.state==='free');}
function pickFocus(){
  if(S.smooth)return null;
  const knots=S.worms.filter(w=>w.state==='knot');const free=wormForFocus();
  const kf=w=>{const kg=knotGeom(w);return {k:'knot',ref:w,x:kg.tip[0],y:kg.tip[1],dx:Math.cos(w.tailDir)*3.2,dy:Math.sin(w.tailDir)*3.2-0.4};};
  const hf=(w,tx,ty)=>{let hx=w.hx,hy=w.hy;if(w.state==='free'&&w.rev){const b=bodyPts(w);const e=b[b.length-1];hx=e[0];hy=e[1];}
    let dx=tx-hx,dy=ty-hy;const l=hyp(dx,dy)||1;const m=Math.min(3.6,l);return {k:'head',ref:w,x:hx,y:hy,dx:dx/l*m,dy:dy/l*m};};
  const vegF=v=>({k:'veg',ref:v,x:v.x,y:-leafLen(v)*0.45,dx:0,dy:-3});
  if(!S.found.untie&&knots.length){const main=knots.reduce((a,b)=>a.tmax<=b.tmax&&Math.abs(a.kx-S.C/2)<Math.abs(b.kx-S.C/2)?a:b);return kf(main);}
  const grown=S.veg.filter(v=>!v.h&&v.g>=1).sort((a,b)=>b.k-a.k);
  if(S.train&&!S.train.attach){const lead=S.worms[S.train.order[0]];
    if(grown.length)return vegF(grown[0]);
    const offS=S.stones.filter(s=>s.node<0&&!s.big);
    const tv=S.veg.filter(v=>!v.h).sort((a,b)=>a.g-b.g)[0];
    if(tv)return hf(lead,tv.x,vegBody(tv)+1);return hf(lead,S.C/2,S.R*0.8);}
  if(free.length&&S.userDug<10){const w=free[0];
    let tg=S.wet[0];return hf(w,tg.x,tg.y);}
  if(free.length&&!S.found.soil){const w=free[0];const tg=S.wet[0];
    const inW=typeAt(w.hx,w.hy)===T_WET;return inW?hf(w,tg.x+(tg.x<S.C/2?tg.r+3:-tg.r-3),tg.y):hf(w,tg.x,tg.y);}
  const onS=S.stones.filter(s=>s.node>=0).length;
  if(onS<2&&S.nodes.length>6){const off=S.stones.filter(s=>s.node<0&&!s.big&&s.y<S.hpMin);
    if(off.length){let best=null,bd=1e9,bn=-1;for(const s of off){const n=nearestNode(s.x,s.y,40,-1);if(n<0)continue;const nn=S.nodes[n];const d=hyp(nn.x-s.x,nn.y-s.y);if(d<bd){bd=d;best=s;bn=n;}}
      if(best){const nn=S.nodes[bn];return {k:'stone',ref:best,x:best.x,y:best.y,dx:nn.x-best.x,dy:nn.y-best.y};}}}
  if(knots.length&&free.length<2){const w=knots.sort((a,b)=>Math.abs(a.kx-(free[0]?free[0].hx:0))-Math.abs(b.kx-(free[0]?free[0].hx:0)))[0];return kf(w);}
  if(!S.found.cross&&free.length>=2){
    const a=free[0];let tgt=null,bd=1e9;
    const ra=a.sl>=0?find(a.sl):-1;
    for(let i=0;i<S.nodes.length;i++){const n=S.nodes[i];if(n.o<0||n.o===a.id)continue;if(find(i)===ra)continue;const d=hyp(n.x-a.hx,n.y-a.hy);if(d<bd){bd=d;tgt=n;}}
    if(tgt)return hf(a,tgt.x,tgt.y);}
  if(grown.length)return vegF(grown[0]);
  const hole=S.holes.find(h=>h.k===1);
  if(hole&&!S.found.deep&&free.length){let w=free[0],bd=1e9;for(const f of free){const d=hyp(f.hx-hole.x,f.hy-hole.bot);if(d<bd){bd=d;w=f;}}return hf(w,hole.x,hole.bot+1.5);}
  if(knots.length)return kf(knots[0]);
  if(free.length){const tv=S.veg.filter(v=>!v.h).sort((a,b)=>(b.k-a.k)||(a.g-b.g))[0];const w=free[0];if(tv)return hf(w,tv.x,vegBody(tv)+1);}
  return null;
}

function update(dt){
  // 予約された出来事
  if(G.ev.length){const due=[];G.ev=G.ev.filter(e=>{if(e.t<=G.time){due.push(e);return false;}return true;});for(const e of due){try{e.f();}catch(err){}}}
  for(const w of S.worms)updateWorm(w,dt);
  if(S.pendingTrain&&G.time>=S.pendingTrain&&!S.train&&S.worms.every(w=>w.state==='free')){S.pendingTrain=0;startTrain();}
  if(S.train&&S.train.attach&&G.time-S.train.t0>1.7){S.train.attach=false;for(const w of S.worms)w.from=null;
    const segs=trainPts();for(let i=1;i<segs.length;i++){const p=segs[i].pts[0];sparks(p[0],p[1],6,[255,220,170],3);}sfx('pop',null,3);}
  if(S.train&&!S.train.attach){if(G.time>=G.nb){G.nb=Math.max(G.nb,Math.ceil(G.time/(STEP*4))*STEP*4)+STEP*4;
    const beat=Math.round(G.nb/STEP/4)%4;sfx('bass',G.nb,[0,0,7,5][beat]);if(S.edges.length>40)sfx('shake',G.nb+STEP*2);}}
  if(S.smooth)updateSmooth();
  else if(S.endAt&&G.time>=S.endAt)endCycle();
  else if(G.tooSmall&&!P){G.tooSmall=false;logEv('reshape');endCycle();}
  sense();
  // 野菜
  for(const v of S.veg){
    v.hv=(v.hv||0)+40*dt;v.hy=(v.hy||0)+v.hv*dt;if(v.hy>0){v.hy=0;v.hv=Math.abs(v.hv)>3?-v.hv*0.3:0;}
    v.lift=Math.max(0.18*(v.lift>0?1:0),(v.lift||0)-dt*0.05);
    if(!v.grab)v.pull=Math.max(0,(v.pull||0)-dt*6);
    v.wig=Math.max(0,(v.wig||0)-dt*1.5);
    if(v.h&&G.time>=v.regrow){v.h=0;v.g=0.08;v.lift=0;v.inn={};sfx('sprout');sparks(v.x,-0.3,5,[190,240,160],2);S.dirty=true;}
  }
  for(const s of S.stones){s.pop=Math.max(0,(s.pop||0)-dt*3);}
  // パーティクル
  const ps=G.parts;for(let i=ps.length-1;i>=0;i--){const p=ps[i];p.t+=dt;if(p.t>=p.life){ps.splice(i,1);continue;}
    if(p.k==='g'){p.vy+=14*dt;}else if(p.k==='b'){p.vx*=0.9;p.vy*=0.9;}else if(p.k==='s'){p.vy+=3*dt;p.vx*=0.96;}else if(p.k==='d'){p.vy+=12*dt;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;}
  for(let i=G.fly.length-1;i>=0;i--){const f=G.fly[i];f.t+=dt;f.vy+=22*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.t>0.9){G.fly.splice(i,1);sfx('hop',null,1.4);}}
  S.lowRev=G.lowAnim?Math.max(S.lowRev,clamp((G.time-G.lowAnim)/1.2,0,1)):(S.found.deep||S.found.train?1:S.lowRev);
  G.flash=Math.max(0,G.flash-dt*0.8);
  // 誘導
  G.focus=pickFocus();
  if(G.focus&&G.focus.k==='knot')G.focus.ref.wag=1;
  if(!P&&!G.hand&&!G.handShown&&G.time-G.lastInput>4&&G.focus){G.hand={...G.focus,t0:G.time,dur:2.0};G.handShown=true;logEv('hand',{f:G.focus.k});}
  if(G.hand&&G.time-G.hand.t0>G.hand.dur)G.hand=null;
  // 保存
  if(S.dirty&&G.time>G.saveAt){G.saveAt=G.time+2.5;save();}
}
function updateSmooth(){
  const sm=S.smooth;const t=G.time-sm.t0;
  if(t<1.6){G.smoothFill=ease(t/1.6);if(Math.random()<0.6)grains(G.smoothFill*S.C,Math.random()*S.hpMin,2,[200,150,100],2,true);}
  else if(!sm.swapped){sm.swapped=true;newField(true);S.smooth={t0:sm.t0,swapped:true};}
  else if(t<2.9){G.smoothFill=1-ease((t-1.6)/1.3);}
  else{S.smooth=null;G.smoothFill=0;save();}
}

function drawTube(pts,wf,col,opt){
  const n=pts.length;if(n<2)return;opt=opt||{};
  const sp=new Array(n),ws=new Array(n);
  for(let i=0;i<n;i++){sp[i]=[X(pts[i][0]),Y(pts[i][1])];ws[i]=wf(i/(n-1),pts[i]);}
  ctx.lineCap='round';ctx.lineJoin='round';
  if(opt.layered){

  if(f.k==='stone'&&Math.sin(t*4.2)>0.95)f.ref.pop=Math.max(f.ref.pop||0,0.4);
}
function drawHand(){
  const h=G.hand;if(!h)return;const p=(G.time-h.t0)/h.dur;if(p<0||p>=1)return;
  const e=p<0.3?0:p<0.82?ease((p-0.3)/0.52):1;
  const x=X(h.x+h.dx*e),y=Y(h.y+h.dy*e);const al=p<0.15?p/0.15:p>0.85?(1-p)/0.15:1;
  const press=p>0.18&&p<0.84;const s=Math.max(22,L.cs*1.7)/22;
  ctx.save();ctx.globalAlpha=al*0.88;ctx.translate(x,y);ctx.scale(s*(press?0.94:1),s*(press?0.94:1));
  if(press){ctx.globalCompositeOperation='lighter';glow(0,0,26,0.45,[255,240,210]);ctx.globalCompositeOperation='source-over';}
  ctx.rotate(-0.45);
  let g=ctx.createLinearGradient(-12,0,12,0);g.addColorStop(0,'#e7c2a8');g.addColorStop(0.45,'#fde7d6');g.addColorStop(1,'#d9ab8f');
  ctx.fillStyle='rgba(60,30,15,0.18)';ctx.beginPath();ctx.roundRect?ctx.roundRect(-9,4,22,64,11):ctx.rect(-9,4,22,64);ctx.fill();
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,26,11,30,0,0,TAU);ctx.fill();
  ctx.beginPath();ctx.ellipse(6,62,26,22,0.2,0,TAU);ctx.fill();
  ctx.beginPath();ctx.ellipse(-16,52,8,18,-0.5,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.55)';ctx.beginPath();ctx.ellipse(-3,8,4,7,0,0,TAU);ctx.fill();
  ctx.restore();
}
function drawWave(){
  const wv=G.wave;if(!wv)return;const d=(G.time-wv.t0)*14;if(d>wv.maxD+3){G.wave=null;return;}
  ctx.globalCompositeOperation='lighter';
  wv.dist.forEach((dd,id)=>{const k=Math.abs(dd-d);if(k>1.6)return;const n=S.nodes[id];glow(X(n.x),Y(n.y),L.cs*1.3,0.35*(1-k/1.6));});
  ctx.globalCompositeOperation='source-over';
}
function drawPair(){
  const pr=G.pair;if(!pr)return;const t=G.time-pr.t0;if(t>0.8){G.pair=null;return;}
  const a=1-t/0.8;ctx.strokeStyle='rgba(255,236,190,'+(a*0.7)+')';ctx.lineWidth=Math.max(2,L.cs*0.25)*a;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(X(pr.a.x),Y(pr.a.y));ctx.quadraticCurveTo(X((pr.a.x+pr.b.x)/2),Y(Math.min(pr.a.y,pr.b.y)-1.5),X(pr.b.x),Y(pr.b.y));ctx.stroke();
}
function render(){
  let z=1;if(S.train&&G.time-S.train.t0<1.6&&G.time>=S.train.t0){const e=ease((G.time-S.train.t0)/1.6);z=1.09-0.09*e;}
  const zx=W/2,zy=(L.oy+H)/2;
  if(z!==1){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#3a2214';ctx.fillRect(0,0,cv.width,cv.height);}
  ctx.setTransform(DPR*z,0,0,DPR*z,DPR*(zx-zx*z),DPR*(zy-zy*z));
  ctx.drawImage(comp,0,0,W,H);
  ctx.setTransform(DPR*z,0,0,DPR*z,DPR*(zx-zx*z),DPR*(zy-zy*z));
  if(S.lowRev<1&&G.lowDim){ctx.fillStyle='rgba(12,5,2,'+(0.42*(1-S.lowRev))+')';ctx.fill(G.lowDim);}
  if(S.lowRev>0&&S.lowRev<1){ctx.save();ctx.clip(G.lowDim);ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,170,120,'+(0.18*Math.sin(Math.PI*S.lowRev))+')';ctx.fillRect(0,0,W,H);ctx.restore();}
  drawSurface();drawWater();drawWave();drawFocus();
  for(const s of S.stones)if(!s.drag)drawStone(s);
  for(const v of S.veg)drawVeg(v);
  drawWorms();drawPair();
  for(const s of S.stones)if(s.drag)drawStone(s);
  drawParts();drawHeap();
  if(G.flash>0){ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,220,170,'+(0.35*G.flash*G.flash)+')';ctx.fillRect(0,L.oy,W,H-L.oy);ctx.globalCompositeOperation='source-over';}
  if(G.ring){const t=G.time-G.ring.t0;if(t>1.6)G.ring=null;else{const r=t/1.6;ctx.strokeStyle='rgba(255,230,180,'+(0.6*(1-r))+')';ctx.lineWidth=L.cs*0.6*(1-r)+1;ctx.beginPath();ctx.arc(X(G.ring.x),Y(G.ring.y),r*Math.max(W,H),0,TAU);ctx.stroke();}}
  if(G.smoothFill>0){const f=G.smoothFill;const ph=S.smooth&&S.smooth.swapped;const fx=ph?W:L.ox+f*(S.C*L.cs);
    const g=ctx.createLinearGradient(0,L.oy,0,H);g.addColorStop(0,'rgba(140,92,56,'+(ph?f:1)+')');g.addColorStop(1,'rgba(96,58,32,'+(ph?f:1)+')');
    ctx.fillStyle=g;ctx.fillRect(0,L.oy-2,fx,H-L.oy+2);
    if(!ph){ctx.fillStyle='#8a5a36';ctx.beginPath();ctx.ellipse(fx,L.oy,L.cs*1.8,L.cs*1.1,0,Math.PI,TAU);ctx.fill();}}
  drawHand();
}

// ====================================================================
//  保存・復元
// ====================================================================
const r2=v=>Math.round(v*100)/100;
function serialize(){
  return {v:1,seed:S.seed,C:S.C,R:S.R,cycle:S.cycle,heap:S.heap,th:S.trainHarvest,ud:S.userDug,
    wet:S.wet.map(w=>[r2(w.x),r2(w.y),r2(w.r)]),digs:S.digs.map(d=>[d.x,d.y,d.r,d.t]),
    nodes:S.nodes.map(n=>[r2(n.x),r2(n.y),n.o]),edges:S.edges.map(e=>[e[0],e[1]]),
    holes:S.holes.map(h=>[h.x,h.bot,h.r,h.k]),
    stones:S.stones.map(s=>[r2(s.x),r2(s.y),r2(s.r),s.p,s.o,s.node,s.big,r2(s.hue)]),
    veg:S.veg.map(v=>[v.k,r2(v.x),r2(v.g),v.h?1:0,v.wat?1:0]),
    heave:S.heave.map(r2),
    worms:S.worms.map(w=>({s:w.state==='joy'||w.state==='auto'?'free':w.state,id:w.id,kx:r2(w.kx),ky:r2(w.ky),tm:w.tmax,lo:r2(w.state==='knot'?w.loosen:w.tmax),
      pp:w.popped,td:r2(w.tailDir),hx:r2(w.hx),hy:r2(w.hy),fa:r2(w.freedAt-G.time),tr:w.trail.slice(-260).map(p=>[r2(p.x),r2(p.y)])})),
    found:S.found,water:S.water?[r2(S.water.x),r2(S.water.y),S.water.found]:null,
    train:S.train?S.train.order.slice():null};
}
function save(){
  if(G.memOnly||Q.get('nosave')==='1'){S.dirty=false;return;}
  try{localStorage.setItem(SKEY,JSON.stringify(serialize()));S.dirty=false;}
  catch(e){G.memOnly=true;S.dirty=false;}
}
const isN=(v,a,b)=>typeof v==='number'&&isFinite(v)&&v>=a&&v<=b;
const isI=(v,a,b)=>Number.isInteger(v)&&v>=a&&v<=b;
function validate(o){
  if(!o||typeof o!=='object'||o.v!==1)return false;
  if(!isI(o.seed,0,4294967295)||!isI(o.C,16,80)||!isI(o.R,18,70))return false;
  const C=o.C,R=o.R;
  if(!isI(o.cycle,0,1e6)||!isI(o.heap,0,1e7)||!isI(o.th,0,1e6)||!isN(o.ud,0,1e9))return false;
  const arr=(a,max,f)=>Array.isArray(a)&&a.length<=max&&a.every(f);
  if(!arr(o.wet,12,w=>Array.isArray(w)&&w.length===3&&isN(w[0],-5,C+5)&&isN(w[1],-5,R+5)&&isN(w[2],0.5,10)))return false;
  if(!arr(o.digs,7000,d=>Array.isArray(d)&&d.length===4&&isN(d[0],-2,C+2)&&isN(d[1],-2,R+2)&&isN(d[2],0.1,3)&&isI(d[3],0,4)))return false;
  if(!arr(o.nodes,9000,n=>Array.isArray(n)&&n.length===3&&isN(n[0],-2,C+2)&&isN(n[1],-2,R+2)&&isI(n[2],-1,2)))return false;
  const nn=o.nodes.length;
  if(!arr(o.edges,20000,e=>Array.isArray(e)&&e.length===2&&isI(e[0],0,nn-1)&&isI(e[1],0,nn-1)))return false;
  if(!arr(o.holes,200,h=>Array.isArray(h)&&h.length===4&&isN(h[0],0,C)&&isN(h[1],-1,R)&&isN(h[2],0.2,2)&&isI(h[3],0,1)))return false;
  if(!arr(o.stones,20,s=>Array.isArray(s)&&s.length===8&&isN(s[0],0,C)&&isN(s[1],-1,R)&&isN(s[2],0.2,3)&&isI(s[3],0,4)&&isI(s[4],-2,1)&&isI(s[5],-1,nn-1)&&isI(s[6],0,1)&&isN(s[7],0,1)))return false;
  if(!arr(o.veg,8,v=>Array.isArray(v)&&v.length===5&&isI(v[0],0,1)&&isN(v[1],0,C)&&isN(v[2],0,1.5)&&isI(v[3],0,1)&&isI(v[4],0,1))||o.veg.length<3)return false;
  if(!Array.isArray(o.heave)||o.heave.length!==C||!o.heave.every(h=>isN(h,-1,1)))return false;
  if(!Array.isArray(o.worms)||o.worms.length!==3)return false;
  for(let i=0;i<3;i++){const w=o.worms[i];if(!w||typeof w!=='object'||w.id!==i)return false;
    if(['knot','free','train'].indexOf(w.s)<0)return false;
    if(!isN(w.kx,0,C)||!isN(w.ky,-1,R)||!isI(w.tm,1,4)||!isN(w.lo,0,5)||!isI(w.pp,0,4)||!isN(w.td,-7,7)||!isN(w.hx,-1,C+1)||!isN(w.hy,-3,R+1)||!isN(w.fa,-1e9,1e9))return false;
    if(!arr(w.tr,400,p=>Array.isArray(p)&&p.length===2&&isN(p[0],-2,C+2)&&isN(p[1],-4,R+2)))return false;
    if(w.s!=='knot'&&w.tr.length<2)return false;}
  if(!o.found||typeof o.found!=='object')return false;
  for(const k of ['untie','soil','dbl','cross','deep','train','water','harvest'])if(!isI(o.found[k],0,1e6))return false;
  if(o.water!==null&&!(Array.isArray(o.water)&&o.water.length===3&&isN(o.water[0],0,C)&&isN(o.water[1],0,R)&&isI(o.water[2],0,1)))return false;
  if(o.train!==null){if(!Array.isArray(o.train)||o.train.length!==3||[0,1,2].some(i=>o.train.indexOf(i)<0))return false;if(o.worms.some(w=>w.s!=='train'))return false;}
  else if(o.worms.some(w=>w.s==='train'))return false;
  return true;
}
function fromSave(o){
  const s={v:1,seed:o.seed,C:o.C,R:o.R,cycle:o.cycle,heap:o.heap,trainHarvest:o.th,userDug:o.ud,
    wet:o.wet.map(w=>({x:w[0],y:w[1],r:w[2]})),digs:o.digs.map(d=>({x:d[0],y:d[1],r:d[2],t:d[3]})),
    nodes:o.nodes.map(n=>({x:n[0],y:n[1],o:n[2],adj:[],rot:0})),edges:o.edges.map(e=>[e[0],e[1]]),
    holes:o.holes.map(h=>({x:h[0],bot:h[1],r:h[2],k:h[3]})),
    stones:o.stones.map(a=>({x:a[0],y:a[1],r:a[2],p:a[3],o:a[4],node:a[5],big:a[6],hue:a[7]})),
    veg:o.veg.map(a=>({k:a[0],x:a[1],g:a[3]?0.08:a[2],h:0,wat:a[4]})),heave:o.heave.slice(),
    found:Object.assign({},o.found),water:o.water?{x:o.water[0],y:o.water[1],found:o.water[2]}:null,
    train:null,lowRev:(o.found.deep||o.found.train)?1:0,worms:[]};
  s.worms=o.worms.map((a,i)=>{const w=mkWorm(i,{x:a.kx,y:a.ky,tmax:a.tm},a.kx+Math.cos(a.td));
    w.tailDir=a.td;
    if(a.s==='knot'){w.loosen=Math.min(a.lo,a.tm-0.01);w.popped=Math.min(a.pp,Math.floor(w.loosen));w.wake=w.popped/w.tmax*0.8;}
    else{w.state=a.s==='train'?'train':'free';w.hx=a.hx;w.hy=a.hy;w.trail=a.tr.map(p=>({x:p[0],y:p[1]}));w.freedAt=a.fa;w.wake=1;w.trailMax=40;w.loosen=w.tmax;w.popped=w.tmax;}
    return w;});
  if(o.train){s.train={order:o.train.slice(),t0:-10,attach:false};const lead=s.worms[o.train[0]];lead.trailMax=s.worms.reduce((a,w)=>a+w.b.len+0.4,0)+4;}
  return s;
}
function loadSaved(){
  if(Q.get('fresh')==='1'||Q.get('seed'))return null;
  let raw=null;
  try{raw=localStorage.getItem(SKEY);}catch(e){G.memOnly=true;return null;}
  if(!raw)return null;
  try{const o=JSON.parse(raw);if(validate(o)){const s=fromSave(o);return s;}}catch(e){}
  try{localStorage.removeItem(SKEY);}catch(e){}
  G.loadRejected=true;
  return null;
}
function adopt(s){
  S=s;computeHP(S);rebuildIndex();
  for(const w of S.worms){if(w.state==='free'||w.state==='train'){w.sl=nearestNode(w.hx,w.hy,3,-1);w.pb=w.sl>=0?w.sl:null;w.pa=null;}}
  G.ev=[];G.parts=[];G.fly=[];G.wave=null;G.pair=null;G.lastHit={};G.lowAnim=0;G.flash=0;G.ring=null;
  layout();
}
function newField(keep){
  const gd=gridFor();
  const sq=Q.get('seed');let seed=(!keep&&sq&&/^\d+$/.test(sq))?(+sq>>>0):((Date.now()*2654435761)^(Math.random()*4294967295))>>>0;
  const k=keep&&S?{cycle:S.cycle,heap:S.heap}:null;
  const s=genField(seed,gd.C,gd.R,k);
  adopt(s);S.dirty=true;
}

// ====================================================================
//  ループ
// ====================================================================
function frame(ts){
  G.raf=requestAnimationFrame(frame);
  const dt=clamp((ts-G.last)/1000,0,0.05);G.last=ts;
  try{
    if(G.needLayout)layout();
    if(!G.frozen){G.time+=dt;update(dt);}render();
    if(G.firstTap&&!G.firstTap.drawn)G.firstTap.drawn=performance.now();
  }catch(e){if(!G.errOnce){G.errOnce=1;G.err=String(e&&e.stack||e);}}
}
function start(){if(G.running)return;G.running=true;G.last=performance.now();G.raf=requestAnimationFrame(frame);}
function stop(){G.running=false;cancelAnimationFrame(G.raf);}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stop();if(P)endPointer(true);if(S&&S.dirty)save();try{if(A.ctx&&A.ctx.state==='running')A.ctx.suspend();}catch(e){}}
  else{try{if(A.ctx)A.ctx.resume().catch(()=>{});}catch(e){}start();}
});
window.addEventListener('pagehide',()=>{if(S)save();});
let rzT=0;
window.addEventListener('resize',()=>{if(P)endPointer(true);G.needLayout=true;});
window.addEventListener('orientationchange',()=>{G.needLayout=true;});

const saved=loadSaved();
if(saved){adopt(saved);G.restored=true;}else newField(false);
start();

// 自動検査用の参照（画面には何も出ない）
window.__srrn={get S(){return S;},get P(){return P;},G,X,Y,knotGeom,trainPts,bodyPts,pickFocus,SKEY,
  scr:(x,y)=>[X(x),Y(y)],audio:()=>A.ctx?A.ctx.state:"none",freeze:f=>{G.frozen=!!f;},hpTop,hpBot,typeAt,vegBody,serialize,validate};
})();
