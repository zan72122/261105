<canvas id="c"></canvas>
<div id="sa"></div>
<script>
/*
 びろーん！つぶつぶピザのかくれんぼ食卓
 設計メモ（文字はUIに出さない）
  触る理由 : 生地の端がぷくっと跳ね、家族が具の容器を見ている。
  即時反応 : 触れた所がへこみ粒が散って戻る。引けば生地が指についてくる。
  次の試し : 届いた容器から具が落ち音が育つ → 別の方向・長さへ引く → 窯 → 切って配る → 二枚目でクロス。
 画風 : 群青単色背景 + 場面ごとの2色（台所=黄/赤、クロス=白/緑）。全て粒の集合と密度差。
*/
(()=>{
'use strict';
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeOut=t=>{t=clamp(t,0,1);return 1-(1-t)*(1-t)*(1-t);};
const angN=a=>((a%TAU)+TAU)%TAU;
const angD=(a,b)=>{let d=(b-a)%TAU;if(d>PI)d-=TAU;if(d<-PI)d+=TAU;return d;};
const hyp=Math.hypot;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=mulberry(261105);
const rnd=Math.random;

const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});
const saEl=document.getElementById('sa');
let W=1,H=1,DPR=1;

/* ---------------- dot batcher (2 color slots, 8 alpha levels) ---------------- */
const DOT_CAP=3000, BUCK=16, BCAP=3000;
const bx=[],by=[],br=[];const bn=new Int32Array(BUCK);
for(let i=0;i<BUCK;i++){bx.push(new Float32Array(BCAP));by.push(new Float32Array(BCAP));br.push(new Float32Array(BCAP));}
let dotCount=0,maxDots=0;
let camS=1,camCx=0,camCy=0,gA=1;
const colStr=['#fff','#f00'];
function dot(x,y,r,slot,a){
  a*=gA; if(a<0.04||dotCount>=DOT_CAP) return;
  if(camS!==1){x=(x-camCx)*camS+camCx;y=(y-camCy)*camS+camCy;r*=Math.max(0.6,camS);}
  if(x<-12||y<-12||x>W+12||y>H+12) return;
  let lv=(a*8)|0; if(lv>7)lv=7;
  const k=slot*8+lv,n=bn[k]; if(n>=BCAP) return;
  bx[k][n]=x;by[k][n]=y;br[k][n]=r;bn[k]=n+1;dotCount++;
}
function flush(){
  for(let k=0;k<BUCK;k++){
    const n=bn[k]; if(!n) continue;
    ctx.globalAlpha=((k&7)+1)/8; ctx.fillStyle=colStr[k>>3]; ctx.beginPath();
    const X=bx[k],Y=by[k],Rr=br[k];
    for(let i=0;i<n;i++){const r=Rr[i]; if(r<1.15){ctx.rect(X[i]-r,Y[i]-r,r*2,r*2);} else {ctx.moveTo(X[i]+r,Y[i]);ctx.arc(X[i],Y[i],r,0,TAU);}}
    ctx.fill(); bn[k]=0;
  }
  ctx.globalAlpha=1;
}

/* ---------------- palette ---------------- */
const BG='#1c2a88';
const PCREAM=[255,228,128],PGOLD=[255,190,52],PRED=[255,78,64],PWHITE=[242,246,255],PGREEN=[74,214,122];
function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function rgb(c){return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';}

/* ---------------- audio ---------------- */
let AC=null,master=null,musicBus=null,sfxBus=null,noiseBuf=null,ST=null;
const BPM=96,STEP=60/BPM/4,BAR=STEP*16;
let nextStep=0,stepIdx=0;
const PENTA=[0,2,4,7,9];
function pf(idx,base){const o=Math.floor(idx/5),n=((idx%5)+5)%5;return base*Math.pow(2,(PENTA[n]+12*o)/12);}
function initAudio(){
  if(AC){ if(AC.state==='suspended'&&!document.hidden){AC.resume().catch(()=>{});} return; }
  const Ctor=window.AudioContext||window.webkitAudioContext; if(!Ctor) return;
  try{AC=new Ctor();}catch(e){AC=null;return;}
  try{
    master=AC.createGain(); master.gain.value=0.9;
    const comp=AC.createDynamicsCompressor(); comp.threshold.value=-14; comp.knee.value=10; comp.ratio.value=4; comp.attack.value=0.003; comp.release.value=0.2;
    master.connect(comp); comp.connect(AC.destination);
    musicBus=AC.createGain(); musicBus.gain.value=0.6; musicBus.connect(master);
    sfxBus=AC.createGain(); sfxBus.gain.value=0.8; sfxBus.connect(master);
    const len=AC.sampleRate|0; noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
    const nd=noiseBuf.getChannelData(0); for(let i=0;i<len;i++) nd[i]=Math.random()*2-1;
    // continuous stretch voice: rubbery tone + friction noise
    const ns=AC.createBufferSource(); ns.buffer=noiseBuf; ns.loop=true;
    const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=500; bp.Q.value=1.6;
    const ng=AC.createGain(); ng.gain.value=0; ns.connect(bp); bp.connect(ng); ng.connect(sfxBus); ns.start();
    const o=AC.createOscillator(); o.type='triangle'; o.frequency.value=140;
    const og=AC.createGain(); og.gain.value=0; o.connect(og); og.connect(sfxBus); o.start();
    ST={ng,bp,o,og};
    for(const m of fam) setupBus(m);
    const b=AC.createBuffer(1,1,22050), s=AC.createBufferSource(); s.buffer=b; s.connect(AC.destination); s.start(0);
    if(AC.state==='suspended') AC.resume().catch(()=>{});
    nextStep=AC.currentTime+0.08; stepIdx=0;
  }catch(e){AC=null;}
}
function setupBus(m){ if(!AC) return; m.bus=AC.createGain(); m.bus.gain.value=1; m.lp=AC.createBiquadFilter(); m.lp.type='lowpass'; m.lp.frequency.value=6000; m.bus.connect(m.lp); m.lp.connect(musicBus); }
function aOK(){return AC&&AC.state==='running';}
function aNow(){return aOK()?AC.currentTime:G.time;}
function stepPos(){ if(aOK()) return stepIdx-(nextStep-AC.currentTime)/STEP; return G.time/STEP; }
function env(g,t,a,p,d){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,p),t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);}
function tone(type,f,t,d,p,dest,a,f2){
  if(!aOK())return; a=a||0.004;
  const o=AC.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+a+d);
  const g=AC.createGain(); env(g,t,a,p,d); o.connect(g); g.connect(dest||sfxBus); o.start(t); o.stop(t+a+d+0.03);
}
function nz(t,d,p,type,f,q,dest,f2){
  if(!aOK())return;
  const s=AC.createBufferSource(); s.buffer=noiseBuf;
  const fl=AC.createBiquadFilter(); fl.type=type; fl.frequency.setValueAtTime(f,t); if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t+d); fl.Q.value=q||1;
  const g=AC.createGain(); env(g,t,0.003,p,d); s.connect(fl); fl.connect(g); g.connect(dest||sfxBus);
  s.start(t,Math.random()*Math.max(0,0.95-d)); s.stop(t+d+0.05);
}
const tn=()=>AC?AC.currentTime+0.004:0;
/* sfx (immediate, unquantized) */
const S={
  poke(th){const t=tn(),f=330*(1.35-0.3*th);tone('sine',f,t,0.12,0.3,null,0.003,f*0.55);nz(t,0.05,0.05,'lowpass',900,1);},
  release(L){const t=tn(),f=90+L*30;tone('sine',f*1.6,t,0.22,0.22,null,0.004,f*0.7);tone('triangle',f,t+0.06,0.16,0.08,null,0.004,f*1.3);},
  landTom(th){const t=tn();tone('sine',220*(1.2-0.2*th),t,0.09,0.32,null,0.002,110);nz(t,0.04,0.08,'lowpass',700,1);},
  landCorn(){const t=tn(),f=1800+rnd()*500;tone('sine',f,t,0.06,0.1,null,0.002);tone('sine',f*1.5,t,0.04,0.04,null,0.002);},
  miss(){const t=tn();tone('triangle',300,t,0.08,0.08,null,0.003,240);},
  pon(th){const t=tn(),f=300+60*(th-1);tone('sine',f,t,0.2,0.5,null,0.002,80);nz(t,0.08,0.15,'lowpass',1200,1,null,300);},
  pari(){const t=tn();for(let i=0;i<5;i++)nz(t+i*0.022+rnd()*0.01,0.018,0.16,'highpass',3500+rnd()*3000,1);},
  sizzle(){const t=tn();nz(t,0.6,0.06,'highpass',4500,0.7);tone('sine',140,t,0.5,0.06,null,0.05,220);},
  cut(){const t=tn();nz(t,0.17,0.25,'bandpass',2500,2,null,8000);tone('sine',1200,t,0.08,0.05,null,0.003,2400);},
  pick(){const t=tn();tone('sine',420,t,0.08,0.18,null,0.003,640);},
  whoosh(){const t=tn();nz(t,0.3,0.1,'bandpass',500,1.5,null,2200);},
  chime(){const t=tn();tone('sine',1046.5,t,0.5,0.16,null,0.003);tone('sine',1318.5,t+0.07,0.5,0.14,null,0.003);tone('sine',1568,t+0.14,0.6,0.12,null,0.003);},
  munch(){const t=tn();tone('sine',170,t,0.07,0.15,null,0.003,120);nz(t,0.05,0.05,'lowpass',600,1);},
  hop(){const t=tn();tone('sine',500,t,0.14,0.2,null,0.003,1300);},
  cloth(){const t=tn();nz(t,1.0,0.16,'lowpass',300,0.8,null,3000);[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone('sine',f,t+0.1+i*0.09,0.9,0.08,null,0.01));},
  reveal(){const t=tn();[784,1046.5,1318.5,1568].forEach((f,i)=>tone('sine',f,t+i*0.06,0.4,0.12,null,0.003));},
  knock(f){const t=tn();tone('triangle',f||700,t,0.05,0.12,null,0.002,(f||700)*0.8);},
  blip(m){const t=tn();const f=m.k.base*2;tone('sine',f,t,0.12,0.1,null,0.01,f*1.25);},
  poof(){const t=tn();nz(t,0.25,0.14,'lowpass',900,1,null,250);tone('sine',260,t,0.18,0.18,null,0.004,150);},
  rustle(v){const t=tn();nz(t,0.12,0.04+0.08*v,'bandpass',1500+v*1500,0.8);},
  wake(){const t=tn();tone('sine',784,t,0.25,0.06,null,0.01);tone('sine',1174.7,t+0.05,0.3,0.05,null,0.01);}
};
function stretchSound(speed,L,on){
  if(!aOK()||!ST) return; const t=AC.currentTime;
  const v=on?clamp(speed*0.0006,0,0.22):0;
  ST.ng.gain.setTargetAtTime(v,t,0.03); ST.bp.frequency.setTargetAtTime(350+L*260,t,0.05);
  ST.og.gain.setTargetAtTime(on?clamp(0.02+speed*0.00012,0,0.07):0,t,0.04);
  ST.o.frequency.setTargetAtTime(110+L*55,t,0.05);
}
/* music voices */
function mTom(t,v,acc){tone('sine',acc?150:130,t,0.28,0.55*v,musicBus,0.002,52);nz(t,0.03,0.12*v,'lowpass',1500,1,musicBus);}
function mBell(t,f,v){tone('sine',f,t,0.6,v,musicBus,0.002);tone('sine',f*2.76,t,0.18,v*0.35,musicBus,0.002);}
function mBass(t,f){tone('triangle',f,t,0.42,0.3,musicBus,0.01);tone('sine',f*2,t,0.3,0.08,musicBus,0.01);}
function mPon(t){tone('sine',240,t,0.16,0.3,musicBus,0.002,90);}
function mShake(t,v){nz(t,0.04,0.05*v,'highpass',6500,0.8,musicBus);}
function mClap(t){nz(t,0.05,0.16,'bandpass',1300,1.5,musicBus);nz(t+0.012,0.05,0.12,'bandpass',1100,1.5,musicBus);}
function mVoice(m,f,t,dur,loud){
  if(!aOK()||!m.bus) return;
  if(loud){
    const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(f*0.97,t); o.frequency.exponentialRampToValueAtTime(f,t+0.05);
    const lfo=AC.createOscillator(); lfo.frequency.value=5.2+m.i*0.4; const lg=AC.createGain(); lg.gain.value=f*0.013; lfo.connect(lg); lg.connect(o.frequency);
    const f1=AC.createBiquadFilter(); f1.type='bandpass'; f1.frequency.value=m.k.form[0]; f1.Q.value=5;
    const f2=AC.createBiquadFilter(); f2.type='bandpass'; f2.frequency.value=m.k.form[1]; f2.Q.value=7;
    const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.7,t+0.03); g.gain.setValueAtTime(0.7,t+dur*0.65); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(f1); o.connect(f2); f1.connect(g); f2.connect(g); g.connect(m.bus);
    o.start(t); lfo.start(t); o.stop(t+dur+0.02); lfo.stop(t+dur+0.02);
  } else {
    tone('triangle',f,t,dur*0.9,0.07,m.bus,0.04);
  }
  m.notes.push(t,t+dur);
  if(m.notes.length>12) m.notes.splice(0,2);
}
function mGiggle(m,t,v){
  if(!aOK()||!m.bus) return;
  const b=m.k.base*3;
  for(let i=0;i<4;i++){const tt=t+i*0.08,f=b*(1.3-i*0.08);tone('sine',f,tt,0.055,0.16*v,m.bus,0.006,f*0.82);nz(tt,0.045,0.05*v,'bandpass',2400,2,m.bus);}
  m.notes.push(t,t+0.34);
  if(m.notes.length>12) m.notes.splice(0,2);
}

/* ---------------- layout ---------------- */
let LY=null;
function readSafe(){const cs=getComputedStyle(saEl);return{t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}
function layout(){
  W=Math.max(1,window.innerWidth|0); H=Math.max(1,window.innerHeight|0);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); cv.style.width=W+'px'; cv.style.height=H+'px';
  const s=readSafe(); const x0=s.l+4,y0=s.t+4,x1=W-s.r-4,y1=H-s.b-4,w=Math.max(10,x1-x0),h=Math.max(10,y1-y0);
  const portrait=h>=w*1.05;
  const L={x0,y0,x1,y1,w,h,portrait};
  if(portrait){
    L.R0=Math.min(w*0.16,h*0.082); L.C={x:x0+w/2,y:y0+h*0.40}; L.hr=Math.min(w*0.075,h*0.04);
    L.famY=y0+h*0.865; L.plateY=y0+h*0.70; L.seatX=i=>x0+w*(0.14+0.24*i);
  } else {
    L.R0=Math.min(h*0.12,w*0.09); L.C={x:x0+w/2,y:y0+h*0.40}; L.hr=Math.min(h*0.042,w*0.035);
    L.famY=y0+h*0.868; L.plateY=y0+h*0.705; const sp=Math.min(w*0.15,L.R0*1.9); L.seatX=i=>x0+w/2+(i-1.5)*sp;
  }
  L.plateR=L.hr*1.2; L.ds=L.R0/62;
  L.seats=[0,1,2,3].map(i=>({x:L.seatX(i),y:L.famY}));
  L.plates=[0,1,2,3].map(i=>({x:L.seatX(i),y:L.plateY}));
  const C=L.C,R0=L.R0;
  L.table=portrait?{l:x0+4,r:x1-4,t:Math.max(y0+4,C.y-2.95*R0),b:L.plateY+L.plateR+6}
                  :{l:Math.max(x0+4,C.x-4.3*R0),r:Math.min(x1-4,C.x+4.3*R0),t:y0+6,b:L.plateY+L.plateR+8};
  L.contR=R0*0.42; L.ovenR=R0*0.56;
  L.cloth=portrait?{l:x0+w*0.07,r:x1-w*0.07,t:y0+h*0.31,b:y0+h*0.84}:{l:x0+w*0.2,r:x1-w*0.2,t:y0+h*0.27,b:y0+h*0.92};
  L.cloth.w=L.cloth.r-L.cloth.l; L.cloth.h=L.cloth.b-L.cloth.t;
  L.grandTop={x:x0+w/2,y:portrait?y0+h*0.205:y0+h*0.15};
  LY=L;
  buildTable();
  placeObjects(true);
  if(OP) endOp(true);
  for(const d of D.dots){d.x=d.tx||C.x;d.y=d.ty||C.y;}
  for(const m of fam){const p=famTarget(m);m.x=p.x;m.y=p.y;}
}
function slotPos(a,rr){
  const C=LY.C,R0=LY.R0,dx=Math.cos(a),dy=Math.sin(a); let d=2.45*R0; const m=rr+8;
  if(dx>0.01) d=Math.min(d,(LY.x1-m-C.x)/dx);
  if(dx<-0.01) d=Math.min(d,(C.x-LY.x0-m)/-dx);
  if(dy<-0.01) d=Math.min(d,(C.y-LY.y0-m-4)/-dy);
  return {x:C.x+dx*d,y:C.y+dy*d,d};
}
function clothDist(a){
  const T=LY.table,C=LY.C,dx=Math.cos(a),dy=Math.sin(a); let t=1e9;
  if(dx>1e-4)t=Math.min(t,(T.r-C.x)/dx); if(dx<-1e-4)t=Math.min(t,(T.l-C.x)/dx);
  if(dy>1e-4)t=Math.min(t,(T.b-C.y)/dy); if(dy<-1e-4)t=Math.min(t,(T.t-C.y)/dy);
  return t;
}

/* ---------------- templates ---------------- */
function sunflower(n,filter,rad){const out=[];rad=rad||1;for(let i=0;i<n;i++){const r=Math.sqrt((i+0.5)/n)*rad,a=i*2.399963;const x=r*Math.cos(a),y=r*Math.sin(a);if(!filter||filter(x,y))out.push({x,y,s:0.85+0.3*R(),p:R()*TAU});}return out;}
const TPL={};
TPL.bowl=sunflower(60,(x,y)=>y>-0.05);
TPL.ovenDome=sunflower(170,(x,y)=>y<0.5&&!((x*x)/(0.44*0.44)+((y-0.5)*(y-0.5))/(0.66*0.66)<1));
TPL.ovenFire=sunflower(26,null,1).map(p=>({x:p.x*0.32,y:0.5-Math.abs(p.y)*0.5,s:p.s,p:p.p}));
TPL.plateRing=[];for(let i=0;i<26;i++){const a=i/26*TAU;TPL.plateRing.push({x:Math.cos(a)*(0.95+R()*0.08),y:Math.sin(a)*(0.95+R()*0.08)*0.62,s:0.8+R()*0.4});}
TPL.plateIn=sunflower(16).map(p=>({x:p.x*0.72,y:p.y*0.45,s:p.s}));
TPL.mound=[{x:0,y:-0.35},{x:-0.42,y:-0.22},{x:0.42,y:-0.22},{x:-0.2,y:-0.62},{x:0.22,y:-0.6},{x:0,y:-0.85},{x:-0.62,y:-0.05},{x:0.62,y:-0.05},{x:-0.45,y:-0.5},{x:0.45,y:-0.48}];
TPL.hand=(()=>{const a=[];for(let i=0;i<7;i++)a.push({x:1+i*0.4,y:i*3.2,s:1.15});
  sunflower(34).forEach(p=>a.push({x:9+p.x*11,y:30+p.y*10,s:p.s}));
  for(let i=0;i<4;i++)a.push({x:-2-i*1.6,y:26-i*2.6,s:1});
  for(let k=0;k<3;k++)for(let i=0;i<4;i++)a.push({x:9+k*5.4,y:19-i*1.3+k*0.6,s:0.95});

  out.x=s.cx+(x-s.cx)*s.sc+s.ox+s.ghx; out.y=s.cy+(y-s.cy)*s.sc+s.oy+s.ghy;
}
function plateOf(m){return LY.plates[m.seat];}
function updateSlices(dt){
  const ds=LY.ds;
  for(let k=0;k<D.slices.length;k++){
    const s=D.slices[k];
    s.ghx*=Math.exp(-dt*8);s.ghy*=Math.exp(-dt*8);
    const bx=Math.cos(s.bis),by=Math.sin(s.bis);
    if(s.state==='on'||s.state==='back'){
      s.sep=lerp(s.sep,ds*5,Math.min(1,dt*8));
      let hop=0; const tg=G.target; if(tg&&tg.kind==='slice'&&tg.s===s&&!G.demo){const b=(G.time*1.5)%1;hop=b<0.4?Math.sin(b/0.4*PI)*ds*9:0;}
      const tx=bx*(s.sep+hop),ty=by*(s.sep+hop);
      s.vx+=((tx-s.ox)*220-s.vx*18)*dt;s.vy+=((ty-s.oy)*220-s.vy*18)*dt;s.ox+=s.vx*dt;s.oy+=s.vy*dt;s.sc=lerp(s.sc,1,Math.min(1,dt*10));
      if(s.state==='back'&&hyp(s.ox-tx,s.oy-ty)<2)s.state='on';
    } else if(s.state==='carry'){
      s.ox+=(s.gx-s.ox)*Math.min(1,dt*26);s.oy+=(s.gy-s.oy)*Math.min(1,dt*26);s.sc=lerp(s.sc,1.06,Math.min(1,dt*10));
    } else if(s.state==='fly'){
      s.ft+=dt/0.45; const e=easeOut(s.ft);
      s.ox=lerp(s.fx0,s.fxt,e);s.oy=lerp(s.fy0,s.fyt,e)-Math.sin(e*PI)*LY.R0*0.6;s.sc=lerp(s.fs0,s.fst,e);
      if(s.ft>=1){s.state='plate';s.m.queue.push(k);S.chime();G.stats.served++;glog('served slice'+k+' to '+s.m.k.id);
        const pl=plateOf(s.m);for(let i=0;i<8;i++){const a=i/8*TAU;fx(pl.x,pl.y,Math.cos(a)*90,Math.sin(a)*60,0.5,ds*1.6,0,1,0,3);}
        // rare edge bounce onto the neighbour's plate (when nothing left on the board)
        if(!D.slices.some(o=>o.state==='on')&&(rnd()<0.14||API.forceBounce)) bounceToPlate(k);
      }
    } else if(s.state==='plate'){

  }
}
function startCarry(k,p){
  const s=D.slices[k]; s.state='carry'; s.grab={x:p.x-s.ox,y:p.y-s.oy}; s.gx=s.ox; s.gy=s.oy; S.pick();
  OP={type:'carry',k,hist:[[p.x,p.y,performance.now()]]};
  // rare: a topping on the cut edge hops to the neighbouring slice
  const on=D.slices.map((o,i)=>o.state==='on'?i:-1).filter(i=>i>=0);
  if(on.length&&(rnd()<0.14||API.forceBounce)){
    const mine=D.tops.filter(t=>t.slice===k&&t.st==='on');
    if(mine.length){
      let best=null,bd=9,dst=-1,dang=0;
      for(const t of mine){for(const j of on){const o=D.slices[j];for(const edge of [o.a0,o.a0+o.span]){const dd=Math.abs(angD(t.ang,edge));if(dd<bd){bd=dd;best=t;dst=j;dang=edge;}}}}
      if(best){
        const from=toppingPos(best); const o=D.slices[dst];
        const inside=angN(dang-o.a0)<0.01?dang+0.14:dang-0.14;
        best.st='hop';best.ht=0;best.hx=from.x+s.ox;best.hy=from.y+s.oy;best.fromSlice=k;
        best.hdst={ang:inside,u:0.7,slice:dst};S.hop();G.stats.bounces++;glog('edge bounce slice'+k+'->'+dst);
      }
    }
  }
}
function bounceToPlate(k){
  const s=D.slices[k]; const A=s.m;
  const mine=D.tops.filter(t=>t.slice===k&&t.st==='on'); if(!mine.length) return;
  const nb=fam.filter(m=>m!==A).sort((a,b)=>Math.abs(a.seat-A.seat)-Math.abs(b.seat-A.seat))[0];
  const t=mine[0]; const p=toppingPos(t); const q={x:0,y:0}; sliceXY(s,p.x,p.y,q);
  t.st='hopPlate';t.ht=0;t.hx=q.x;t.hy=q.y;t.hdst={m:nb,from:A};S.hop();G.stats.bounces++;glog('edge bounce plate '+A.k.id+'->'+nb.k.id);
}
function choosePlate(p,vx,vy){
  let best=null,bd=1e9;
  for(const m of fam){const pl=plateOf(m);const d=hyp(p.x-pl.x,p.y-pl.y);if(d<bd){bd=d;best=m;}}
  if(bd<LY.plateR*2.8) return best;
  const sp=hyp(vx,vy);
  if(sp>0.3){let ba=0.75,bm=null;for(const m of fam){const pl=plateOf(m);const a=Math.abs(angD(Math.atan2(vy,vx),Math.atan2(pl.y-p.y,pl.x-p.x)));if(a<ba){ba=a;bm=m;}}if(bm)return bm;}
  const rr=D.rPx.reduce((a,b)=>a+b,0)/NBIN;
  if(p.y>LY.C.y+rr*0.9){let bx2=1e9,bm=null;for(const m of fam){const d=Math.abs(plateOf(m).x-p.x);if(d<bx2){bx2=d;bm=m;}}return bm;}
  return null;
}
function sendSlice(k,m){
  const s=D.slices[k]; s.state='fly'; s.m=m; s.ft=0; s.fx0=s.ox; s.fy0=s.oy; s.fs0=s.sc;
  const pl=plateOf(m); s.fst=Math.min(1,LY.plateR*1.15/Math.max(10,s.ext)); s.fxt=pl.x-s.cx; s.fyt=pl.y-s.cy-LY.plateR*0.1; S.whoosh();
}

/* ---------------- family ---------------- */
function famTarget(m){
  const ph=G.phase;
  if(ph==='cloth'||ph==='toCloth'){
    if(m.i===0) return {x:LY.grandTop.x,y:LY.grandTop.y};
    const kd=CL.kids.find(k=>k.m===m); if(kd){const p=clothRest(kd.gx,kd.gy);return {x:p.x,y:p.y};}
  }
  return LY.seats[m.seat];
}
function hrOf(m){return LY.hr*m.k.scale*(G.phase==='cloth'||G.phase==='toCloth'?(m.i===0?1.05:0.9):1);}
function learnSlice(m,comp,small){
  const ph=m.phrase,du=m.pdur,reg=m.k.reg;
  const put=(st,note,dur)=>{for(let k=0;k<3;k++){const s=(st+k)%16;if(ph[s]<0){ph[s]=note;du[s]=dur;return;}}ph[st]=note;du[st]=dur;};
  if(comp.tom>0){const steps=m.i%2?[0,4,8,12]:[0,6,8,14],mel=[0,2,1,3];const n=Math.min(4,Math.ceil(comp.tom/2));for(let k=0;k<n;k++)put(steps[k],reg+mel[k],2);}
  if(comp.corn>0){const steps=[2,10,6,14],mel=[5,7,6,8];const n=Math.min(4,Math.ceil(comp.corn/3));for(let k=0;k<n;k++)put(steps[k],reg+mel[k],1);}
  if(comp.puff>0)put(0,reg+4,4);
  if(comp.crisp>0){put(13,reg+6,1);put(15,reg+7,1);}
  if(!comp.tom&&!comp.corn&&!comp.puff&&!comp.crisp){put(0,reg+2,2);put(8,reg+1,2);put(12,reg+3,2);}
  let cnt=0;for(let i=0;i<16;i++)if(ph[i]>=0)cnt++;
  while(cnt>12){const i=(rnd()*16)|0;if(ph[i]>=0&&i%4){ph[i]=-1;cnt--;}}
  m.ate.tom+=comp.tom;m.ate.corn+=comp.corn;m.ate.puff+=comp.puff;m.ate.crisp+=comp.crisp;
  const sc=[['bounce',comp.tom],['sway',comp.corn],['jump',comp.puff*1.5],['shimmy',comp.crisp*1.5]].sort((a,b)=>b[1]-a[1]);
  m.dance=sc[0][1]>0?sc[0][0]:'nod';
  m.hasSong=true; m.glow=1; m.danceAmt=1; m.loudUntil=aNow()+BAR*2; m.served++;
  if(!small){const hr=hrOf(m);for(let i=0;i<10;i++){const a=-PI/2+(rnd()-0.5)*1.6;fx(m.x,m.y-hr,Math.cos(a)*80,Math.sin(a)*80,0.9,LY.ds*1.6,0,1,-20,1);}}
  glog('sing '+m.k.id+' dance='+m.dance+' notes='+cnt+' comp='+JSON.stringify(comp));
}
function startDuet(A,B){
  if(!A||!B||A===B) return;
  const until=aNow()+BAR*2;
  A.duet=B.i;A.duetUntil=until;B.duet=A.i;B.duetUntil=until;A.loudUntil=Math.max(A.loudUntil,until);B.loudUntil=Math.max(B.loudUntil,until);
  A.danceAmt=B.danceAmt=1; A.glow=B.glow=1; G.stats.duets++; glog('duet '+A.k.id+'+'+B.k.id); S.reveal();
}
function updateFamily(dt){
  for(const m of fam){
    const p=famTarget(m); const sp=G.phase==='kitchen'?5:3.2;
    m.x+=(p.x-m.x)*Math.min(1,dt*sp); m.y+=(p.y-m.y)*Math.min(1,dt*sp);
    m.glow=Math.max(0,m.glow-dt*0.35); m.danceAmt=Math.max(0,m.danceAmt-dt*0.12); m.wig=Math.max(0,m.wig-dt*2.2); m.pop=Math.max(0,m.pop-dt*2);
    m.blink-=dt; if(m.blink<-0.13) m.blink=2+rnd()*3.5;
    m.beckon=lerp(m.beckon,(G.target&&G.target.kind==='slice'&&G.target.m===m)?1:0,Math.min(1,dt*5));
    if(m.eating===null&&m.queue.length){const k=m.queue.shift();m.eating=k;m.eatT=0;D.slices[k].state='eating';}
    if(m.eating!==null){
      const s=D.slices[m.eating]; const prev=m.eatT; m.eatT+=dt/1.2;
      for(const tt of [0.2,0.5,0.8]) if(prev<tt&&m.eatT>=tt) S.munch();
      if(m.eatT>=1){
        const comp=sliceComp(m.eating); s.state='eaten';
        let partner=null;
        for(const t of D.tops){
          if(t.slice===m.eating&&t.st==='on'){ if(t.fromMember>=0&&t.fromMember!==m.i) partner=fam[t.fromMember]; t.st='gone'; }
          if(t.fromSlice===m.eating&&t.st!=='gone') t.fromMember=m.i;
        }
        learnSlice(m,comp,false); m.eating=null;
        if(partner) startDuet(partner,m);
      }
    }
    if(m.lp&&AC){const want=m.muffle?650:6000;m.lp.frequency.setTargetAtTime(want,AC.currentTime,0.1);}
  }
}

/* ---------------- music scheduler ---------------- */
const BELL_MEL=[[0,2,3,2],[4,3,2,0],[4,5,4,3],[3,1,3,6]];
const ROOTS=[0,9,5,7];
function boardCounts(){
  let tom=0,corn=0,puff=0,crisp=0;
  for(const t of D.tops){if(t.st!=='on')continue;const s=t.slice>=0?D.slices[t.slice]:null;if(!s||s.state==='on'||s.state==='carry'||s.state==='back'){if(t.kind==='tomato')tom++;else corn++;}}
  for(let i=0;i<NBIN;i++){if(!D.bakeEv[i])continue;const k=D.binSlice[i];const s=k>=0&&D.slices.length?D.slices[k]:null;if(!s||s.state==='on'||s.state==='carry'||s.state==='back'){if(D.puffT[i]>0)puff++;if(D.crisp[i])crisp++;}}
  return{tom,corn,puff,crisp};
}
let BCNT={tom:0,corn:0,puff:0,crisp:0};
function playStep(i,t){
  const s=i%16,bar=Math.floor(i/16),root=ROOTS[bar%4];const B=BCNT;
  if(G.bass){if(s===0||s===8)mBass(t,65.41*Math.pow(2,root/12));if(s===12&&bar%2)mBass(t,65.41*Math.pow(2,(root+7)/12));}
  const tomFirst=D.order[0]!=='corn';
  if(B.tom>0){
    const pat=tomFirst?[0,4,8,12]:[0,3,6,8,11,14];
    const v=0.35+0.45*Math.min(1,B.tom/8);
    if(pat.indexOf(s)>=0){mTom(t,v,s===0);PUL.tom.n=t;}
    else if(B.tom>=8&&tomFirst&&(s===14||s===15)){mTom(t,v*0.4,false);}
  }
  if(B.corn>0){
    const v=0.07+0.07*Math.min(1,B.corn/10);
    if(!tomFirst){const steps=[0,4,8,12],j=steps.indexOf(s);if(j>=0){mBell(t,pf(BELL_MEL[bar%4][j],523.25),v);PUL.bell.n=t;}}
    else{const steps=[2,6,10,14],j=steps.indexOf(s);if(j>=0){mBell(t,pf(2+((j+bar)%4),523.25),v*0.9);PUL.bell.n=t;}else if(B.corn>=10&&s===15){mBell(t,pf(6,523.25),v*0.6);}}
  }
  if(B.puff>0&&(s===0||s===10)){mPon(t);PUL.pon.n=t;}
  if(B.crisp>0&&s%2===1){mShake(t,0.6+0.4*Math.min(1,B.crisp/8));PUL.shake.n=t;}
  for(const m of fam){
    if(!m.hasSong) continue;
    const loud=t<m.loudUntil;
    const n=m.phrase[s];
    if(n>=0) mVoice(m,pf(n,m.k.base),t,STEP*m.pdur[s]*0.95,loud);
    if(m.duet>=0&&t<m.duetUntil){const pn=fam[m.duet].phrase[s];if(pn>=0&&n<0)mVoice(m,pf(pn+2,m.k.base),t,STEP*fam[m.duet].pdur[s]*0.9,true);}
  }
  // giggles mixed into the song
  if(s===14&&bar%2===1){for(const m of fam){if(m.i===0)continue;const kd=CL.kids.find(k=>k.m===m);
    if(G.phase==='cloth'&&kd&&!kd.found&&kd===CL.kids.find(k=>!k.found)) mGiggle(m,t,0.45);
    else if(t<G.laughUntil&&kd&&kd.found) mGiggle(m,t,0.7);}}
  if(fam.every(m=>m.hasSong)&&(s===4||s===12)){mClap(t);PUL.clap.n=t;}
}
function schedule(){
  if(!aOK()) return;
  const now=AC.currentTime;
  if(nextStep<now-0.05){const skip=Math.ceil((now+0.03-nextStep)/STEP);nextStep+=skip*STEP;stepIdx+=skip;}
  while(nextStep<now+0.12){playStep(stepIdx,nextStep);nextStep+=STEP;stepIdx++;}
  for(const k in PUL){const p=PUL[k];if(p.n<=now&&p.n>p.l)p.l=p.n;}
}

/* ---------------- effects ---------------- */
const FX=[],FX_CAP=240;
function fx(x,y,vx,vy,life,r,slot,a,g,drag){if(FX.length>=FX_CAP)return;FX.push({x,y,vx,vy,life,max:life,r,slot,a,g:g||0,dr:drag||0});}
function updateFX(dt){for(let i=FX.length-1;i>=0;i--){const f=FX[i];f.life-=dt;if(f.life<=0){FX[i]=FX[FX.length-1];FX.pop();continue;}f.vy+=f.g*dt;const k=Math.exp(-f.dr*dt);f.vx*=k;f.vy*=k;f.x+=f.vx*dt;f.y+=f.vy*dt;}}
function drawFX(){for(const f of FX){const t=f.life/f.max;dot(f.x,f.y,f.r*(0.6+0.4*t),f.slot,f.a*t);}}

/* ---------------- cloth (hide and seek) ---------------- */
const CL={corners:[],kids:[],dots:[],polka:[],allT:-1,ghost:null,grab:-1};
function clothRest(gx,gy){const c=LY.cloth;return{x:c.l+gx*c.w,y:c.t+gy*c.h};}
function clothW(c,gx,gy){const a=Math.abs(gx-c.gx),b=Math.abs(gy-c.gy);const sa=0.16+0.52*c.ux*c.ux,sb=0.16+0.52*c.uy*c.uy;const qa=a/sa,qb=b/sb;return Math.exp(-(qa*qa+qb*qb));}
function clothAmt(vx,vy){return Math.min(1,hyp(vx,vy)/(0.3*Math.min(LY.cloth.w,LY.cloth.h)));}
function clothSetup(){
  CL.corners=[[0,0],[1,0],[0,1],[1,1]].map(([gx,gy])=>({gx,gy,vx:0,vy:0,cvx:0,cvy:0,ux:0.707,uy:0.707,amt:0,grabbed:false,gs:{x:0,y:0},wig:0}));
  const order=[0,1,2,3].sort(()=>rnd()-0.5); const modes=['h','v','d'].sort(()=>rnd()-0.5);
  CL.kids=[1,2,3].map((mi,j)=>{const ci=order[j],c=CL.corners[ci],mode=modes[j];
    const ab=mode==='h'?[0.36,0.1]:mode==='v'?[0.1,0.36]:[0.16,0.16];
    return {m:fam[mi],corner:ci,mode,gx:c.gx?1-ab[0]:ab[0],gy:c.gy?1-ab[1]:ab[1],reveal:0,hold:0,found:false,emptyHint:0};});
  CL.empty=order[3]; CL.allT=-1; CL.ghost=null; CL.grab=-1;
  const n=Math.min(innerWidth,innerHeight)<500?1150:1350; CL.dots=[]; const cols=Math.round(Math.sqrt(n*LY.cloth.w/LY.cloth.h)); const rows=Math.ceil(n/cols);
  for(let i=0;i<n;i++){const cx=i%cols,cy=(i/cols)|0;CL.dots.push({gx:clamp((cx+0.2+R()*0.6)/cols,0,1),gy:clamp((cy+0.2+R()*0.6)/rows,0,1),sx:0,sy:0,stg:R(),sz:0.8+R()*0.4,ph:R()*TAU,x:0,y:0});}
}
function clothPos(gx,gy,out){
  const c=LY.cloth; let x=c.l+gx*c.w,y=c.t+gy*c.h,lift=0;
  for(let k=0;k<4;k++){
    const cn=CL.corners[k]; let vx=cn.vx,vy=cn.vy;
    if(CL.ghost&&CL.ghost.k===k){vx+=CL.ghost.vx;vy+=CL.ghost.vy;}
    if(cn.wig>0){vx+=Math.sin(G.time*30)*cn.wig*6;vy+=Math.cos(G.time*26)*cn.wig*4;}
    if(Math.abs(vx)+Math.abs(vy)<0.3) continue;
    const w=clothW(cn,gx,gy); if(w<0.004) continue;
    const amt=clothAmt(vx,vy);
    x+=vx*w; y+=vy*w-w*amt*c.h*0.05;
    const l=hyp(vx,vy)+1e-3,px=-vy/l,py=vx/l,wr=Math.sin((Math.abs(gx-cn.gx)+Math.abs(gy-cn.gy))*22-G.time*2)*w*(1-w)*amt*LY.R0*0.16;
    x+=px*wr; y+=py*wr; lift+=w*amt;
  }
  out.x=x;out.y=y;out.lift=Math.min(1,lift);
}
function updateCloth(dt){
  for(const cn of CL.corners){
    if(!cn.grabbed){cn.cvx+=(-cn.vx*55-cn.cvx*6.5)*dt;cn.cvy+=(-cn.vy*55-cn.cvy*6.5)*dt;cn.vx+=cn.cvx*dt;cn.vy+=cn.cvy*dt;}
    cn.amt=clothAmt(cn.vx,cn.vy); cn.wig=Math.max(0,cn.wig-dt*1.5);
  }
  const tg=G.target;
  if(tg&&tg.kind==='corner'&&!G.demo&&CL.grab<0){const cn=CL.corners[tg.corner];const b=(G.time*1.4)%1;if(b<0.25)cn.wig=Math.max(cn.wig,0.5);}
  let foundNow=0;
  for(const kd of CL.kids){
    let rv=0; for(const cn of CL.corners){rv=Math.max(rv,clothW(cn,kd.gx,kd.gy)*cn.amt);}
    kd.reveal=rv;
    if(!kd.found){
      if(rv>0.48){kd.hold+=dt;if(kd.hold>0.1)findKid(kd);}else kd.hold=Math.max(0,kd.hold-dt);
      kd.m.muffle=true;
    } else {kd.m.muffle=false;foundNow++;}
    kd.emptyHint=Math.max(0,kd.emptyHint-dt);
  }
  const ce=CL.corners[CL.empty];
  if(ce&&ce.amt>0.6&&!ce.hinted){ce.hinted=true;for(const kd of CL.kids)if(!kd.found){kd.emptyHint=1;}const k=CL.kids.find(k=>!k.found);if(k)mGiggle(k.m,tn(),0.6);}
  if(ce&&ce.amt<0.2)ce.hinted=false;
  if(foundNow===3&&CL.allT<0){CL.allT=G.time;G.laughUntil=aNow()+BAR*4;for(const m of fam){m.loudUntil=aNow()+BAR*2;m.danceAmt=1;m.wig=1;}S.chime();glog('all found');}
  if(CL.allT>=0&&G.time-CL.allT>3.4&&CL.grab<0) startFromCloth();
}
function findKid(kd){
  kd.found=true; kd.m.pop=1; kd.m.wig=1; kd.m.muffle=false; G.stats.found++; G.laughUntil=aNow()+BAR*4;
  S.reveal(); mGiggle(kd.m,tn()+0.05,1); fam[0].wig=1;
  const p=clothRest(kd.gx,kd.gy);
  for(let i=0;i<12;i++){const a=i/12*TAU;fx(p.x,p.y,Math.cos(a)*120,Math.sin(a)*120,0.6,LY.ds*1.8,0,1,0,3);}
  glog('found '+kd.m.k.id+' mode='+kd.mode);
}
function startCloth(){
  endOp(true);
  G.phase='toCloth'; G.phaseT=0; G.clothThisRound=true; G.stats.cloths++; glog('cloth!');
  clothSetup();
  for(let i=0;i<CL.dots.length;i++){const d=D.dots[i%D.dots.length];CL.dots[i].sx=d.x;CL.dots[i].sy=d.y;}
  CL.polka=D.tops.filter(t=>t.st==='on').map(t=>{const p=toppingPos(t);return{sx:p.x,sy:p.y,gx:0.08+R()*0.84,gy:0.08+R()*0.84,kind:t.kind};});
  S.cloth();
  for(const m of fam) m.wig=1;
}
function startFromCloth(){
  G.phase='fromCloth'; G.phaseT=0;
  const tmp={x:0,y:0};

}

function checkRoundEnd(dt){

/* ---------------- guidance ---------------- */
function computeTarget(){
  if(G.phase==='cloth'){const k=CL.kids.find(k=>!k.found);return k?{kind:'corner',corner:k.corner,kid:k}:null;}
  if(G.phase!=='kitchen') return null;
  const C=LY.C;
  if(D.state==='raw'){
    if(G.round>=2&&G.round%2===0&&!G.clothThisRound){const a=PI/2;return{kind:'nub',ang:a,dest:{x:C.x,y:C.y+clothDist(a)},dk:'edge'};}
    const f=G.cfg.first,s2=f==='tomato'?'corn':'tomato';
    for(const k of [f,s2]){const c=cont[k];if(D.caught[k]<3&&c.stock>0)return{kind:'nub',ang:c.a,dest:c,dk:k};}
    return{kind:'nub',ang:oven.a,dest:oven,dk:'oven'};
  }
  if(D.state==='baking') return null;
  if(!D.slices.length) return{kind:'pizza'};
  const on=D.slices.filter(s=>s.state==='on'); if(!on.length) return null;
  let bs=on[0],bc=-1; for(const s of on){const k=D.slices.indexOf(s);const c=D.tops.filter(t=>t.slice===k&&t.st==='on').length;if(c>bc){bc=c;bs=s;}}
  let bm=fam[0]; for(const m of fam){if(m.served<bm.served||(m.served===bm.served&&m.i<bm.i))bm=m;}
  return{kind:'slice',s:bs,m:bm};
}
function gazePoint(m){

  if(m.eating!==null) return plateOf(m);
  if(OP&&OP.type==='carry'){const s=D.slices[OP.k];return{x:s.cx+s.ox,y:s.cy+s.oy};}
  if(tg){ if(tg.kind==='nub') return tg.dest; if(tg.kind==='slice'){return{x:tg.s.cx+tg.s.ox,y:tg.s.cy+tg.s.oy};} }

}
function startDemo(op){

}

function updateDemo(dt){
  if(!G.demo){

    let L=base,hand,press=0,al=1;

  } else if(dm.op==='carry'){

    else if(dm.t<0.7){hand={x:sx,y:sy};press=(dm.t-0.5)/0.2;}
    else if(dm.t<1.8){const e=ease((dm.t-0.7)/1.1);hand={x:lerp(sx,pl.x,e),y:lerp(sy,pl.y,e)};press=1;s.ghx=(hand.x-sx)*0.3;s.ghy=(hand.y-sy)*0.3;}
    else if(dm.t<2.3){al=1-ease((dm.t-1.8)/0.5);hand={x:pl.x,y:pl.y};}
    else {cancelDemo();return;}

  } else if(dm.op==='corner'){
    if(G.phase!=='cloth'){cancelDemo();return;}
    const kd=tg.kid,cn=CL.corners[kd.corner];const p0=clothRest(cn.gx,cn.gy);
    const sx=cn.gx?-1:1,sy=cn.gy?-1:1,dl=Math.min(LY.cloth.w,LY.cloth.h)*0.32;
    const dir=kd.mode==='h'?{x:sx,y:0}:kd.mode==='v'?{x:0,y:sy}:{x:sx*0.707,y:sy*0.707};

    else {cancelDemo();return;}
    if(dm.t>=0.7){CL.ghost={k:kd.corner,vx:dir.x*dl*e,vy:dir.y*dl*e};cn.ux=Math.abs(dir.x);cn.uy=Math.abs(dir.y);hand={x:p0.x+dir.x*dl*e,y:p0.y+dir.y*dl*e};}

}

/* ---------------- input ---------------- */
let OP=null, activeId=null;
function P(e){return{x:e.clientX,y:e.clientY};}
function onDown(e){
  e.preventDefault();

  const p=P(e);
  if(!G.woke){G.woke=true;G.wake=1;for(let i=0;i<NBIN;i++)D.wobV[i]+=1.2*Math.sin(i*0.5);for(const m of fam)m.wig=0.5;S.wake();}
  if(activeId!==null){ return; }
  activeId=e.pointerId; try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const C=LY.C;
  if(G.phase==='cloth'){clothDown(p);return;}
  if(G.phase!=='kitchen'){return;}
  const ang=Math.atan2(p.y-C.y,p.x-C.x),dist=hyp(p.x-C.x,p.y-C.y),rr=interp(D.rPx,ang);
  const onDough=dist<=rr+Math.max(30,LY.R0*0.4);
  if(D.state==='raw'){
    if(onDough){poke(p,dist<rr?0.75:0.45);OP={type:'stretch',sx:p.x,sy:p.y,sd:Math.max(0.2,dist/LY.R0),lobe:null,moved:false,lx:p.x,ly:p.y,lt:performance.now(),speed:0};return;}
    tapOther(p);return;
  }
  if(D.state==='baking'){ if(onDough) poke(p,0.5); else tapOther(p); return; }
  if(D.state==='baked'){
    const inside=dist<=rr+24;
    const canCut=D.cuts.length<6&&D.slices.every(s=>s.state==='on');
    const grab=canCut?dist<=rr*0.92:inside;
    if(D.slices.length>=2&&grab){const k=sliceOf(ang);if(D.slices[k].state==='on'){startCarry(k,p);return;}}
    if(canCut&&(inside||dist<rr+LY.R0*1.6)){OP={type:'cut',sx:p.x,sy:p.y,minD:dist,lx:p.x,ly:p.y,done:false};if(inside)poke(p,0.35);return;}

}
function segDist(px,py,ax,ay,bx2,by2){const vx=bx2-ax,vy=by2-ay;const l=vx*vx+vy*vy;let t=l>0?((px-ax)*vx+(py-ay)*vy)/l:0;t=clamp(t,0,1);return hyp(ax+vx*t-px,ay+vy*t-py);}
function onMove(e){

  if(OP.type==='stretch'){
    const dt=Math.max(1,now-OP.lt); const sp=hyp(p.x-OP.lx,p.y-OP.ly)/dt*1000; OP.speed=lerp(OP.speed,sp,0.4); OP.lx=p.x;OP.ly=p.y;OP.lt=now;
    if(!OP.moved){if(hyp(p.x-OP.sx,p.y-OP.sy)<7)return;OP.moved=true;
      const a0=Math.atan2(OP.sy-C.y,OP.sx-C.x);let best=null,bd=0.4;
      for(const lb of D.lobes){const d=Math.abs(angD(lb.a,a0));if(d<bd){bd=d;best=lb;}}
      if(!best){ if(D.lobes.length>=7){D.lobes.sort((a,b)=>a.L-b.L);D.lobes.shift();}
        best={a:a0,at:a0,L:realR(a0),Lt:realR(a0),v:0,w:0.6,thick:1,held:true};D.lobes.push(best);}
      best.held=true; OP.lobe=best; OP.grabOff=Math.max(0,best.L-OP.sd);
    }
    const lb=OP.lobe; const fd=hyp(p.x-C.x,p.y-C.y)/R0, ang=Math.atan2(p.y-C.y,p.x-C.x);
    lb.at=ang;
    const off=OP.grabOff*clamp(1-(fd-OP.sd)/1.0,0,1);
    lb.Lt=clamp(fd+off,1,stretchCap(ang));
    stretchSound(OP.speed,lb.L,true);
    if(rnd()<0.25){const tp={x:C.x+Math.cos(lb.a)*lb.L*R0,y:C.y+Math.sin(lb.a)*lb.L*R0};fx(tp.x,tp.y,(rnd()-0.5)*40,(rnd()-0.5)*40,0.3,LY.ds*1.2,0,0.7,0,3);}
    // big stretch to the table edge on the 2nd dough and later -> tablecloth

  } else if(OP.type==='cut'){
    const d=segDist(C.x,C.y,OP.lx,OP.ly,p.x,p.y); OP.minD=Math.min(OP.minD,d);
    OP.lx=p.x;OP.ly=p.y;
    if(rnd()<0.7)fx(p.x,p.y,(rnd()-0.5)*30,(rnd()-0.5)*30,0.35,LY.ds*1.3,0,1,0,2);
    S.rustle&&rnd()<0.1&&S.rustle(0.3);

  } else if(OP.type==='carry'){

    OP.hist.push([p.x,p.y,now]); while(OP.hist.length>2&&now-OP.hist[0][2]>90)OP.hist.shift();

    const cn=CL.corners[OP.k]; let vx=p.x-cn.gs.x,vy=p.y-cn.gs.y; const ml=Math.min(LY.cloth.w,LY.cloth.h)*0.7,l=hyp(vx,vy);

  }
}
function onUp(e){

function endOp(cancel,p){

    if(op.lobe){const lb=op.lobe;lb.held=false;lb.Lt=1+(lb.Lt-1)*0.95;S.release(lb.L);

  } else if(op.type==='cut'){

function clothDown(p){

function drawMember(m,x,y,hr,o){

    for(const sd of [-1,1]){const ang=sd<0?o.armL:o.armR;const sx=x+sd*0.72*hr,sy=y+1.35*hr;
      for(let i=1;i<=6;i++){const l=i/6*1.15*hr;dot(sx+sd*Math.sin(ang)*l,sy+Math.cos(ang)*l,ds*1.2,0,a*0.8);}}

      if(grand){ if(Math.abs(dx)<0.2&&Math.abs(dy-(0.05-dx*dx*2.2))<0.07){skip=true;break;} }
      else if(blink){ if(Math.abs(dx)<0.18&&Math.abs(dy)<0.05){skip=true;break;} }
      else if(dx*dx+dy*dy<0.17*0.17){skip=true;break;}}
    if(!skip){

    }
    if(skip) continue;
    const shade=0.78+0.22*(-0.5*ux-0.6*uy);
    const rx=ux*hr,ry=uy*hr; dot(hx+rx*ct-ry*st,hy+rx*st+ry*ct,ds*p.s*(0.95+0.2*shade),0,a*0.86*shade);

  if(!grand&&!blink){for(const ex of [-0.36,0.36]){const rx=(ex+gx*0.07)*hr,ry=(-0.04+gy*0.06)*hr;dot(hx+rx*ct-ry*st,hy+rx*st+ry*ct,ds*1.9,0,a);}}

  if(o.eat&&open>0.2&&o.cheek>0){dot(hx,hy+hr*0.47,ds*1.5,1,a*0.8);}
}
function drawFamily(list){

  const now=aNow(); const cheekOK=1-G.clothMix;

    if(m.alpha<=0.02) continue;
    const hr=hrOf(m); let x=m.x,y=m.y,dx=0,dy=0,tilt=0,armL=0.25,armR=0.25;
    const A=Math.max(m.danceAmt,m.hasSong?0.22:0)*(cloth&&m.muffle?0.3:1);
    switch(m.dance){
      case 'bounce':{const s=Math.abs(Math.sin(bp*PI));dy=-s*hr*0.28*A;armL=armR=0.3+1.1*A*s;break;}
      case 'sway':{const s=Math.sin(bp*PI*0.5);dx=s*hr*0.32*A;tilt=s*0.25*A;armL=0.4+1.4*A*Math.max(0,s);armR=0.4+1.4*A*Math.max(0,-s);break;}
      case 'jump':{const ph=(bp%4)/4;const j=ph<0.2?Math.sin(ph/0.2*PI):0;dy=-j*hr*0.7*A;armL=armR=0.3+2.2*A*j;break;}

      default:{dy=Math.sin(bp*PI*2)*hr*0.05*A;tilt=Math.sin(bp*PI)*0.08*A;}

    if(m.beckon>0.3) open=Math.max(open,0.6*m.beckon);
    let eat=false; if(m.eating!==null){eat=true;open=0.3+0.5*Math.abs(Math.sin(G.time*14));dy+=hr*0.12;}
    if(m.pop>0){dy-=Math.sin(m.pop*PI)*hr*0.5;}
    const gp=gazePoint(m); let gx=gp.x-(x+dx),gy=gp.y-(y+dy);const gl=hyp(gx,gy)+1e-3;gx/=gl;gy/=gl;
    const cheek=cheekOK*(0.22+0.78*m.glow);

    if(m.duet>=0&&now<m.duetUntil&&m.i<m.duet){const pm=fam[m.duet];for(let k=0;k<6;k++){const t=(k/6+G.time*0.5)%1;const xx=lerp(m.x,pm.x,t),yy=lerp(m.y,pm.y,t)-Math.sin(t*PI)*hr*2.2;dot(xx,yy,LY.ds*1.8,0,0.9*Math.sin(t*PI));}}
  }
}

function drawCloth(t){

function update(dt){
  G.idle+=dt; G.wake=Math.max(0,G.wake-dt*1.5);
  G.target=computeTarget();
  BCNT=boardCounts();
  const ph=G.phase;
  if(ph==='kitchen'){
    updateDough(dt); updateContainers(dt); updateFalling(dt); updateToppings(dt);
    if(D.state==='baking')updateBake(dt);
    updateSlices(dt); checkRoundEnd(dt);
    G.kAlpha=1;
  } else if(ph==='toCloth'){
    G.phaseT+=dt/1.6; G.kAlpha=1-ease(G.phaseT*1.4); G.clothMix=ease(G.phaseT);
    for(const kd of CL.kids) kd.m.alpha=1-ease(G.phaseT*1.2);
    updateCloth(dt);
    if(G.phaseT>=1){G.phase='cloth';G.phaseT=0;G.clothMix=1;}
  } else if(ph==='cloth'){
    updateCloth(dt);
  } else if(ph==='fromCloth'){
    G.phaseT+=dt/1.3; G.kAlpha=ease(G.phaseT); G.clothMix=1-ease(G.phaseT);
    for(const m of fam) m.alpha=1;
    updateDough(dt); updateContainers(dt);
    if(G.phaseT>=1){G.phase='kitchen';G.phaseT=0;G.clothMix=0;G.kAlpha=1;}
  }
  if(ph!=='cloth'&&ph!=='toCloth') for(const m of fam) m.alpha=lerp(m.alpha,1,Math.min(1,dt*4));
  updateFamily(dt);
  G.goldF=lerp(G.goldF,D.state==='baked'?1:D.state==='baking'?0.5:0,Math.min(1,dt*2));
  updateDemo(dt); updateFX(dt);
}

}
