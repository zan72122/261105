<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d2b5e">
<title>チョキン、ポロン！もじゃ髪の歌う設計室</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0d2b5e;
    overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #sa{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
</style>

<script src="../../gf-playlog.js" defer></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
(function(){
'use strict';

/* ---------- 定数 ---------- */
var NH = 8;            // 髪の本数
var NL = 10;           // 長さの段（0=いちばん長い/低い, 9=いちばん短い/高い）
var STEP = 0.078;      // 1段あたりの長さ比
var SEMI = [0,2,4,7,9,12,14,16,19,21]; // 段→半音（ペンタトニック）
var BASE = 261.63;
var MAX_PARTICLES = 70, MAX_FRAGS = 14;
var COL = {
  bg:'#0d2b5e', bgDeep:'#081f47', line:'#f2f7ff', cyan:'#7fdcff',
  yellow:'#ffd23f', red:'#ff5b3a'
};

/* ---------- キャンバス・レイアウト ---------- */
var cv = document.getElementById('c');
var g = cv.getContext('2d');
var saEl = document.getElementById('sa');
var W = 0, H = 0, DPR = 1;
var L = {};            // レイアウト
var gridCanvas = null;

function readSafe(){
  var cs = getComputedStyle(saEl);
  return { t:parseFloat(cs.paddingTop)||0, b:parseFloat(cs.paddingBottom)||0,
           l:parseFloat(cs.paddingLeft)||0, r:parseFloat(cs.paddingRight)||0 };
}

function layout(){
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  var sa = readSafe();
  var uw = W - sa.l - sa.r, uh = H - sa.t - sa.b;
  var portrait = uh > uw*1.1;
  var u = Math.min(uw, uh)/400;
  var faceH = portrait ? Math.min(uh*0.36, uw*0.95) : uh*0.40;
  var headW = portrait ? Math.min(uw*0.92, faceH*1.25) : Math.min(uw*0.62, faceH*1.6);
  var cx = sa.l + uw/2;
  var rootY = sa.t + uh - faceH;
  var span = headW*0.84;
  var sp = span/(NH-1);
  var curlR = Math.max(8, Math.min(sp*0.32, 24));
  var rulerY = sa.t + Math.max(26, uh*0.045);
  var topY = rulerY + Math.max(22, uh*0.03) + curlR*2.6;
  var Lmax = rootY - topY;
  var hx = [];
  for (var i=0;i<NH;i++) hx.push(cx - span/2 + sp*i);
  L = { sa:sa, u:u, portrait:portrait, faceH:faceH, headW:headW, cx:cx, rootY:rootY,
        span:span, sp:sp, curlR:curlR, rulerY:rulerY, topY:topY, Lmax:Lmax, hx:hx,
        hh:faceH*0.9, lw:Math.max(1.5, 2.2*u) };
  buildGrid();
}

function buildGrid(){
  gridCanvas = document.createElement('canvas');
  gridCanvas.width = cv.width; gridCanvas.height = cv.height;
  var c = gridCanvas.getContext('2d');
  c.setTransform(DPR,0,0,DPR,0,0);
  c.fillStyle = COL.bg; c.fillRect(0,0,W,H);
  var s = Math.max(14, Math.round(18*L.u));
  c.lineWidth = 1;
  for (var k=0, x=0; x<=W+s; x+=s, k++){
    c.strokeStyle = (k%5===0) ? 'rgba(170,205,255,0.20)' : 'rgba(170,205,255,0.08)';
    c.beginPath(); c.moveTo(Math.round(x)+0.5,0); c.lineTo(Math.round(x)+0.5,H); c.stroke();
  }
  for (k=0, x=0; x<=H+s; x+=s, k++){
    c.strokeStyle = (k%5===0) ? 'rgba(170,205,255,0.20)' : 'rgba(170,205,255,0.08)';
    c.beginPath(); c.moveTo(0,Math.round(x)+0.5); c.lineTo(W,Math.round(x)+0.5); c.stroke();
  }
}

function lenOf(n){ return L.Lmax*(1 - n*STEP); }
function tipYOf(n){ return L.rootY - lenOf(n); }
function levelFromY(y){ return Math.round((1 - (L.rootY - y)/L.Lmax)/STEP); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }

/* ---------- 音（Web Audio合成） ---------- */
var actx = null, master = null, noiseBuf = null, audioOK = false;
function unlockAudio(){
  try {
    if (!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      var comp = actx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4;
      master = actx.createGain(); master.gain.value = 0.8;
      master.connect(comp); comp.connect(actx.destination);
      noiseBuf = actx.createBuffer(1, Math.floor(actx.sampleRate*0.25), actx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    }
    if (actx.state !== 'running' && !document.hidden) {
      var p = actx.resume(); if (p && p.catch) p.catch(function(){});
    }
    audioOK = true;
  } catch(e){ audioOK = false; }
}
function aNow(){ return actx.currentTime + 0.005; }
function freqOf(n){ return BASE*Math.pow(2, SEMI[clamp(n,0,NL-1)]/12); }
function canPlay(){ return audioOK && actx && actx.state === 'running'; }

function envGain(t, peak, dec){
  var gn = actx.createGain();
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(peak, t+0.006);
  gn.gain.exponentialRampToValueAtTime(0.0001, t+dec);
  return gn;
}
// 弦の音：tone 'w'=白い髪, 'c'=一曲目(水色), 'r'=朱色
function pluck(n, tone, glideFrom, vol){
  if (!canPlay()) return;
  try {
    var t = aNow(), f = freqOf(n);
    var k = n/(NL-1);
    var dec = 0.9 - 0.45*k;
    var peak = (vol||1)*(0.42 - 0.13*k);   // 短い髪ほど小さな声
    var gn = envGain(t, peak, dec);
    var o1 = actx.createOscillator(), o2 = actx.createOscillator();
    o1.type = tone==='r' ? 'square' : 'triangle';
    o2.type = 'sine';
    var lp = actx.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.setValueAtTime(tone==='r'? f*5 : f*7, t);
    lp.frequency.exponentialRampToValueAtTime(f*1.5, t+dec);
    var m1 = actx.createGain(); m1.gain.value = tone==='r' ? 0.16 : (tone==='c'? 0.25 : 0.55);
    var m2 = actx.createGain(); m2.gain.value = tone==='c' ? 0.9 : 0.6;
    if (glideFrom != null){
      var f0 = freqOf(glideFrom);
      o1.frequency.setValueAtTime(f0, t); o1.frequency.exponentialRampToValueAtTime(f, t+0.09);
      o2.frequency.setValueAtTime(f0*2, t); o2.frequency.exponentialRampToValueAtTime(f*2, t+0.09);
    } else {
      o1.frequency.setValueAtTime(f, t); o2.frequency.setValueAtTime(f*2, t);
    }
    o2.detune.value = tone==='r' ? 9 : 0;
    o1.connect(m1); o2.connect(m2); m1.connect(lp); m2.connect(lp); lp.connect(gn); gn.connect(master);
    o1.start(t); o2.start(t); o1.stop(t+dec+0.05); o2.stop(t+dec+0.05);
  } catch(e){}
}
function snip(){
  if (!canPlay()) return;
  try {
    var t = aNow();
    for (var j=0;j<2;j++){
      var s = actx.createBufferSource(); s.buffer = noiseBuf;
      var hp = actx.createBiquadFilter(); hp.type='bandpass';
      hp.frequency.value = j? 5200 : 3400; hp.Q.value = 2.5;
      var gn = envGain(t + j*0.045, j?0.5:0.3, 0.05);
      s.connect(hp); hp.connect(gn); gn.connect(master);
      s.start(t + j*0.045, Math.random()*0.1, 0.08);
    }
  } catch(e){}
}
// 言葉なしの合唱（あー）
function voice(n, dur, red, vol){
  if (!canPlay()) return;
  try {
    var t = aNow(), f = freqOf(n) * (red ? 1 : 0.5);
    var out = actx.createGain();
    out.gain.setValueAtTime(0.0001, t);
    out.gain.exponentialRampToValueAtTime(0.22*(vol||1), t+0.05);
    out.gain.setValueAtTime(0.22*(vol||1), t+dur*0.65);
    out.gain.exponentialRampToValueAtTime(0.0001, t+dur+0.18);
    var f1 = actx.createBiquadFilter(); f1.type='bandpass'; f1.frequency.value = red? 600 : 750; f1.Q.value = 6;
    var f2 = actx.createBiquadFilter(); f2.type='bandpass'; f2.frequency.value = red? 1900 : 1150; f2.Q.value = 7;
    var lp = actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 3200;
    var lfo = actx.createOscillator(); lfo.frequency.value = 5.3;
    var lfoG = actx.createGain(); lfoG.gain.setValueAtTime(0, t); lfoG.gain.linearRampToValueAtTime(f*0.012, t+0.25);
    lfo.connect(lfoG);
    var dets = [-8, 0, 8];
    for (var i=0;i<3;i++){
      var o = actx.createOscillator(); o.type='sawtooth';
      o.frequency.value = (i===0 && !red) ? f*2 : f;
      o.detune.value = dets[i];
      lfoG.connect(o.frequency);
      var og = actx.createGain(); og.gain.value = 0.33;
      o.connect(og); og.connect(f1); og.connect(f2);
      o.start(t); o.stop(t+dur+0.25);
    }
    var mf2 = actx.createGain(); mf2.gain.value = 0.6;
    f1.connect(lp); f2.connect(mf2); mf2.connect(lp); lp.connect(out); out.connect(master);
    lfo.start(t); lfo.stop(t+dur+0.25);
    pluck(n, red?'r':'c', null, 0.35);
  } catch(e){}
}
function chime(up){
  if (!canPlay()) return;
  var seq = up ? [4,6,8] : [8,6,9];
  seq.forEach(function(n,i){
    setTimeout(function(){ pluck(n,'c',null,0.6); }, i*70);
  });
}
function whoosh(){
  if (!canPlay()) return;
  try {
    var t = aNow();
    var s = actx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    var bp = actx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(300, t); bp.frequency.exponentialRampToValueAtTime(2400, t+0.7);
    var gn = actx.createGain();
    gn.gain.setValueAtTime(0.0001,t); gn.gain.exponentialRampToValueAtTime(0.25,t+0.3);
    gn.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
    s.connect(bp); bp.connect(gn); gn.connect(master); s.start(t); s.stop(t+0.95);
  } catch(e){}
}

/* ---------- 状態 ---------- */
function rnd(a,b){ return a + Math.random()*(b-a); }
function newHair(n, grow){
  return { n:n, cut:false, disp:0, vel:0, bounce:0, bvel:0, flash:0, grow:grow, wob:Math.random()*6.28 };
}
function initialLevels(){
  // 初期長さを少し変える（4本以上の交互の並びにはしない）
  for (var tries=0; tries<40; tries++){
    var a = [];
    for (var i=0;i<NH;i++) a.push(Math.random()<0.5 ? 0 : (Math.random()<0.6?1:2));
    if (!altMask(a).some(function(v){return v;})) return a;
  }
  return [0,1,1,0,2,1,0,1];
}
function makeRests(){
  var r = [], used = 0;
  for (var i=0;i<NH;i++) r.push(false);
  var cnt = 1 + Math.floor(Math.random()*2);
  while (used < cnt){
    var k = 1 + Math.floor(Math.random()*(NH-2));
    if (!r[k] && !r[k-1] && !r[k+1]){ r[k] = true; used++; }
  }
  return r;
}

var S = {
  cycle: 0,
  round: 1,
  mode: 'play',        // play | perform | grow | renew
  hairs: [], red: null, ghost: null, ghostRests: null, rests: [],
  rulerVis: 0, rulerPop: 0, stage: 0, stageOn: false,
  sweep: null, sweepDelay: -1, autoLoops: 0,
  phaseT: 0,
  firstVisual: 0,
  lastCut: -1, dimT: 0,
  target: 3,
  idleT: 0, everTouched: false,
  demo: { done:false, on:false, t:0, kind:'cut', rulerDone:false },
  face: { mouth:0, mouthT:0, hold:0, brow:0, puff:0, puffSide:0, tilt:0, tiltT:0, tiltHold:0,
          gx:0, gy:0, gxT:0, gyT:0, blink:0, blinkT:3, wig:0, surprise:0, big:0 },
  particles: [], frags: [],
  time: 0,
  log: []              // 自動テスト用の発音記録（UIなし）
};

function activeHairs(){ return S.round===1 ? S.hairs : S.red; }
function cutCount(arr){ var c=0; for (var i=0;i<arr.length;i++) if (arr[i].cut) c++; return c; }

function startCycle(first){
  var lv = initialLevels();
  S.hairs = lv.map(function(n){ return newHair(n, first?1:0); });
  S.red = null; S.ghost = null; S.ghostRests = null;
  S.rests = makeRests();
  S.round = 1; S.stageOn = false; S.sweep = null; S.sweepDelay = -1; S.autoLoops = 0;
  S.mode = first ? 'play' : 'renew'; S.phaseT = 0;
  S.target = 3; S.lastCut = -1;
}

/* ---------- 並びの判定 ---------- */
function levelsOf(arr){ return arr.map(function(h){ return (typeof h === 'number') ? h : h.n; }); }
// 長短交互（差の符号が交互に3回以上）に含まれる髪
function altMask(a){
  var m = a.map(function(){return false;});
  var d = [];
  for (var i=0;i<a.length-1;i++) d.push(Math.sign(a[i+1]-a[i]));
  var s = 0;
  while (s < d.length){
    if (d[s]===0){ s++; continue; }
    var e = s;
    while (e+1 < d.length && d[e+1]!==0 && d[e+1] === -d[e]) e++;
    if (e - s + 1 >= 3) for (var k=s;k<=e+1;k++) m[k] = true;
    s = e+1;
  }
  return m;
}
// 階段（同じ向きに3本以上続けて変化）: +1 上り(だんだん高い) / -1 下り
function stairMask(a){
  var m = a.map(function(){return 0;});
  var d = [];
  for (var i=0;i<a.length-1;i++) d.push(Math.sign(a[i+1]-a[i]));
  var s = 0;
  while (s < d.length){
    if (d[s]===0){ s++; continue; }
    var e = s;
    while (e+1 < d.length && d[e+1] === d[s]) e++;
    if (e - s + 1 >= 2) for (var k=s;k<=e+1;k++) m[k] = d[s];
    s = e+1;
  }
  return m;
}

/* ---------- 演奏（走査定規） ---------- */
function buildSweep(kind){
  var ev = [], acc = 0, i;
  var hx = L.hx, sp = L.sp;
  if (S.round === 1){
    var step = kind==='perform' ? 0.48 : 0.34;
    for (i=0;i<NH;i++){
      ev.push({t:acc, i:i, src:'w', dx:0});
      acc += step;
      if (S.rests[i]) acc += step*0.55;
    }
    return { kind:kind, ev:ev, t:-0.35, idx:0, end:acc, step:step, prevN:null };
  }
  var st2 = kind==='perform' ? 0.36 : 0.27;
  var rs = S.ghostRests || S.rests;
  for (i=0;i<NH;i++){
    ev.push({t:acc, i:i, src:'c', dx:-sp*0.09});
    acc += st2;
    ev.push({t:acc, i:i, src:'r', dx:sp*0.09});
    acc += st2;
    if (rs[i]) acc += st2*0.6;
  }
  return { kind:kind, ev:ev, t:-0.35, idx:0, end:acc, step:st2, prevN:null };
}
function bladeX(sw){
  var ev = sw.ev, hx = L.hx, t = sw.t;
  var x0 = hx[0] - L.sp*0.7, x1 = hx[NH-1] + L.sp*0.7;
  var ex = function(e){ return hx[e.i] + e.dx; };
  if (t <= ev[0].t) return lerp(x0, ex(ev[0]), clamp((t+0.35)/0.35,0,1));
  for (var k=0;k<ev.length-1;k++){
    if (t < ev[k+1].t) return lerp(ex(ev[k]), ex(ev[k+1]), clamp((t-ev[k].t)/(ev[k+1].t-ev[k].t),0,1));
  }
  var last = ev[ev.length-1];
  return lerp(ex(last), x1, clamp((t-last.t)/Math.max(0.01, sw.end-last.t),0,1));
}
function fireEvent(sw, e){
  var perform = sw.kind === 'perform';
  var n, hair, arr;
  if (e.src === 'c'){ n = S.ghost[e.i]; arr = S.ghost; }
  else {
    arr = activeHairs(); hair = arr[e.i];
    if (e.src === 'r' && !hair.cut){ return; }  // まだ切っていない朱色の髪は休み
    n = hair.n;
  }
  var lv = levelsOf(arr);
  // 音
  if (perform){
    voice(n, sw.step*1.15, e.src==='r', 1);
  } else {
    pluck(n, e.src, null, e.src==='c' ? 0.75 : 1);
  }
  S.log.push({k:sw.kind, src:e.src, i:e.i, n:n, f:Math.round(freqOf(n)), r:S.round, cy:S.cycle});
  if (S.log.length > 400) S.log.splice(0, 100);
  // 髪の振動
  if (hair){ kick(hair, e.i, (e.i%2?1:-1), 0.6); hair.flash = 1; }
  else { S.ghostFlash = S.ghostFlash || []; S.ghostFlash[e.i] = 1; }
  // 顔
  var F = S.face, k = n/(NL-1);
  F.mouthT = (0.35 + 0.75*k) * (perform ? 1.45 : 1);
  F.hold = sw.step*0.75;
  F.brow = Math.max(F.brow, 0.35 + 0.4*k);
  F.gxT = clamp((L.hx[e.i]-L.cx)/(L.span*0.5), -1, 1);
  // 同じ高さが続く→頬をふくらませる
  if (sw.prevN !== null && sw.prevN === n){ F.puff = 1; F.puffSide = 0; }
  sw.prevN = n;
  // 長短交互→首を左右に振って歌い返す
  var am = altMask(lv);
  if (am[e.i] && e.i > 0){
    F.tiltT = (lv[e.i] > lv[e.i-1]) ? 1 : -1; F.tiltHold = sw.step*1.2;
  } else if (am[e.i] && e.i === 0 && lv.length>1){
    F.tiltT = (lv[0] > lv[1]) ? 1 : -1; F.tiltHold = sw.step*1.2;
  } else if (S.round === 2){
    F.tiltT = e.src==='c' ? -0.35 : 0.35; F.tiltHold = sw.step*0.9;  // 二曲の掛け合い
  } else {
    F.tiltT = 0;
  }
  // 階段→目線が上る/下る
  var sm = stairMask(lv);
  F.gyT = sm[e.i] ? (sm[e.i] > 0 ? -1 : 1)*(0.4 + 0.6*k) : -0.2;
  if (sm[e.i] > 0) F.brow = Math.max(F.brow, 0.4 + 0.6*k);
}
function startSweep(kind){
  S.sweep = buildSweep(kind);
  S.sweepDelay = -1;
}
function endSweep(sw){
  S.sweep = null;
  if (sw.kind === 'perform'){
    if (S.round === 1){
      // 一曲目が鳴り終わった → 朱色の髪が伸びる
      S.ghost = levelsOf(S.hairs);
      S.ghostRests = S.rests.slice();
      S.red = initialLevels().map(function(n){ return newHair(Math.min(n,1), 0); });
      S.mode = 'grow'; S.phaseT = 0;
      S.stageOn = false;
      S.face.surprise = 1; S.face.brow = 1; S.face.gyT = -1;
      chime(true);
    } else {
      // 二曲を鳴らし終えた → 新しい髪へ戻る
      S.cycle++;
      S.face.surprise = 1;
      chime(true);
      startCycle(false);
    }
    return;
  }
  if (S.autoLoops > 0){ S.autoLoops--; S.sweepDelay = 2.1; }
}

/* ---------- 切る ---------- */
function kick(h, i, dir, amt){
  var ratio = L.Lmax/Math.max(10, lenOf(h.n));
  h.vel += dir * amt * 160 * Math.sqrt(ratio);
}
function addParticle(p){
  if (S.particles.length >= MAX_PARTICLES) S.particles.shift();
  S.particles.push(p);
}
function tryCut(i, y, dir){
  if (S.mode !== 'play') return false;
  var arr = activeHairs(); var h = arr[i];
  if (!h || h.grow < 1) return false;
  var tip = tipYOf(h.n);
  var curlTop = h.cut ? tip - 10 : tip - L.curlR*2.4;
  if (y < curlTop) return false;
  if (y > L.rootY - 6) return false;
  var nn = clamp(levelFromY(y), 0, NL-1);
  if (nn <= h.n) nn = h.n + 1;
  if (nn > NL-1){ kick(h, i, dir, 0.25); return false; }  // もう最短：小さく揺れるだけ
  var old = h.n, wasCut = h.cut;
  var oldTip = tip;
  h.n = nn; h.cut = true;
  var newTip = tipYOf(nn);
  // 切れ端
  var offs = S.round===2 ? L.sp*0.08 : 0;
  if (S.frags.length >= MAX_FRAGS) S.frags.shift();
  S.frags.push({ x:L.hx[i]+offs, y0:Math.min(newTip, oldTip + L.Lmax*0.2), y1:oldTip, curl:!wasCut, vx:dir*rnd(40,90), vy:rnd(-120,-60),
                 rot:0, vr:dir*rnd(1.5,3.5), life:0.9, red:S.round===2 });
  for (var k=0;k<6;k++){
    var a = rnd(-Math.PI, 0);
    addParticle({ x:L.hx[i]+offs, y:newTip, vx:Math.cos(a)*rnd(60,180) + dir*40, vy:Math.sin(a)*rnd(60,200),
                  a:rnd(0,6.28), va:rnd(-8,8), len:rnd(4,9)*L.u, life:rnd(0.4,0.8),
                  c: S.round===2 ? COL.red : COL.line });
  }
  // たわみ→伸び戻り、切り口が跳ねる
  h.disp = dir * L.sp*0.35; h.vel = 0;
  kick(h, i, dir, 0.9);
  h.bounce = 10*L.u; h.bvel = -60*L.u;
  h.flash = 1;
  // 音：チョキン→長さの音（前の低い音から滑って上がる）
  snip();
  pluck(nn, S.round===2 ? 'r' : 'w', old, 1);
  S.log.push({k:'cut', src:S.round===2?'r':'w', i:i, n:nn, from:old, f:Math.round(freqOf(nn)), r:S.round, cy:S.cycle});
  // 顔
  var F = S.face, kk = nn/(NL-1);
  F.brow = 1; F.mouthT = 0.4 + 0.8*kk; F.hold = 0.28;
  F.gxT = clamp((L.hx[i]-L.cx)/(L.span*0.5), -1, 1); F.gyT = -0.6;
  // 隣と同じ高さ・一曲目と同じ高さ → 頬ぷく
  var same = false;
  if (i>0 && arr[i-1].cut && arr[i-1].n === nn) same = true;
  if (i<NH-1 && arr[i+1].cut && arr[i+1].n === nn) same = true;
  if (S.round===2 && S.ghost[i] === nn){ same = true; S.alignFlash = S.alignFlash || []; S.alignFlash[i] = 1; }
  if (same){ F.puff = 1; F.puffSide = 0; }
  S.lastCut = i; S.dimT = 1.6;
  S.firstVisual++;
  afterCut(arr);
  return true;
}
function afterCut(arr){
  var c = cutCount(arr);
  // 次の誘い：まだ切っていない近い髪
  S.target = nextTarget(arr);
  var rulerNeeded = (S.round===2) || c >= 3;
  if (rulerNeeded && S.rulerVis < 0.05 && !S.rulerShown){
    S.rulerShown = true; S.rulerPop = 1; chime(true);
  }
  if (c === NH && !S.stageOn){
    S.stageOn = true; S.face.surprise = 1; whoosh();
    S.sweepDelay = 1.1; S.autoLoops = 0;
    return;
  }
  if (rulerNeeded){
    if (!S.sweep || S.sweep.kind !== 'trial'){ S.sweepDelay = 0.9; }
    S.autoLoops = S.round===2 ? 3 : 2;
  }
}
function nextTarget(arr){
  var best = -1, bd = 99, ref = S.lastCut < 0 ? 3 : S.lastCut;
  for (var i=0;i<NH;i++){
    if (arr[i].cut) continue;
    var d = Math.abs(i - ref) + (i < ref ? 0.5 : 0);
    if (d < bd){ bd = d; best = i; }
  }
  return best;
}

/* ---------- 入力（Pointer Events・一本指） ---------- */
var activeId = null, stroke = null;
function pos(e){ return { x:e.clientX, y:e.clientY }; }
function rulerHit(p){
  if (S.rulerVis < 0.5) return false;
  var big = S.stage;
  var x0 = lerp(L.hx[0] - L.sp*0.9, L.sa.l + 12, big), x1 = lerp(L.hx[NH-1] + L.sp*0.9, W - L.sa.r - 12, big);
  return p.x > x0 - 10 && p.x < x1 + 10 && p.y > L.rulerY - 34 - big*16 && p.y < L.rulerY + 26 + big*14;
}
function faceHit(p){
  return p.y > L.rootY + 4 && p.y < L.rootY + L.hh && Math.abs(p.x - L.cx) < L.headW*0.5;
}
function onDown(e){
  e.preventDefault();
  if (activeId !== null) return;           // 二本目以降の指は無視
  activeId = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch(err){}
  unlockAudio();
  S.idleT = 0; S.everTouched = true;
  if (S.demo.on){ S.demo.on = false; if (S.demo.kind==='cut') S.demo.done = true; else S.demo.rulerDone = true; }
  var p = pos(e);
  stroke = { last:p, done:{}, start:p, t:0 };
  if (rulerHit(p)){
    stroke.ruler = true;
    if (S.mode === 'play'){
      if (S.stageOn){
        // 本番
        S.sweep = null; S.sweepDelay = -1; S.autoLoops = 0;
        S.mode = 'perform';
        S.face.big = 1; S.face.brow = 1; S.rulerPop = 1;
        chime(false);
        S.performDelay = 0.55;
      } else {
        S.rulerPop = 0.6;
        startSweep('trial'); S.autoLoops = 0;
      }
    }
    return;
  }
  // 髪へのタップ：触れた高さで切る
  var arr = activeHairs(), best = -1, bd = L.sp*0.48;
  for (var i=0;i<NH;i++){
    var off = S.round===2 ? L.sp*0.08 : 0;
    var d = Math.abs(p.x - (L.hx[i]+off));
    if (d < bd){ bd = d; best = i; }
  }
  if (best >= 0){
    if (tryCut(best, p.y, Math.random()<0.5?-1:1)) { stroke.done[best] = true; return; }
  }
  if (faceHit(p)){ S.face.wig = 1; }   // 関係ない部品は小さく揺れるだけ
}
function crossHairs(a, b){
  if (a.x === b.x) return;
  var dir = b.x > a.x ? 1 : -1;
  var off = S.round===2 ? L.sp*0.08 : 0;
  for (var i=0;i<NH;i++){
    if (stroke.done[i]) continue;
    var hx = L.hx[i] + off;
    if ((a.x - hx)*(b.x - hx) <= 0){
      var t = (hx - a.x)/(b.x - a.x);
      var y = a.y + (b.y - a.y)*t;
      if (tryCut(i, y, dir)) stroke.done[i] = true;
      else {
        // 切れない所を横切った：押されてたわむだけ
        var h = activeHairs()[i];
        if (h && h.grow>=1 && y > tipYOf(h.n) - L.curlR*2 && y < L.rootY){ kick(h, i, dir, 0.3); stroke.done[i] = true; }
      }
    }
  }
}
function onMove(e){
  if (e.pointerId !== activeId || !stroke) return;
  e.preventDefault();
  if (stroke.ruler) return;
  var list = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
  if (!list.length) list = [e];
  for (var k=0;k<list.length;k++){
    var p = pos(list[k]);
    crossHairs(stroke.last, p);
    stroke.last = p;
  }
  S.idleT = 0;
}
function onUp(e){
  if (e.pointerId !== activeId) return;
  activeId = null; stroke = null;
}
cv.addEventListener('pointerdown', onDown, {passive:false});
cv.addEventListener('pointermove', onMove, {passive:false});
cv.addEventListener('pointerup', onUp);
cv.addEventListener('pointercancel', onUp);
cv.addEventListener('lostpointercapture', onUp);
window.addEventListener('blur', function(){ activeId = null; stroke = null; });
['contextmenu','gesturestart','gesturechange','gestureend','selectstart','dblclick'].forEach(function(n){
  document.addEventListener(n, function(e){ e.preventDefault(); }, {passive:false});
});
document.addEventListener('touchstart', function(e){ if (e.touches.length>1) e.preventDefault(); }, {passive:false});
document.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});

/* ---------- 更新 ---------- */
function springHair(h, dt){
  var ratio = L.Lmax/Math.max(10, lenOf(h.n));
  var w = 9 * ratio;                // 短い弦ほど速く震える
  var damp = 4.2;
  h.vel += (-w*w*h.disp - damp*h.vel)*dt;
  h.disp += h.vel*dt;
  if (Math.abs(h.disp) > L.sp*0.6) h.disp = Math.sign(h.disp)*L.sp*0.6;
  h.bvel += (-260*h.bounce - 14*h.bvel)*dt;
  h.bounce += h.bvel*dt;
  h.flash = Math.max(0, h.flash - dt*2.5);
  h.wob += dt;
}
function update(dt){
  S.time += dt;
  S.idleT += dt;
  var F = S.face, i;
  var arr = activeHairs();
  for (i=0;i<S.hairs.length;i++) springHair(S.hairs[i], dt);
  if (S.red) for (i=0;i<S.red.length;i++) springHair(S.red[i], dt);
  if (S.ghostFlash) for (i=0;i<NH;i++) if (S.ghostFlash[i]) S.ghostFlash[i] = Math.max(0, S.ghostFlash[i]-dt*2.5);
  if (S.alignFlash) for (i=0;i<NH;i++) if (S.alignFlash[i]) S.alignFlash[i] = Math.max(0, S.alignFlash[i]-dt*1.2);

  // 段階
  if (S.mode === 'grow'){
    S.phaseT += dt;
    var gk = clamp(S.phaseT/1.4, 0, 1);
    S.red.forEach(function(h, j){ h.grow = clamp(gk*1.3 - j*0.04, 0, 1); });
    if (S.phaseT > 1.6){
      S.red.forEach(function(h){ h.grow = 1; });
      S.round = 2; S.mode = 'play'; S.lastCut = -1; S.target = nextTarget(S.red);
      S.sweepDelay = 0.6; S.autoLoops = 2;
    }
  } else if (S.mode === 'renew'){
    S.phaseT += dt;
    var rk = clamp(S.phaseT/1.3, 0, 1);
    S.hairs.forEach(function(h, j){ h.grow = clamp(rk*1.3 - j*0.04, 0, 1); });
    if (S.phaseT > 1.5){ S.hairs.forEach(function(h){ h.grow = 1; }); S.mode = 'play'; S.rulerShown = false; }
  } else if (S.mode === 'perform'){
    if (S.performDelay > 0){
      S.performDelay -= dt;
      if (S.performDelay <= 0) startSweep('perform');
    }
  }

  // 演奏の進行
  if (S.sweepDelay > 0 && S.mode === 'play'){
    S.sweepDelay -= dt;
    if (S.sweepDelay <= 0) startSweep('trial');
  }
  if (S.sweep){
    var sw = S.sweep;
    sw.t += dt;
    while (sw.idx < sw.ev.length && sw.t >= sw.ev[sw.idx].t){ fireEvent(sw, sw.ev[sw.idx]); sw.idx++; }
    if (sw.t >= sw.end + 0.25) endSweep(sw);
  }

  // 定規・演奏台
  var rulerNeeded = (S.round===2) || (S.mode!=='renew' && cutCount(S.hairs) >= 3);
  if (S.mode === 'grow') rulerNeeded = true;
  S.rulerVis = clamp(S.rulerVis + (rulerNeeded ? dt*3 : -dt*3), 0, 1);
  if (rulerNeeded) S.rulerShown = true;
  S.rulerPop = Math.max(0, S.rulerPop - dt*2.2);
  var stageWant = (S.stageOn || S.mode==='perform') ? 1 : 0;
  S.stage += (stageWant - S.stage)*Math.min(1, dt*3.2);

  // 顔
  if (F.hold > 0) F.hold -= dt; else F.mouthT = (S.mode==='perform' && S.sweep) ? F.mouthT*0.9 : 0;
  F.mouth += (F.mouthT - F.mouth)*Math.min(1, dt*18);
  F.brow = Math.max(0, F.brow - dt*1.4);
  F.puff = Math.max(0, F.puff - dt*1.1);
  F.surprise = Math.max(0, F.surprise - dt*0.9);
  F.big = (S.mode==='perform') ? 1 : Math.max(0, F.big - dt*2);
  F.wig = Math.max(0, F.wig - dt*3);
  if (F.tiltHold > 0) F.tiltHold -= dt; else F.tiltT = 0;
  F.tilt += (F.tiltT - F.tilt)*Math.min(1, dt*9);
  // 視線：演奏中は定規、そうでなければ誘う対象
  if (!S.sweep && F.hold <= 0){
    var tx, ty;
    if (S.stageOn && S.mode==='play'){ tx = 0; ty = -1; }
    else if (S.mode==='play' && S.target >= 0){
      tx = clamp((L.hx[S.target]-L.cx)/(L.span*0.5), -1, 1); ty = -0.85;
    } else { tx = 0; ty = -0.5; }
    F.gxT = tx; F.gyT = ty;
  }
  F.gx += (F.gxT - F.gx)*Math.min(1, dt*8);
  F.gy += (F.gyT - F.gy)*Math.min(1, dt*8);
  F.blinkT -= dt;
  if (F.blinkT <= 0){ F.blink = 1; F.blinkT = rnd(2.5, 5); }
  F.blink = Math.max(0, F.blink - dt*7);
  S.dimT = Math.max(0, S.dimT - dt);

  // 粒・切れ端
  for (i=S.particles.length-1;i>=0;i--){
    var p = S.particles[i];
    p.life -= dt; if (p.life <= 0){ S.particles.splice(i,1); continue; }
    p.vy += 420*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.a += p.va*dt;
  }
  for (i=S.frags.length-1;i>=0;i--){
    var fr = S.frags[i];
    fr.life -= dt; if (fr.life <= 0 || fr.y0 > H + 200){ S.frags.splice(i,1); continue; }
    fr.vy += 520*dt; fr.x += fr.vx*dt; fr.y0 += fr.vy*dt; fr.y1 += fr.vy*dt; fr.rot += fr.vr*dt;
  }

  // お手本（初回のみ・約4秒放置）
  var D = S.demo;
  if (!D.done && !D.on && !S.everTouched && S.idleT > 4 && S.mode==='play'){ D.on = true; D.kind='cut'; D.t = 0; }
  if (!D.rulerDone && !D.on && S.stageOn && S.mode==='play' && S.idleT > 4 && !S.sweep && S.sweepDelay < 0){
    D.on = true; D.kind = 'ruler'; D.t = 0;
  }
  if (D.on){
    D.t += dt;
    var lim = D.kind==='cut' ? 3.4 : 2.2;
    if (D.t > lim){ D.on = false; if (D.kind==='cut') D.done = true; else D.rulerDone = true; }
  }
}

/* ---------- 描画 ---------- */
function drawGrid(){
  var st = S.stage;
  g.fillStyle = COL.bgDeep; g.fillRect(0,0,W,H);
  if (st < 0.01){ g.drawImage(gridCanvas, 0,0, cv.width,cv.height, 0,0,W,H); return; }
  var off = st * W * 0.22, half = W/2;
  var sx = cv.width/2;
  // 左右へ開く方眼
  g.drawImage(gridCanvas, 0,0, sx,cv.height, -off,0, half,H);
  g.drawImage(gridCanvas, sx,0, cv.width-sx,cv.height, half+off,0, W-half,H);
  g.strokeStyle = 'rgba(242,247,255,'+(0.7*st)+')'; g.lineWidth = L.lw;
  [half-off, half+off].forEach(function(x, j){
    var s2 = j ? 1 : -1;
    g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke();
    g.beginPath(); g.moveTo(x - s2*6,0); g.lineTo(x - s2*6,H); g.stroke();
  });
  // 演奏台（開いた奥）
  g.save();
  g.beginPath(); g.rect(half-off, 0, off*2, H); g.clip();
  g.strokeStyle = 'rgba(127,220,255,'+(0.5*st)+')'; g.lineWidth = 1;
  var cx = L.cx, by = H - L.sa.b - 6;
  for (var k=1;k<=5;k++){
    g.beginPath(); g.arc(cx, L.rootY + L.hh*0.4, k*L.headW*0.22*st, Math.PI*1.05, Math.PI*1.95); g.stroke();
  }
  g.restore(); g.save();
  g.strokeStyle = 'rgba(242,247,255,'+(0.8*st)+')'; g.lineWidth = L.lw;
  var pw = L.headW*0.62 + W*0.2*st;
  g.beginPath();
  g.moveTo(cx - pw*0.5, by); g.lineTo(cx - pw*0.42, by - 18*L.u); g.lineTo(cx + pw*0.42, by - 18*L.u); g.lineTo(cx + pw*0.5, by);
  g.stroke();
  g.restore();
}

function drawScale(){
  // 数字のない目盛り（左）
  var x = L.hx[NH-1] + L.sp*0.62;
  g.strokeStyle = COL.cyan; g.lineWidth = 1; g.globalAlpha = 0.55;
  g.beginPath(); g.moveTo(x, L.rootY); g.lineTo(x, tipYOf(0)); g.stroke();
  for (var n=0;n<NL;n++){
    var y = tipYOf(n), w = (n%5===0) ? 9 : 5;
    g.beginPath(); g.moveTo(x - 2, y); g.lineTo(x + w*L.u, y); g.stroke();
  }
  g.globalAlpha = 1;
}

function hairPath(x, len, disp, sway, rootY){
  var seg = 10;
  g.beginPath();
  for (var k=0;k<=seg;k++){
    var s = k/seg;
    var px = x + disp*Math.sin(Math.PI*s*0.95) + sway*s*s;
    var py = rootY - len*s;
    if (k===0) g.moveTo(px,py); else g.lineTo(px,py);
  }
}
function drawCurl(x, y, r, phase, color){
  // もじゃもじゃの先：円弧の渦（直線と円弧だけ）
  var ph = Math.sin(phase*1.3)*0.15;
  g.beginPath();
  g.moveTo(x, y);
  var cx = x + r*0.55, cy = y - r*0.9;
  for (var k=0;k<=40;k++){
    var a = Math.PI*0.5 + k/40*Math.PI*4.4 + ph;
    var rr = r*(1 - k/40*0.72);
    g.lineTo(cx + Math.cos(a)*rr - r*0.55, cy + Math.sin(a)*rr*0.9 + r*0.0);
  }
  g.stroke();
  g.beginPath(); g.arc(x - r*0.95, y - r*1.55, r*0.42, 0.2 + ph, Math.PI*1.6 + ph); g.stroke();
  g.beginPath(); g.arc(x + r*0.9, y - r*1.6, r*0.36, Math.PI*1.2 - ph, Math.PI*2.7 - ph); g.stroke();
  g.beginPath(); g.arc(x + r*0.05, y - r*2.1, r*0.3, Math.PI*0.9, Math.PI*2.3); g.stroke();
}
function drawHairs(){
  var u = L.u, arr, i, h;
  var targetPulse = 0.5 + 0.5*Math.sin(S.time*5.5);
  // 一曲目の切り口（水色の細線）
  if (S.ghost){
    var ga = S.mode==='renew' ? 0 : 1;
    for (i=0;i<NH;i++){
      var gx = L.hx[i] - L.sp*0.1, gt = tipYOf(S.ghost[i]);
      var fl = (S.ghostFlash && S.ghostFlash[i]) || 0;
      g.strokeStyle = COL.cyan; g.globalAlpha = ga*(0.65 + 0.35*fl);
      g.lineWidth = 1 + fl*1.5;
      g.beginPath(); g.moveTo(gx, L.rootY); g.lineTo(gx, gt); g.stroke();
      g.beginPath(); g.moveTo(gx - 7*u, gt); g.lineTo(gx + 7*u, gt); g.stroke();
      g.beginPath(); g.moveTo(gx - 4*u, gt + 4*u); g.lineTo(gx + 4*u, gt - 4*u); g.stroke();
    }
    g.globalAlpha = 1;
  }
  var isRed = S.round === 2 || S.mode === 'grow';
  var lists = [];
  if (S.mode !== 'renew' || true) lists.push({arr:S.hairs, red:false, ghosted: !!S.ghost});
  if (S.red) lists.push({arr:S.red, red:true, ghosted:false});
  lists.forEach(function(Lst){
    if (Lst.ghosted) return;   // 白い髪は一曲目として水色の線に置き換わった
    arr = Lst.arr;
    var off = Lst.red ? L.sp*0.08 : 0;
    for (i=0;i<NH;i++){
      h = arr[i];
      if (h.grow <= 0) continue;
      var x = L.hx[i] + off;
      var len = lenOf(h.n)*h.grow;
      var isT = (S.mode==='play' && !S.stageOn && i === S.target && arr === activeHairs());
      var sway = Math.sin(h.wob*1.7)*1.0*u + (isT ? Math.sin(S.time*4.2)*7*u : 0);
      var tipX = x + sway, tipY = L.rootY - len - h.bounce;
      var col = Lst.red ? COL.red : COL.line;
      // 誘う一本：光る輪郭
      if (isT){
        g.strokeStyle = Lst.red ? 'rgba(255,91,58,0.28)' : 'rgba(242,247,255,0.22)';
        g.lineWidth = L.lw*4 + targetPulse*L.lw*3;
        hairPath(x, len, h.disp, sway, L.rootY); g.stroke();
        if (!h.cut){ g.lineWidth = L.lw*3; drawCurl(tipX, tipY, L.curlR, S.time, col); }
      }
      if (h.flash > 0){
        g.strokeStyle = Lst.red ? 'rgba(255,140,110,'+(0.5*h.flash)+')' : 'rgba(255,255,255,'+(0.45*h.flash)+')';
        g.lineWidth = L.lw*3.5; hairPath(x, len, h.disp, sway, L.rootY); g.stroke();
      }
      g.strokeStyle = col; g.lineWidth = L.lw*(Lst.red?1.2:1);
      hairPath(x, len, h.disp, sway, L.rootY - h.bounce*0); g.stroke();
      if (h.grow >= 1){
        if (!h.cut){
          drawCurl(tipX, tipY, L.curlR, h.wob, col);
        } else {
          // 切り口：斜線と数字のない目盛り
          g.beginPath(); g.moveTo(tipX - 5*u, tipY + 3*u); g.lineTo(tipX + 5*u, tipY - 3*u); g.stroke();
          g.strokeStyle = COL.cyan; g.lineWidth = 1;
          g.beginPath(); g.moveTo(tipX - 9*u, tipY); g.lineTo(tipX - 3*u, tipY);
          g.moveTo(tipX + 3*u, tipY); g.lineTo(tipX + 9*u, tipY); g.stroke();
        }
      }
      // 一曲目と同じ切り口にそろった
      if (Lst.red && h.cut && S.ghost && S.ghost[i] === h.n){
        var af = (S.alignFlash && S.alignFlash[i]) || 0;
        var gx2 = L.hx[i] - L.sp*0.1;
        g.strokeStyle = COL.yellow; g.globalAlpha = 0.6 + 0.4*af; g.lineWidth = 1 + af*2;
        g.beginPath(); g.moveTo(gx2 - 3*u, tipY); g.lineTo(tipX + 3*u, tipY); g.stroke();
        if (af > 0){
          g.beginPath(); g.arc((gx2+tipX)/2, tipY, (6 + 14*(1-af))*u, 0, Math.PI*2); g.stroke();
        }
        g.globalAlpha = 1;
      }
    }
  });
  // 寸法線（最後に切った髪）
  if (S.dimT > 0 && S.lastCut >= 0){
    var arr2 = activeHairs(); h = arr2[S.lastCut];
    var dx = L.hx[S.lastCut] + L.sp*0.36, ty = tipYOf(h.n);
    g.strokeStyle = COL.cyan; g.globalAlpha = Math.min(1, S.dimT); g.lineWidth = 1;
    g.beginPath(); g.moveTo(dx, L.rootY); g.lineTo(dx, ty); g.stroke();
    g.beginPath(); g.moveTo(dx - 4*u, ty + 7*u); g.lineTo(dx, ty); g.lineTo(dx + 4*u, ty + 7*u); g.stroke();
    g.beginPath(); g.moveTo(dx - 4*u, L.rootY - 7*u); g.lineTo(dx, L.rootY); g.lineTo(dx + 4*u, L.rootY - 7*u); g.stroke();
    g.beginPath(); g.moveTo(dx - 7*u, ty); g.lineTo(dx + 4*u, ty); g.stroke();
    g.globalAlpha = 1;
  }
}

function drawRuler(){
  var v = S.rulerVis;
  if (v <= 0.01) return;
  var st = S.stage, u = L.u;
  var pop = S.rulerPop;
  var y = L.rulerY;
  var x0 = lerp(L.hx[0] - L.sp*0.9, L.sa.l + 12, st), x1 = lerp(L.hx[NH-1] + L.sp*0.9, W - L.sa.r - 12, st);
  var th = (9 + 10*st + pop*6)*u;
  var glow = (S.stageOn && S.mode==='play' && !S.sweep) ? (0.5+0.5*Math.sin(S.time*5)) : 0;
  g.save();
  g.globalAlpha = v;
  var yy = y - (1-v)*30*u;
  g.strokeStyle = COL.yellow;
  if (glow > 0){
    g.lineWidth = 8*u + glow*8*u; g.globalAlpha = v*0.25;
    g.strokeRect(x0, yy - th/2, x1-x0, th);
    g.globalAlpha = v;
  }
  g.lineWidth = L.lw*(1 + st*0.8);
  g.strokeRect(x0, yy - th/2, x1-x0, th);
  g.lineWidth = 1;
  var tk = L.sp/4;
  var startX = L.hx[0] - Math.floor((L.hx[0]-x0)/tk)*tk;
  for (var x = startX, k=0; x < x1; x += tk, k++){
    var big = (Math.round((x - L.hx[0])/tk) % 4 === 0);
    g.beginPath(); g.moveTo(x, yy + th/2); g.lineTo(x, yy + th/2 - (big ? th*0.8 : th*0.4)); g.stroke();
  }
  // 走査の刃（縦の定規）
  var bx;
  if (S.sweep) bx = bladeX(S.sweep);
  else bx = x0 + 8*u;
  var bw = (6 + 8*st)*u;
  var by1 = L.rootY - 2;
  g.globalAlpha = v*(S.sweep ? 1 : 0.55);
  g.lineWidth = L.lw*(1 + st*0.6);
  g.beginPath();
  g.moveTo(bx - bw/2, yy + th/2); g.lineTo(bx - bw/2, by1);
  g.moveTo(bx + bw/2, yy + th/2); g.lineTo(bx + bw/2, by1);
  g.moveTo(bx - bw/2, by1); g.lineTo(bx + bw/2, by1);
  g.stroke();
  g.beginPath(); g.moveTo(bx - bw, yy - th/2 - 2); g.lineTo(bx, yy - th/2 - bw*1.3); g.lineTo(bx + bw, yy - th/2 - 2); g.stroke();
  // 刃が当たっている髪の切り口に印
  if (S.sweep){
    var sw = S.sweep, e = sw.ev[Math.max(0, sw.idx-1)];
    if (e && sw.idx > 0 && sw.t - e.t < sw.step*0.9){
      var n = e.src==='c' ? S.ghost[e.i] : activeHairs()[e.i].n;
      var muted = e.src==='r' && !activeHairs()[e.i].cut;
      if (!muted){
        var ny = tipYOf(n);
        var r = (5 + 7*(1 - (sw.t - e.t)/(sw.step*0.9)))*u*(1+st*0.5);
        g.globalAlpha = v;
        g.beginPath(); g.moveTo(bx - bw/2 - r, ny); g.lineTo(bx + bw/2 + r, ny); g.stroke();
        g.beginPath(); g.arc(bx, ny, r, 0, Math.PI*2); g.stroke();
      }
    }
  }
  g.restore();
}

function drawFace(){
  var F = S.face, u = L.u;
  var w = L.headW, hh = L.hh, cx = L.cx, top = L.rootY;
  var wig = Math.sin(S.time*40)*F.wig*3*u;
  var sh = F.tilt * w * 0.09 + wig;    // 首振り：あごが左右へ
  function X(x, y){ return cx + x + sh*(y/hh); }
  var lw = L.lw*1.15;
  g.strokeStyle = COL.line; g.lineWidth = lw; g.lineJoin = 'round'; g.lineCap = 'round';
  // 頭の輪郭（上は平ら：髪の根元）
  var r = w*0.12;
  g.beginPath();
  g.moveTo(X(-w/2 + r, 0), top);
  g.lineTo(X(w/2 - r, 0), top);
  g.quadraticCurveTo(X(w/2, 0), top, X(w/2, r), top + r);
  g.lineTo(X(w/2, hh*0.52), top + hh*0.52);
  g.quadraticCurveTo(X(w*0.46, hh*0.95), top + hh*0.95, X(0, hh), top + hh);
  g.quadraticCurveTo(X(-w*0.46, hh*0.95), top + hh*0.95, X(-w/2, hh*0.52), top + hh*0.52);
  g.lineTo(X(-w/2, r), top + r);
  g.quadraticCurveTo(X(-w/2, 0), top, X(-w/2 + r, 0), top);
  g.stroke();
  // 髪の根元の帯（製図線）
  g.lineWidth = 1; g.strokeStyle = COL.cyan; g.globalAlpha = 0.6;
  g.beginPath(); g.moveTo(X(-w/2 + r, 0), top + 6*u); g.lineTo(X(w/2 - r, 0), top + 6*u); g.stroke();
  g.globalAlpha = 1; g.strokeStyle = COL.line; g.lineWidth = lw;
  // 耳
  var ey = hh*0.42;
  g.beginPath(); g.arc(X(-w/2, ey), top + ey, w*0.06, Math.PI*0.5, Math.PI*1.5); g.stroke();
  g.beginPath(); g.arc(X(w/2, ey), top + ey, w*0.06, -Math.PI*0.5, Math.PI*0.5); g.stroke();
  // 眼鏡と目
  var eyY = hh*0.36, eR = w*0.115, eX = w*0.2;
  var surpriseOpen = Math.max(F.surprise, F.big*0.6);
  [-1,1].forEach(function(s){
    var ex = X(s*eX, eyY), eyy = top + eyY;
    g.beginPath(); g.arc(ex, eyy, eR, 0, Math.PI*2); g.stroke();
    // 瞳（線の円）
    var pr = w*(0.03 + 0.012*surpriseOpen);
    var px = ex + F.gx*eR*0.5, py = eyy + F.gy*eR*0.5;
    if (F.blink > 0.3){
      g.beginPath(); g.moveTo(ex - eR*0.6, eyy); g.lineTo(ex + eR*0.6, eyy); g.stroke();
    } else {
      g.beginPath(); g.arc(px, py, pr, 0, Math.PI*2); g.stroke();
      g.beginPath(); g.arc(px, py, pr*0.35, 0, Math.PI*2); g.stroke();
    }
    // 眉
    var b = F.brow*hh*0.07 + surpriseOpen*hh*0.03 + (F.gy < -0.5 ? hh*0.01 : 0);
    var bY = top + eyY - eR - hh*0.05 - b;
    var tilt = (F.brow*0.4 + F.surprise*0.3) * s;
    g.beginPath();
    g.moveTo(ex - eR*0.75, bY + eR*0.12*tilt*-1 + eR*0.08);
    g.lineTo(ex + eR*0.75, bY - eR*0.12*tilt*-1 + eR*0.08);
    g.stroke();
  });
  g.beginPath(); g.moveTo(X(-eX + eR, eyY), top + eyY); g.lineTo(X(eX - eR, eyY), top + eyY); g.stroke();
  // 鼻
  g.beginPath(); g.moveTo(X(0, hh*0.42), top + hh*0.42); g.lineTo(X(-w*0.04, hh*0.53), top + hh*0.53);
  g.lineTo(X(w*0.025, hh*0.54), top + hh*0.54); g.stroke();
  // 頬（ふくらむ）
  var pf = F.puff;
  [-1,1].forEach(function(s){
    var chx = X(s*w*0.34, hh*0.64), chy = top + hh*0.64;
    var rr = w*(0.055 + 0.05*pf);
    g.beginPath();
    g.arc(chx + s*pf*w*0.035, chy, rr, s>0 ? -Math.PI*0.55 : Math.PI*0.45, s>0 ? Math.PI*0.55 : Math.PI*1.55);
    g.stroke();
    if (pf > 0.3){
      g.lineWidth = 1;
      g.beginPath(); g.moveTo(chx + s*pf*w*0.035 - rr*0.4, chy - rr*0.2); g.lineTo(chx + s*pf*w*0.035 + rr*0.1, chy - rr*0.5); g.stroke();
      g.lineWidth = lw;
    }
  });
  // 口（音高に合わせて開閉）
  var mY = hh*0.77, mo = Math.max(F.mouth, F.surprise*0.35);
  if (pf > 0.4) mo = Math.min(mo, 0.25);   // 頬ぷく中はすぼめ口
  var mx = X(0, mY), my = top + mY;
  var mw = w*(0.13 + 0.07*Math.min(mo,1.4)) * (pf > 0.4 ? 0.55 : 1);
  if (mo < 0.06){
    g.beginPath(); g.arc(mx, my - hh*0.06, w*0.14, Math.PI*0.25, Math.PI*0.75); g.stroke();
  } else {
    var mh = hh*(0.025 + 0.11*Math.min(mo, 1.6));
    g.beginPath(); g.ellipse(mx, my, mw, mh, 0, 0, Math.PI*2); g.stroke();
    if (mh > hh*0.05){
      g.lineWidth = 1;
      g.beginPath(); g.arc(mx, my - mh*0.1, mw*0.5, Math.PI*0.25, Math.PI*0.75); g.stroke();
      g.lineWidth = lw;
    }
  }
  // ひげ（円弧）
  var muY = hh*0.61 - Math.min(mo,1.5)*hh*0.025;
  [-1,1].forEach(function(s){
    var a0 = X(s*w*0.012, muY), y0 = top + muY;
    g.beginPath();
    g.moveTo(a0, y0);
    g.quadraticCurveTo(X(s*w*0.09, muY), y0 - hh*0.07, X(s*w*0.19, muY), y0 + hh*0.005 - pf*hh*0.02);
    g.quadraticCurveTo(X(s*w*0.1, muY), y0 + hh*0.02, a0, y0);
    g.stroke();
  });
  // 襟（直線）
  var nb = top + hh;
  if (nb + 10 < H - L.sa.b){
    g.beginPath();
    g.moveTo(X(-w*0.12, hh), nb - 2); g.lineTo(X(-w*0.2, hh), H - L.sa.b);
    g.moveTo(X(w*0.12, hh), nb - 2); g.lineTo(X(w*0.2, hh), H - L.sa.b);
    g.stroke();
  }
}

function drawFx(){
  var i;
  g.lineCap = 'round';
  for (i=0;i<S.frags.length;i++){
    var f = S.frags[i];
    g.save();
    g.globalAlpha = clamp(f.life, 0, 1);
    var mx = f.x, my = (f.y0 + f.y1)/2;
    g.translate(mx, my); g.rotate(f.rot); g.translate(-mx, -my);
    g.strokeStyle = f.red ? COL.red : COL.line; g.lineWidth = L.lw;
    g.beginPath(); g.moveTo(f.x, f.y0); g.lineTo(f.x, f.y1); g.stroke();
    if (f.curl) drawCurl(f.x, f.y1, L.curlR, 0, g.strokeStyle);
    g.restore();
  }
  g.lineWidth = Math.max(1, L.lw*0.8);
  for (i=0;i<S.particles.length;i++){
    var p = S.particles[i];
    g.strokeStyle = p.c; g.globalAlpha = clamp(p.life*1.8, 0, 1);
    var cx = Math.cos(p.a)*p.len, sy = Math.sin(p.a)*p.len;
    g.beginPath(); g.moveTo(p.x - cx, p.y - sy); g.lineTo(p.x + cx, p.y + sy); g.stroke();
  }
  g.globalAlpha = 1;
}

function drawDemo(){
  var D = S.demo; if (!D.on) return;
  var u = L.u, x, y, a;
  if (D.kind === 'cut'){
    var ti = S.target >= 0 ? S.target : 3;
    var hx = L.hx[ti], h = S.hairs[ti];
    var y0 = L.rootY - lenOf(h.n)*0.5;
    var cyc = (D.t % 1.7)/1.7;
    var k = clamp((cyc - 0.15)/0.6, 0, 1);
    k = k*k*(3 - 2*k);
    x = hx - L.sp*1.3 + k*L.sp*2.6; y = y0 + Math.sin(k*Math.PI)*4*u;
    a = clamp(Math.min(cyc/0.12, (1-cyc)/0.15), 0, 1) * clamp((3.4 - D.t)/0.3, 0, 1);
    // 軌跡
    g.strokeStyle = 'rgba(242,247,255,'+(0.5*a)+')'; g.lineWidth = 1;
    g.setLineDash([5*u, 5*u]);
    g.beginPath(); g.moveTo(hx - L.sp*1.3, y0); g.lineTo(x, y); g.stroke();
    g.setLineDash([]);
  } else {
    var cyc2 = (D.t % 1.1)/1.1;
    x = L.cx; y = L.rulerY + 30*u - Math.sin(Math.min(1,cyc2*2)*Math.PI)*16*u;
    a = clamp((2.2 - D.t)/0.3, 0, 1)*clamp(D.t/0.2,0,1);
    if (cyc2 > 0.45 && cyc2 < 0.7){
      g.strokeStyle = 'rgba(255,210,63,'+(a*(0.7-cyc2)*3)+')'; g.lineWidth = 2;
      g.beginPath(); g.arc(x, L.rulerY, (cyc2-0.45)*120*u, 0, Math.PI*2); g.stroke();
    }
  }
  // 手（線画）
  g.save();
  g.globalAlpha = a;
  g.strokeStyle = COL.line; g.lineWidth = L.lw;
  var s = 15*u;
  g.translate(x, y);
  g.beginPath(); g.arc(0, 0, s*0.35, 0, Math.PI*2); g.stroke();            // 指先
  g.beginPath(); g.moveTo(-s*0.35, 0); g.lineTo(-s*0.35, s*1.6);
  g.moveTo(s*0.35, 0); g.lineTo(s*0.35, s*1.1); g.stroke();
  g.beginPath();
  g.moveTo(s*0.35, s*1.1); g.arc(s*0.65, s*1.1, s*0.3, Math.PI, 0); g.lineTo(s*0.95, s*1.3);
  g.arc(s*1.25, s*1.3, s*0.3, Math.PI, 0); g.lineTo(s*1.55, s*2.4);
  g.quadraticCurveTo(s*1.4, s*3.2, s*0.4, s*3.2);
  g.quadraticCurveTo(-s*0.5, s*3.1, -s*0.9, s*2.1);
  g.lineTo(-s*0.35, s*1.6);
  g.stroke();
  g.restore();
}

function draw(){
  g.setTransform(DPR,0,0,DPR,0,0);
  drawGrid();
  drawScale();
  drawRuler();
  drawHairs();
  drawFace();
  drawFx();
  drawDemo();
}

/* ---------- ループ（rAFのみ・非表示で停止） ---------- */
var rafId = 0, lastT = null;
function frame(ts){
  rafId = 0;
  if (document.hidden) return;
  var dt = lastT === null ? 0.016 : (ts - lastT)/1000;
  lastT = ts;
  dt = clamp(dt, 0, 0.05);       // 復帰時に時間差を一括処理しない
  update(dt);
  draw();
  rafId = requestAnimationFrame(frame);
}
function startLoop(){ if (!rafId && !document.hidden){ lastT = null; rafId = requestAnimationFrame(frame); } }
document.addEventListener('visibilitychange', function(){
  if (document.hidden){
    if (rafId){ cancelAnimationFrame(rafId); rafId = 0; }
    activeId = null; stroke = null;
    try { if (actx && actx.state === 'running') actx.suspend(); } catch(e){}
  } else {
    try { if (actx && actx.state === 'suspended') { var p = actx.resume(); if (p && p.catch) p.catch(function(){}); } } catch(e){}
    startLoop();
  }
});
var rzT = 0;
function onResize(){ layout(); if (!rafId) { draw(); } }
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', function(){ setTimeout(onResize, 120); });

/* ---------- 起動 ---------- */
layout();
startCycle(true);
draw();
startLoop();

// 自動テスト用の読み取り口（画面には何も出さない）
window.__gf = {
  S: S, L: function(){ return L; },
  levels: function(){ return levelsOf(activeHairs()); },
  tipY: tipYOf, freqOf: freqOf,
  cutAt: function(i, y){ return tryCut(i, y, 1); }
};
})();
</script>
